<script>
const DATA = {"sections":[{"id":1,"cn":"IGCSE 题目指令词","en":"Command Words","words":[{"w":"state","zh":"陈述；直接写出","ex":"State the colour of the solution.","exzh":"写出该溶液的颜色。","ipa":"/steɪt/","syl":[[{"t":"state","p":"steɪt"}]],"tip":"拉丁 stare「站立」→ 让答案「站出来」：只写结论，不用解释。"},{"w":"name","zh":"写出名称","ex":"Name the gas produced in the reaction.","exzh":"写出该反应产生的气体名称。","ipa":"/neɪm/","syl":[[{"t":"name","p":"neɪm"}]],"tip":"只要「名字」：写出物质名或气体名，多写解释不得分。"},{"w":"identify","zh":"识别；指出","ex":"Identify the independent variable.","exzh":"指出自变量。","ipa":"/aɪˈdentɪfaɪ/","syl":[[{"t":"i","p":"aɪ"},{"t":"den","p":"ˈden"},{"t":"ti","p":"tɪ"},{"t":"fy","p":"faɪ"}]],"tip":"ident（同一、身份，同 identity）+ -ify（使…）→ 指认出「是哪一个」。"},{"w":"define","zh":"定义","ex":"Define the term diffusion.","exzh":"给“扩散”下定义。","ipa":"/dɪˈfaɪn/","syl":[[{"t":"de","p":"dɪ"},{"t":"fine","p":"ˈfaɪn"}]],"tip":"de-（彻底）+ fine（界限，同 finish 的 fin）→ 划清边界 = 下定义。"},{"w":"describe","zh":"描述现象、变化或趋势","ex":"Describe how the temperature changes.","exzh":"描述温度如何变化。","ipa":"/dɪˈskraɪb/","syl":[[{"t":"de","p":"dɪ"},{"t":"scribe","p":"ˈskraɪb"}]],"tip":"de-（往下）+ scribe（写，同 script 剧本）→ 写下所见 = 描述。"},{"w":"explain","zh":"解释原因","ex":"Explain why the gas can be compressed.","exzh":"解释气体为什么可以被压缩。","ipa":"/ɪksˈpleɪn/","syl":[[{"t":"ex","p":"ɪks"},{"t":"plain","p":"ˈpleɪn"}]],"tip":"ex-（向外）+ plain（平坦）→ 把道理「摊平」讲出来 = 解释。"},{"w":"compare","zh":"比较异同","ex":"Compare the arrangement of particles in solids and liquids.","exzh":"比较固体和液体中粒子的排列。","ipa":"/kəmˈpeə/","syl":[[{"t":"com","p":"kəm"},{"t":"pare","p":"ˈpeə"}]],"tip":"com-（共同）+ par（相等，同 pair 一对）→ 放在一起看异同。"},{"w":"calculate","zh":"计算","ex":"Calculate the mass of the product.","exzh":"计算生成物的质量。","ipa":"/ˈkælkjʊleɪt/","syl":[[{"t":"cal","p":"ˈkæl"},{"t":"cu","p":"kjʊ"},{"t":"late","p":"leɪt"}]],"tip":"calculus 原意「小石子」——古人用石子计数 → 计算。"},{"w":"determine","zh":"根据资料求出；确定","ex":"Determine the boiling point from the graph.","exzh":"根据图像确定沸点。","ipa":"/dɪˈtɜːmɪn/","syl":[[{"t":"de","p":"dɪ"},{"t":"ter","p":"ˈtɜː"},{"t":"mine","p":"mɪn"}]],"tip":"de- + term（界限、期限）→ 定出界限 = 确定、求出。"},{"w":"predict","zh":"预测","ex":"Predict what happens when the temperature increases.","exzh":"预测温度升高时会发生什么。","ipa":"/prɪˈdɪkt/","syl":[[{"t":"pre","p":"prɪ"},{"t":"dict","p":"ˈdɪkt"}]],"tip":"pre-（预先）+ dict（说，同 dictionary）→ 预先说出 = 预测。"},{"w":"suggest","zh":"根据已有信息提出合理答案","ex":"Suggest one reason for the unusual result.","exzh":"对这一异常结果提出一个合理原因。","ipa":"/səˈdʒest/","syl":[[{"t":"sug","p":"sə"},{"t":"gest","p":"ˈdʒest"}]],"tip":"sug-(sub 在下面) + gest（带来，同 gesture）→ 从下面递上一个合理想法。"},{"w":"evaluate","zh":"评价方法、证据或结论","ex":"Evaluate the reliability of the experiment.","exzh":"评价该实验的可靠性。","ipa":"/ɪˈvæljueɪt/","syl":[[{"t":"e","p":"ɪ"},{"t":"val","p":"ˈvæl"},{"t":"u","p":"ju"},{"t":"ate","p":"eɪt"}]],"tip":"e-（出）+ value（价值）→ 把价值说出来 = 评价优缺点。"}]},{"id":2,"cn":"科学探究与数据","en":"Scientific Investigation and Data","words":[{"w":"observation","zh":"观察；观察到的现象","ex":"The formation of bubbles is an observation.","exzh":"产生气泡是一项观察到的现象。","ipa":"/ˌɒbzəˈveɪʃn/","syl":[[{"t":"ob","p":"ˌɒb"},{"t":"ser","p":"zə"},{"t":"va","p":"ˈveɪ"},{"t":"tion","p":"ʃn"}]],"tip":"ob-（朝向）+ serve（看守）→ 盯着看 = 观察；-ation 变名词。"},{"w":"evidence","zh":"证据","ex":"The data provide evidence for the conclusion.","exzh":"这些数据为结论提供了证据。","ipa":"/ˈevɪdəns/","syl":[[{"t":"e","p":"ˈe"},{"t":"vi","p":"vɪ"},{"t":"dence","p":"dəns"}]],"tip":"e-（出）+ vid（看，同 video）→ 看得出来的东西 = 证据。"},{"w":"hypothesis","zh":"假设；可检验的预测","ex":"The student tests the hypothesis that heat increases the reaction rate.","exzh":"学生检验“加热会提高反应速率”这一假设。","ipa":"/haɪˈpɒθəsɪs/","syl":[[{"t":"hy","p":"haɪ"},{"t":"po","p":"ˈpɒ"},{"t":"the","p":"θə"},{"t":"sis","p":"sɪs"}]],"tip":"hypo-（在下面）+ thesis（论点）→ 垫在论点下面的「假设」。"},{"w":"variable","zh":"变量","ex":"Only one variable should be changed at a time.","exzh":"每次只应改变一个变量。","ipa":"/ˈveəriəbl/","syl":[[{"t":"va","p":"ˈveə"},{"t":"ri","p":"ri"},{"t":"a","p":"ə"},{"t":"ble","p":"bl"}]],"tip":"vary（变化）+ -able → 会变的量 = 变量。"},{"w":"independent variable","zh":"自变量；主动改变的量","ex":"Temperature is the independent variable in this experiment.","exzh":"温度是这个实验中的自变量。","ipa":"/ˌɪndɪˈpendənt ˈveəriəbl/","syl":[[{"t":"in","p":"ˌɪn"},{"t":"de","p":"dɪ"},{"t":"pen","p":"ˈpen"},{"t":"dent","p":"dənt"}],[{"t":"va","p":"ˈveə"},{"t":"ri","p":"ri"},{"t":"a","p":"ə"},{"t":"ble","p":"bl"}]],"tip":"in-（不）+ depend（依赖）→ 不依赖别人、由你主动改变的量。"},{"w":"dependent variable","zh":"因变量；测量的量","ex":"The time taken is the dependent variable.","exzh":"所需时间是因变量。","ipa":"/dɪˈpendənt ˈveəriəbl/","syl":[[{"t":"de","p":"dɪ"},{"t":"pen","p":"ˈpen"},{"t":"dent","p":"dənt"}],[{"t":"va","p":"ˈveə"},{"t":"ri","p":"ri"},{"t":"a","p":"ə"},{"t":"ble","p":"bl"}]],"tip":"de-（向下）+ pend（悬挂，同 pendant 吊坠）→ 挂在自变量上的量 = 因变量。"},{"w":"control variable","zh":"控制变量；保持不变的量","ex":"The volume of water is a control variable.","exzh":"水的体积是一个控制变量。","ipa":"/kənˈtrəʊl ˈveəriəbl/","syl":[[{"t":"con","p":"kən"},{"t":"trol","p":"ˈtrəʊl"}],[{"t":"va","p":"ˈveə"},{"t":"ri","p":"ri"},{"t":"a","p":"ə"},{"t":"ble","p":"bl"}]],"tip":"被你「控住不许动」的量；考试常问 name two control variables。"},{"w":"fair test","zh":"公平实验；单一变量实验","ex":"A fair test changes one factor and keeps the others constant.","exzh":"公平实验只改变一个因素，并保持其他因素不变。","ipa":"/feə test/","syl":[[{"t":"fair","p":"feə"}],[{"t":"test","p":"test"}]],"tip":"fair「公平」= 只改一个，其他全部不变。"},{"w":"method","zh":"实验方法","ex":"Write a method for separating sand from water.","exzh":"写出将沙子与水分离的实验方法。","ipa":"/ˈmeθəd/","syl":[[{"t":"me","p":"ˈme"},{"t":"thod","p":"θəd"}]],"tip":"meta（沿着）+ hodos（路）→ 沿着一条路走 = 方法、步骤。"},{"w":"procedure","zh":"实验步骤；操作流程","ex":"Follow the procedure carefully.","exzh":"认真按照实验步骤操作。","ipa":"/prəˈsiːdʒə/","syl":[[{"t":"pro","p":"prə"},{"t":"ce","p":"ˈsiː"},{"t":"dure","p":"dʒə"}]],"tip":"pro-（向前）+ ceed（走，同 proceed）→ 一步步往前走 = 操作流程。"},{"w":"result","zh":"结果；测量所得数据","ex":"Record each result in the table.","exzh":"把每个结果记录在表格中。","ipa":"/rɪˈzʌlt/","syl":[[{"t":"re","p":"rɪ"},{"t":"sult","p":"ˈzʌlt"}]],"tip":"re-（回）+ sult（跳，同 salt 跳跃词根）→ 事情做完「跳回来」的东西 = 结果。"},{"w":"conclusion","zh":"结论","ex":"The conclusion must be supported by the results.","exzh":"结论必须得到实验结果的支持。","ipa":"/kənˈkluːʒn/","syl":[[{"t":"con","p":"kən"},{"t":"clu","p":"ˈkluː"},{"t":"sion","p":"ʒn"}]],"tip":"con-（一起）+ clud（关闭，同 close）→ 把讨论关起来 = 结论。"},{"w":"accuracy","zh":"准确度；接近真实值的程度","ex":"Using a more precise balance may improve the accuracy of the measurement.","exzh":"使用更精密的天平可能提高测量的准确度。","ipa":"/ˈækjʊrəsi/","syl":[[{"t":"ac","p":"ˈæ"},{"t":"cu","p":"kjʊ"},{"t":"ra","p":"rə"},{"t":"cy","p":"si"}]],"tip":"accurate（准确）的名词。准确 = 靠近真值；和 precision 是考试送分对比题。"},{"w":"precision","zh":"精密度；多次测量彼此接近的程度","ex":"The repeated readings have high precision.","exzh":"这些重复读数具有较高精密度。","ipa":"/prɪˈsɪʒn/","syl":[[{"t":"pre","p":"prɪ"},{"t":"ci","p":"ˈsɪ"},{"t":"sion","p":"ʒn"}]],"tip":"pre-（预先）+ cis（切，同 scissors 剪刀）→ 切得整齐 = 多次测量彼此接近。"},{"w":"reliability","zh":"可靠性；重复时结果是否一致","ex":"Repeating the experiment improves the reliability of the results.","exzh":"重复实验可以提高结果的可靠性。","ipa":"/rɪˌlaɪəˈbɪləti/","syl":[[{"t":"re","p":"rɪ"},{"t":"li","p":"ˌlaɪ"},{"t":"a","p":"ə"},{"t":"bi","p":"ˈbɪ"},{"t":"li","p":"lə"},{"t":"ty","p":"ti"}]],"tip":"rely（依靠）→ 结果值不值得依靠 = 重复做是否一致。"},{"w":"repeat","zh":"重复","ex":"Repeat the test three times.","exzh":"将该测试重复三次。","ipa":"/rɪˈpiːt/","syl":[[{"t":"re","p":"rɪ"},{"t":"peat","p":"ˈpiːt"}]],"tip":"re-（再）+ peat(pet 追求)→ 再做一次 = 重复。"},{"w":"mean","zh":"平均值","ex":"Calculate the mean of the three readings.","exzh":"计算三次读数的平均值。","ipa":"/miːn/","syl":[[{"t":"mean","p":"miːn"}]],"tip":"此处不是「意思」，是「平均值」= 总和 ÷ 次数。"},{"w":"anomalous result","zh":"异常结果；异常数据","ex":"The value of 35 seconds is an anomalous result.","exzh":"35 秒这个数据是一个异常结果。","ipa":"/əˈnɒmələs rɪˈzʌlt/","syl":[[{"t":"a","p":"ə"},{"t":"nom","p":"ˈnɒm"},{"t":"a","p":"ə"},{"t":"lous","p":"ləs"}],[{"t":"re","p":"rɪ"},{"t":"sult","p":"ˈzʌlt"}]],"tip":"a-（不）+ nomos（规律）→ 不合规律的点 = 异常值，作图时不连进去。"}]},{"id":3,"cn":"测量、数量与变化","en":"Measurement, Quantities and Trends","words":[{"w":"mass","zh":"质量","ex":"The mass of the sample is 5.0 g.","exzh":"样品的质量为5.0 克。","ipa":"/mæs/","syl":[[{"t":"mass","p":"mæs"}]],"tip":"质量，单位 g / kg；和 weight（重力）不是一回事。"},{"w":"volume","zh":"体积","ex":"Measure the volume of the liquid in cm³.","exzh":"用立方厘米测量液体体积。","ipa":"/ˈvɒljuːm/","syl":[[{"t":"vo","p":"ˈvɒ"},{"t":"lume","p":"ljuːm"}]],"tip":"体积，单位 cm³ / dm³；量筒读数看凹液面最低处。"},{"w":"temperature","zh":"温度","ex":"The temperature rises during the reaction.","exzh":"反应过程中温度升高。","ipa":"/ˈtempərətʃə/","syl":[[{"t":"tem","p":"ˈtem"},{"t":"per","p":"pər"},{"t":"a","p":"ə"},{"t":"ture","p":"tʃə"}]],"tip":"temper（调和、脾气）→ 冷热的程度。口语读作 4 音节，快读常吞成 /ˈtemprətʃə/。"},{"w":"time","zh":"时间","ex":"Measure the time taken for the solid to dissolve.","exzh":"测量固体完全溶解所需的时间。","ipa":"/taɪm/","syl":[[{"t":"time","p":"taɪm"}]],"tip":"时间，单位 s / min；速率题里几乎必出现。","tr":{"pat":"祈使句 + 后置定语","flow":[["Measure","要测量……","v"],["the time","某个时间","h"],["taken","花掉的","d"],["for the solid to dissolve","用来让固体溶解","d"]],"core":["Measure the time","测量……时间"],"tree":[[0,"the time","时间"],[1,"taken","所需的"],[2,"for the solid to dissolve","固体溶解"]],"asm":["固体溶解","所需的","时间"],"final":[["测量","v"],["固体完全溶解","d"],["所需的","d"],["时间","h"],["。",""]],"tip":"没有主语、动词原形开头 → 祈使句。先抓主干「Measure the time = 测量……时间」，剩下的全挂在 time 上，一层套一层。中文从最里层往外依次前置，中心词「时间」最后说。"}},{"w":"length","zh":"长度","ex":"Measure the length of the wire.","exzh":"测量导线的长度。","ipa":"/leŋθ/","syl":[[{"t":"length","p":"leŋθ"}]],"tip":"long 的名词形式（long → length），结尾 -th 咬舌。"},{"w":"distance","zh":"距离","ex":"The particles travel a short distance.","exzh":"这些粒子移动了一小段距离。","ipa":"/ˈdɪstəns/","syl":[[{"t":"dis","p":"ˈdɪs"},{"t":"tance","p":"təns"}]],"tip":"dis-（分开）+ stant（站）→ 两点分开站着的间隔。"},{"w":"concentration","zh":"浓度","ex":"A higher concentration gives more particles per unit volume.","exzh":"更高浓度意味着单位体积内有更多粒子。","ipa":"/ˌkɒnsənˈtreɪʃn/","syl":[[{"t":"con","p":"ˌkɒn"},{"t":"cen","p":"sən"},{"t":"tra","p":"ˈtreɪ"},{"t":"tion","p":"ʃn"}]],"tip":"con-（一起）+ centre（中心）→ 都挤到中心 = 浓度（也可指「专注」）。"},{"w":"rate","zh":"速率","ex":"The rate of reaction decreases with time.","exzh":"反应速率随时间下降。","ipa":"/reɪt/","syl":[[{"t":"rate","p":"reɪt"}]],"tip":"「每单位时间的变化量」；reaction rate、rate of change 都用它。"},{"w":"increase","zh":"增加；升高","ex":"The pressure increases when the gas is heated.","exzh":"气体受热时，压强升高。","ipa":"/ɪnˈkriːs/","syl":[[{"t":"in","p":"ɪn"},{"t":"crease","p":"ˈkriːs"}]],"tip":"in-（向内）+ cres（生长，同 crescent 新月渐圆）→ 增加。"},{"w":"decrease","zh":"减少；降低","ex":"The volume decreases when the gas is compressed.","exzh":"气体被压缩时，体积减小。","ipa":"/dɪˈkriːs/","syl":[[{"t":"de","p":"dɪ"},{"t":"crease","p":"ˈkriːs"}]],"tip":"de-（向下）+ cres（生长）→ 反向生长 = 减少。与 increase 成对记。"},{"w":"remain constant","zh":"保持不变","ex":"The temperature remains constant during boiling.","exzh":"沸腾过程中温度保持不变。","ipa":"/rɪˈmeɪn ˈkɒnstənt/","syl":[[{"t":"re","p":"rɪ"},{"t":"main","p":"ˈmeɪn"}],[{"t":"con","p":"ˈkɒn"},{"t":"stant","p":"stənt"}]],"tip":"con-（一起）+ stant（站）→ 一直站着不动 = 保持不变（熔化时温度就是这样）。"},{"w":"measure","zh":"测量","ex":"Measure the temperature every minute.","exzh":"每分钟测量一次温度。","ipa":"/ˈmeʒə/","syl":[[{"t":"mea","p":"ˈme"},{"t":"sure","p":"ʒə"}]],"tip":"mea- 读 /me/ 不读 /miː/；名词 measurement = 测量值。"},{"w":"record","zh":"记录","ex":"Record all observations clearly.","exzh":"清楚地记录所有实验现象。","ipa":"/rɪˈkɔːd/","syl":[[{"t":"re","p":"rɪ"},{"t":"cord","p":"ˈkɔːd"}]],"tip":"re-（再）+ cord（心，同 cardiac）→ 再放回心里 = 记录。动词重音在后，名词 /ˈrekɔːd/ 在前。"},{"w":"unit","zh":"单位","ex":"Always include the correct unit in your answer.","exzh":"答案中必须写出正确单位。","ipa":"/ˈjuːnɪt/","syl":[[{"t":"u","p":"ˈjuː"},{"t":"nit","p":"nɪt"}]],"tip":"uni-（一）→ 一个标准量 = 单位；答题不写单位要扣分。"},{"w":"scale","zh":"刻度；标度","ex":"Read the scale at eye level.","exzh":"在视线与刻度水平时读数。","ipa":"/skeɪl/","syl":[[{"t":"scale","p":"skeɪl"}]],"tip":"刻度、量程，也指天平；choose a suitable scale 是作图必考。"}]},{"id":4,"cn":"物质与粒子模型","en":"Matter and the Particle Model","words":[{"w":"matter","zh":"物质；有质量并占据空间的东西","ex":"Air is matter because it has mass and occupies space.","exzh":"空气是物质，因为它有质量并占据空间。","ipa":"/ˈmætə/","syl":[[{"t":"mat","p":"ˈmæ"},{"t":"ter","p":"tə"}]],"tip":"占据空间、有质量的东西 = 物质；state of matter 物态。"},{"w":"substance","zh":"物质；具有特定组成的物质","ex":"Water is a pure substance when it contains only H₂O.","exzh":"当水中只含H₂O 时，它是纯净物。","ipa":"/ˈsʌbstəns/","syl":[[{"t":"sub","p":"ˈsʌb"},{"t":"stance","p":"stəns"}]],"tip":"sub-（在下）+ stance（站）→ 站在现象底下的东西 = 物质本体。"},{"w":"material","zh":"材料","ex":"Glass is a useful material for laboratory equipment.","exzh":"玻璃是制造实验器材的常用材料。","ipa":"/məˈtɪəriəl/","syl":[[{"t":"ma","p":"mə"},{"t":"te","p":"ˈtɪə"},{"t":"ri","p":"ri"},{"t":"al","p":"əl"}]],"tip":"matter 的形容词化 → 材料，强调「用来做东西的物质」。"},{"w":"property","zh":"性质；特性","ex":"Boiling point is a physical property.","exzh":"沸点是一种物理性质。","ipa":"/ˈprɒpəti/","syl":[[{"t":"pro","p":"ˈprɒ"},{"t":"per","p":"pə"},{"t":"ty","p":"ti"}]],"tip":"proper（本身特有的）→ 物质自带的性质，如熔点、导电性。"},{"w":"particle","zh":"粒子；微粒","ex":"All matter is made of tiny particles.","exzh":"所有物质都由微小粒子构成。","ipa":"/ˈpɑːtɪkl/","syl":[[{"t":"par","p":"ˈpɑː"},{"t":"ti","p":"tɪ"},{"t":"cle","p":"kl"}]],"tip":"part（部分）+ -icle（小）→ 极小的一份 = 粒子。"},{"w":"atom","zh":"原子","ex":"An atom is the smallest particle of an element that takes part in a chemical reaction.","exzh":"原子是能够参加化学反应的元素最小粒子。","ipa":"/ˈætəm/","syl":[[{"t":"a","p":"ˈæ"},{"t":"tom","p":"təm"}]],"tip":"a-（不）+ tom（切，同 anatomy 解剖）→ 不可再切 = 原子。"},{"w":"molecule","zh":"分子","ex":"A water molecule contains two hydrogen atoms and one oxygen atom.","exzh":"一个水分子含两个氢原子和一个氧原子。","ipa":"/ˈmɒlɪkjuːl/","syl":[[{"t":"mo","p":"ˈmɒ"},{"t":"le","p":"lɪ"},{"t":"cule","p":"kjuːl"}]],"tip":"moles（一团）+ -cule（小）→ 一小团原子 = 分子。"},{"w":"ion","zh":"离子；带电粒子","ex":"A sodium ion has a positive charge.","exzh":"钠离子带正电。","ipa":"/ˈaɪən/","syl":[[{"t":"i","p":"ˈaɪ"},{"t":"on","p":"ən"}]],"tip":"希腊语「走的东西」→ 带电、会向电极跑的粒子 = 离子。"},{"w":"element","zh":"元素","ex":"Oxygen is an element because it contains only oxygen atoms.","exzh":"氧气是元素，因为它只含氧原子。","ipa":"/ˈelɪmənt/","syl":[[{"t":"e","p":"ˈe"},{"t":"le","p":"lɪ"},{"t":"ment","p":"mənt"}]],"tip":"只含一种原子的纯净物 = 元素／单质；周期表上的每一格。"},{"w":"compound","zh":"化合物","ex":"Water is a compound of hydrogen and oxygen.","exzh":"水是由氢和氧组成的化合物。","ipa":"/ˈkɒmpaʊnd/","syl":[[{"t":"com","p":"ˈkɒm"},{"t":"pound","p":"paʊnd"}]],"tip":"com-（一起）+ pound（放）→ 不同元素化学结合 = 化合物（能写化学式）。"},{"w":"mixture","zh":"混合物","ex":"Air is a mixture of several gases.","exzh":"空气是多种气体的混合物。","ipa":"/ˈmɪkstʃə/","syl":[[{"t":"mix","p":"ˈmɪks"},{"t":"ture","p":"tʃə"}]],"tip":"mix + -ture → 混合物：只是混在一起，可用物理方法分开。"},{"w":"pure substance","zh":"纯净物","ex":"A pure substance has a fixed composition.","exzh":"纯净物具有固定的组成。","ipa":"/pjʊə ˈsʌbstəns/","syl":[[{"t":"pure","p":"pjʊə"}],[{"t":"sub","p":"ˈsʌb"},{"t":"stance","p":"stəns"}]],"tip":"纯净物：只有一种物质，熔沸点是一个固定值（不是范围）。"},{"w":"solid","zh":"固体","ex":"A solid has a fixed shape and a fixed volume.","exzh":"固体具有固定形状和固定体积。","ipa":"/ˈsɒlɪd/","syl":[[{"t":"so","p":"ˈsɒ"},{"t":"lid","p":"lɪd"}]],"tip":"固体：粒子排列紧密规则、只在固定位置振动。"},{"w":"liquid","zh":"液体","ex":"A liquid has a fixed volume but no fixed shape.","exzh":"液体有固定体积，但没有固定形状。","ipa":"/ˈlɪkwɪd/","syl":[[{"t":"li","p":"ˈlɪ"},{"t":"quid","p":"kwɪd"}]],"tip":"液体：粒子仍紧挨但可滑动 → 有固定体积、无固定形状。"},{"w":"gas","zh":"气体","ex":"A gas fills the whole container.","exzh":"气体会充满整个容器。","ipa":"/ɡæs/","syl":[[{"t":"gas","p":"ɡæs"}]],"tip":"气体：粒子相距很远、随机快速运动 → 可被压缩。"},{"w":"state of matter","zh":"物质状态","ex":"Solid, liquid and gas are states of matter.","exzh":"固体、液体和气体是物质的三种状态。","ipa":"/steɪt əv ˈmætə/","syl":[[{"t":"state","p":"steɪt"}],[{"t":"of","p":"əv"}],[{"t":"mat","p":"ˈmæ"},{"t":"ter","p":"tə"}]],"tip":"物态：固、液、气三态；变化只改排列和运动，不改粒子本身。"},{"w":"arrangement","zh":"排列方式","ex":"The particles in a solid have a regular arrangement.","exzh":"固体中的粒子排列规则。","ipa":"/əˈreɪndʒmənt/","syl":[[{"t":"ar","p":"ə"},{"t":"range","p":"ˈreɪndʒ"},{"t":"ment","p":"mənt"}]],"tip":"arrange（排列）+ -ment → 粒子的排列方式，答粒子模型题的关键词。"},{"w":"motion","zh":"运动","ex":"Gas particles are in rapid random motion.","exzh":"气体粒子做快速的随机运动。","ipa":"/ˈməʊʃn/","syl":[[{"t":"mo","p":"ˈməʊ"},{"t":"tion","p":"ʃn"}]],"tip":"mot（动，同 motor 马达）→ 运动；粒子永不停息地运动。"},{"w":"fixed position","zh":"固定位置","ex":"Particles in a solid vibrate about fixed positions.","exzh":"固体中的粒子在固定位置附近振动。","ipa":"/fɪkst pəˈzɪʃn/","syl":[[{"t":"fixed","p":"fɪkst"}],[{"t":"po","p":"pə"},{"t":"si","p":"ˈzɪ"},{"t":"tion","p":"ʃn"}]],"tip":"固定位置：固体粒子只能在原地振动，不能换位。"},{"w":"compress","zh":"压缩","ex":"A gas is easier to compress than a liquid.","exzh":"气体比液体更容易被压缩。","ipa":"/kəmˈpres/","syl":[[{"t":"com","p":"kəm"},{"t":"press","p":"ˈpres"}]],"tip":"com-（一起）+ press（压）→ 压到一起 = 压缩；只有气体易压缩。"}]},{"id":5,"cn":"化学反应、溶液与能量","en":"Chemical Reactions, Solutions and Energy","words":[{"w":"reactant","zh":"反应物","ex":"Magnesium and oxygen are the reactants.","exzh":"镁和氧气是反应物。","ipa":"/riˈæktənt/","syl":[[{"t":"re","p":"ri"},{"t":"ac","p":"ˈæk"},{"t":"tant","p":"tənt"}]],"tip":"react（反应）+ -ant（做…的物）→ 参加反应的物质，写在箭头左边。"},{"w":"product","zh":"生成物；产物","ex":"Magnesium oxide is the product.","exzh":"氧化镁是生成物。","ipa":"/ˈprɒdʌkt/","syl":[[{"t":"pro","p":"ˈprɒ"},{"t":"duct","p":"dʌkt"}]],"tip":"pro-（向前）+ duct（引导，同 conduct）→ 被引出来的东西 = 生成物，在箭头右边。"},{"w":"chemical reaction","zh":"化学反应","ex":"A chemical reaction forms one or more new substances.","exzh":"化学反应会生成一种或多种新物质。","ipa":"/ˈkemɪkl riˈækʃn/","syl":[[{"t":"che","p":"ˈke"},{"t":"mi","p":"mɪ"},{"t":"cal","p":"kl"}],[{"t":"re","p":"ri"},{"t":"ac","p":"ˈæk"},{"t":"tion","p":"ʃn"}]],"tip":"化学反应：生成了新物质（常伴变色、放气、放热）。"},{"w":"physical change","zh":"物理变化","ex":"Melting is a physical change because no new substance is formed.","exzh":"熔化是物理变化，因为没有新物质生成。","ipa":"/ˈfɪzɪkl tʃeɪndʒ/","syl":[[{"t":"phy","p":"ˈfɪ"},{"t":"si","p":"zɪ"},{"t":"cal","p":"kl"}],[{"t":"change","p":"tʃeɪndʒ"}]],"tip":"物理变化：没有新物质，通常可逆（熔化、溶解）。"},{"w":"chemical change","zh":"化学变化","ex":"Rusting is a chemical change.","exzh":"生锈是一种化学变化。","ipa":"/ˈkemɪkl tʃeɪndʒ/","syl":[[{"t":"che","p":"ˈke"},{"t":"mi","p":"mɪ"},{"t":"cal","p":"kl"}],[{"t":"change","p":"tʃeɪndʒ"}]],"tip":"化学变化：有新物质生成，通常不易逆转。与 physical change 对照记。"},{"w":"dissolve","zh":"溶解","ex":"Salt dissolves in water.","exzh":"食盐溶解在水中。","ipa":"/dɪˈzɒlv/","syl":[[{"t":"dis","p":"dɪ"},{"t":"solve","p":"ˈzɒlv"}]],"tip":"dis-（分开）+ solve（松开）→ 散开进溶剂里 = 溶解。ss 在这里读 /z/。"},{"w":"solution","zh":"溶液","ex":"A solution forms when a solute dissolves in a solvent.","exzh":"溶质溶解在溶剂中形成溶液。","ipa":"/səˈluːʃn/","syl":[[{"t":"so","p":"sə"},{"t":"lu","p":"ˈluː"},{"t":"tion","p":"ʃn"}]],"tip":"solve 的名词 → 溶液 = 溶质 + 溶剂（也表示「答案」）。"},{"w":"solute","zh":"溶质","ex":"Salt is the solute in salt water.","exzh":"盐水中的食盐是溶质。","ipa":"/ˈsɒljuːt/","syl":[[{"t":"so","p":"ˈsɒ"},{"t":"lute","p":"ljuːt"}]],"tip":"被溶解的那个（盐）；-ute 结尾 = 被动的一方。"},{"w":"solvent","zh":"溶剂","ex":"Water is the solvent in salt water.","exzh":"盐水中的水是溶剂。","ipa":"/ˈsɒlvənt/","syl":[[{"t":"sol","p":"ˈsɒl"},{"t":"vent","p":"vənt"}]],"tip":"去溶解别人的那个（水）；-ent 结尾 = 主动的一方。"},{"w":"soluble","zh":"可溶的","ex":"Sugar is soluble in water.","exzh":"糖可溶于水。","ipa":"/ˈsɒljʊbl/","syl":[[{"t":"so","p":"ˈsɒ"},{"t":"lu","p":"ljʊ"},{"t":"ble","p":"bl"}]],"tip":"solve + -uble（能够）→ 可溶的。"},{"w":"insoluble","zh":"不溶的","ex":"Sand is insoluble in water.","exzh":"沙子不溶于水。","ipa":"/ɪnˈsɒljʊbl/","syl":[[{"t":"in","p":"ɪn"},{"t":"so","p":"ˈsɒ"},{"t":"lu","p":"ljʊ"},{"t":"ble","p":"bl"}]],"tip":"in-（不）+ soluble → 不溶的；沉淀就是 insoluble 产物。"},{"w":"saturated solution","zh":"饱和溶液","ex":"A saturated solution cannot dissolve more solute at that temperature.","exzh":"在该温度下，饱和溶液不能再溶解更多溶质。","ipa":"/ˈsætʃəreɪtɪd səˈluːʃn/","syl":[[{"t":"sa","p":"ˈsæ"},{"t":"tu","p":"tʃə"},{"t":"ra","p":"reɪ"},{"t":"ted","p":"tɪd"}],[{"t":"so","p":"sə"},{"t":"lu","p":"ˈluː"},{"t":"tion","p":"ʃn"}]],"tip":"satur（充满）→ 灌满了、再也溶不下 = 饱和溶液。"},{"w":"aqueous","zh":"水溶液中的；溶于水的","ex":"NaCl(aq) means sodium chloride dissolved in water.","exzh":"NaCl(aq)表示氯化钠溶解在水中。","ipa":"/ˈeɪkwiəs/","syl":[[{"t":"a","p":"ˈeɪ"},{"t":"que","p":"kwi"},{"t":"ous","p":"əs"}]],"tip":"aqua（水，同 aquarium 水族馆）→ 水溶液的，方程式里写 (aq)。注意读 /ˈeɪkwiəs/。"},{"w":"precipitate","zh":"沉淀；反应中生成的不溶性固体","ex":"A white precipitate forms when the two solutions are mixed.","exzh":"两种溶液混合时生成白色沉淀。","ipa":"/prɪˈsɪpɪteɪt/","syl":[[{"t":"pre","p":"prɪ"},{"t":"ci","p":"ˈsɪ"},{"t":"pi","p":"pɪ"},{"t":"tate","p":"teɪt"}]],"tip":"pre-（向前）+ cipit（头，同 capital）→ 一头栽下去 = 沉淀。"},{"w":"acid","zh":"酸","ex":"Hydrochloric acid reacts with magnesium.","exzh":"盐酸与镁反应。","ipa":"/ˈæsɪd/","syl":[[{"t":"a","p":"ˈæ"},{"t":"cid","p":"sɪd"}]],"tip":"acid 原意「酸的」→ pH < 7，遇石蕊变红。"},{"w":"base","zh":"碱性物质；能中和酸的物质","ex":"Copper oxide is a base that reacts with acids.","exzh":"氧化铜是一种能与酸反应的碱性物质。","ipa":"/beɪs/","syl":[[{"t":"base","p":"beɪs"}]],"tip":"碱（能中和酸的物质）；溶于水的碱才叫 alkali。"},{"w":"alkali","zh":"碱；可溶于水的碱","ex":"Sodium hydroxide is an alkali.","exzh":"氢氧化钠是一种碱。","ipa":"/ˈælkəlaɪ/","syl":[[{"t":"al","p":"ˈæl"},{"t":"ka","p":"kə"},{"t":"li","p":"laɪ"}]],"tip":"来自阿拉伯语 al-qaly（草木灰）→ 可溶的碱，pH > 7。结尾读 /laɪ/。"},{"w":"neutralisation","zh":"中和反应","ex":"Neutralisation produces a salt and water.","exzh":"中和反应生成盐和水。","ipa":"/ˌnjuːtrəlaɪˈzeɪʃn/","syl":[[{"t":"neu","p":"ˌnjuː"},{"t":"tra","p":"trə"},{"t":"li","p":"laɪ"},{"t":"sa","p":"ˈzeɪ"},{"t":"tion","p":"ʃn"}]],"tip":"neutral（中性）→ 酸 + 碱 → 盐 + 水，pH 走向 7。"},{"w":"indicator","zh":"指示剂","ex":"Universal indicator shows the pH of a solution.","exzh":"通用指示剂可以显示溶液的pH。","ipa":"/ˈɪndɪkeɪtə/","syl":[[{"t":"in","p":"ˈɪn"},{"t":"di","p":"dɪ"},{"t":"ca","p":"keɪ"},{"t":"tor","p":"tə"}]],"tip":"indicate（指示）+ -or（物）→ 用颜色指示酸碱的东西。"},{"w":"pH","zh":"酸碱度；pH 值","ex":"A solution with pH 2 is acidic.","exzh":"pH 为2 的溶液呈酸性。","ipa":"/piːeɪtʃ/","syl":[[{"t":"p","p":"piː"},{"t":"H","p":"eɪtʃ"}]],"tip":"读作「批-埃曲」两个字母。< 7 酸，= 7 中性，> 7 碱。"},{"w":"catalyst","zh":"催化剂","ex":"A catalyst increases the rate of reaction without being used up.","exzh":"催化剂在自身不被消耗的情况下提高反应速率。","ipa":"/ˈkætəlɪst/","syl":[[{"t":"ca","p":"ˈkæ"},{"t":"ta","p":"tə"},{"t":"lyst","p":"lɪst"}]],"tip":"cata-（向下）+ lys（松解，同 analysis）→ 帮忙拆开、自己不变的物质。"},{"w":"reaction rate","zh":"反应速率","ex":"Powdered calcium carbonate has a faster reaction rate.","exzh":"粉末状碳酸钙的反应速率更快。","ipa":"/riˈækʃn reɪt/","syl":[[{"t":"re","p":"ri"},{"t":"ac","p":"ˈæk"},{"t":"tion","p":"ʃn"}],[{"t":"rate","p":"reɪt"}]],"tip":"反应速率：升温、增浓、加催化剂、增大表面积都会变快。"},{"w":"collision","zh":"碰撞","ex":"A reaction occurs when particles collide successfully.","exzh":"粒子发生有效碰撞时，反应才会发生。","ipa":"/kəˈlɪʒn/","syl":[[{"t":"col","p":"kə"},{"t":"li","p":"ˈlɪ"},{"t":"sion","p":"ʒn"}]],"tip":"col-（一起）+ lid（撞）→ 撞在一起 = 碰撞；碰撞理论解释速率。"},{"w":"kinetic energy","zh":"动能","ex":"Heating gives the particles more kinetic energy.","exzh":"加热使粒子获得更多动能。","ipa":"/kɪˈnetɪk ˈenədʒi/","syl":[[{"t":"ki","p":"kɪ"},{"t":"ne","p":"ˈne"},{"t":"tic","p":"tɪk"}],[{"t":"e","p":"ˈe"},{"t":"ner","p":"nə"},{"t":"gy","p":"dʒi"}]],"tip":"kine（运动，同 cinema 电影＝动起来的画）→ 动能，温度越高动能越大。"},{"w":"attractive force","zh":"吸引力","ex":"Energy is needed to overcome the attractive forces between particles.","exzh":"克服粒子之间的吸引力需要能量。","ipa":"/əˈtræktɪv fɔːs/","syl":[[{"t":"at","p":"ə"},{"t":"trac","p":"ˈtræk"},{"t":"tive","p":"tɪv"}],[{"t":"force","p":"fɔːs"}]],"tip":"at- + tract（拉，同 tractor 拖拉机）→ 把粒子拉在一起的引力。"},{"w":"exothermic","zh":"放热的","ex":"Combustion is an exothermic reaction.","exzh":"燃烧是一种放热反应。","ipa":"/ˌeksəʊˈθɜːmɪk/","syl":[[{"t":"ex","p":"ˌek"},{"t":"o","p":"səʊ"},{"t":"ther","p":"ˈθɜː"},{"t":"mic","p":"mɪk"}]],"tip":"exo-（向外）+ therm（热，同 thermometer）→ 热跑出来 = 放热，温度计示数升高。"},{"w":"endothermic","zh":"吸热的","ex":"Thermal decomposition is often endothermic.","exzh":"热分解通常是吸热过程。","ipa":"/ˌendəʊˈθɜːmɪk/","syl":[[{"t":"en","p":"ˌen"},{"t":"do","p":"dəʊ"},{"t":"ther","p":"ˈθɜː"},{"t":"mic","p":"mɪk"}]],"tip":"endo-（向内）+ therm（热）→ 热被吸进去 = 吸热，温度下降。与 exo- 对照记。"},{"w":"melting","zh":"熔化","ex":"Melting is the change from a solid to a liquid.","exzh":"熔化是固体变为液体的过程。","ipa":"/ˈmeltɪŋ/","syl":[[{"t":"mel","p":"ˈmel"},{"t":"ting","p":"tɪŋ"}]],"tip":"熔化：固 → 液，吸热；熔化过程中温度保持不变。"},{"w":"freezing","zh":"凝固；冻结","ex":"Water freezes at 0 °C under normal conditions.","exzh":"在通常条件下，水在0 摄氏度凝固。","ipa":"/ˈfriːzɪŋ/","syl":[[{"t":"free","p":"ˈfriː"},{"t":"zing","p":"zɪŋ"}]],"tip":"凝固：液 → 固，放热；凝固点 = 熔点。"},{"w":"boiling","zh":"沸腾","ex":"Boiling occurs throughout the liquid at its boiling point.","exzh":"液体在沸点时，其内部和表面都会发生沸腾。","ipa":"/ˈbɔɪlɪŋ/","syl":[[{"t":"boi","p":"ˈbɔɪ"},{"t":"ling","p":"lɪŋ"}]],"tip":"沸腾：整个液体内部都汽化，只发生在沸点。"},{"w":"evaporation","zh":"蒸发","ex":"Evaporation occurs at the surface of a liquid.","exzh":"蒸发发生在液体表面。","ipa":"/ɪˌvæpəˈreɪʃn/","syl":[[{"t":"e","p":"ɪ"},{"t":"va","p":"ˌvæ"},{"t":"po","p":"pə"},{"t":"ra","p":"ˈreɪ"},{"t":"tion","p":"ʃn"}]],"tip":"e-（出）+ vapor（蒸气）→ 蒸气跑出去；只在表面、任何温度都能发生。"},{"w":"condensation","zh":"凝结；液化","ex":"Water vapour condenses to form liquid water.","exzh":"水蒸气凝结形成液态水。","ipa":"/ˌkɒndenˈseɪʃn/","syl":[[{"t":"con","p":"ˌkɒn"},{"t":"den","p":"den"},{"t":"sa","p":"ˈseɪ"},{"t":"tion","p":"ʃn"}]],"tip":"con-（一起）+ dens（密）→ 变密集 = 液化；蒸气遇冷变液体。"},{"w":"sublimation","zh":"升华","ex":"Iodine can change directly from a solid to a gas by sublimation.","exzh":"碘可以通过升华直接由固体变成气体。","ipa":"/ˌsʌblɪˈmeɪʃn/","syl":[[{"t":"sub","p":"ˌsʌb"},{"t":"li","p":"lɪ"},{"t":"ma","p":"ˈmeɪ"},{"t":"tion","p":"ʃn"}]],"tip":"升华：固 → 气，跳过液态（碘、干冰）。"},{"w":"deposition","zh":"凝华","ex":"Deposition is the direct change from a gas to a solid.","exzh":"凝华是气体直接变成固体的过程。","ipa":"/ˌdepəˈzɪʃn/","syl":[[{"t":"de","p":"ˌde"},{"t":"po","p":"pə"},{"t":"si","p":"ˈzɪ"},{"t":"tion","p":"ʃn"}]],"tip":"凝华：气 → 固，是 sublimation 的逆过程（霜的形成）。"}]},{"id":6,"cn":"实验器材、操作与安全","en":"Laboratory Equipment, Actions and Safety","words":[{"w":"apparatus","zh":"实验器材；装置","ex":"Choose suitable apparatus for the experiment.","exzh":"为实验选择合适的器材。","ipa":"/ˌæpəˈreɪtəs/","syl":[[{"t":"ap","p":"ˌæ"},{"t":"pa","p":"pə"},{"t":"ra","p":"ˈreɪ"},{"t":"tus","p":"təs"}]],"tip":"ap-(ad 朝向) + para（准备）→ 备好的一套器材（不可数，问「装置」用它）。"},{"w":"test tube","zh":"试管","ex":"Heat the solution in a test tube.","exzh":"在试管中加热溶液。","ipa":"/test tjuːb/","syl":[[{"t":"test","p":"test"}],[{"t":"tube","p":"tjuːb"}]],"tip":"试管；tube 英音 /tjuːb/ 有个 /j/。"},{"w":"beaker","zh":"烧杯","ex":"Pour the water into a beaker.","exzh":"把水倒入烧杯。","ipa":"/ˈbiːkə/","syl":[[{"t":"bea","p":"ˈbiː"},{"t":"ker","p":"kə"}]],"tip":"beak（鸟嘴）+ -er → 有个尖嘴的杯子 = 烧杯。"},{"w":"conical flask","zh":"锥形瓶","ex":"The reaction takes place in a conical flask.","exzh":"反应在锥形瓶中进行。","ipa":"/ˈkɒnɪkl flɑːsk/","syl":[[{"t":"co","p":"ˈkɒ"},{"t":"ni","p":"nɪ"},{"t":"cal","p":"kl"}],[{"t":"flask","p":"flɑːsk"}]],"tip":"cone（圆锥）的形容词 → 锥形瓶，方便摇晃不洒。"},{"w":"measuring cylinder","zh":"量筒","ex":"Use a measuring cylinder to measure 25 cm³ of water.","exzh":"用量筒量取25 立方厘米水。","ipa":"/ˈmeʒərɪŋ ˈsɪlɪndə/","syl":[[{"t":"mea","p":"ˈme"},{"t":"su","p":"ʒə"},{"t":"ring","p":"rɪŋ"}],[{"t":"cy","p":"ˈsɪ"},{"t":"lin","p":"lɪn"},{"t":"der","p":"də"}]],"tip":"量筒：读数时视线与凹液面最低处齐平。"},{"w":"thermometer","zh":"温度计","ex":"Place the thermometer in the liquid.","exzh":"把温度计放入液体中。","ipa":"/θəˈmɒmɪtə/","syl":[[{"t":"ther","p":"θə"},{"t":"mo","p":"ˈmɒ"},{"t":"me","p":"mɪ"},{"t":"ter","p":"tə"}]],"tip":"therm（热）+ meter（测量器）→ 温度计。重音在 mo。"},{"w":"balance","zh":"天平","ex":"Use a balance to measure the mass.","exzh":"用天平测量质量。","ipa":"/ˈbæləns/","syl":[[{"t":"ba","p":"ˈbæ"},{"t":"lance","p":"ləns"}]],"tip":"bi-（二）+ lanx（盘）→ 两个盘子 = 天平；更精密的天平提高 accuracy。"},{"w":"funnel","zh":"漏斗","ex":"Place the filter paper inside the funnel.","exzh":"把滤纸放在漏斗中。","ipa":"/ˈfʌnl/","syl":[[{"t":"fun","p":"ˈfʌ"},{"t":"nel","p":"nl"}]],"tip":"漏斗；配合 filter paper 做过滤。"},{"w":"filter paper","zh":"滤纸","ex":"The insoluble solid remains on the filter paper.","exzh":"不溶性固体留在滤纸上。","ipa":"/ˈfɪltə ˈpeɪpə/","syl":[[{"t":"fil","p":"ˈfɪl"},{"t":"ter","p":"tə"}],[{"t":"pa","p":"ˈpeɪ"},{"t":"per","p":"pə"}]],"tip":"滤纸：留下残渣 residue，滤过的液体叫 filtrate。"},{"w":"pipette","zh":"移液管；滴管","ex":"Use a pipette to add the solution drop by drop.","exzh":"用移液管逐滴加入溶液。","ipa":"/pɪˈpet/","syl":[[{"t":"pi","p":"pɪ"},{"t":"pette","p":"ˈpet"}]],"tip":"pipe（管）+ -ette（小，法语后缀）→ 小管 = 移液管，重音在后。"},{"w":"Bunsen burner","zh":"本生灯","ex":"Light the Bunsen burner carefully.","exzh":"小心点燃本生灯。","ipa":"/ˈbʌnsn ˈbɜːnə/","syl":[[{"t":"Bun","p":"ˈbʌn"},{"t":"sen","p":"sn"}],[{"t":"bur","p":"ˈbɜː"},{"t":"ner","p":"nə"}]],"tip":"以化学家 Bunsen 命名的本生灯；蓝色火焰最热。"},{"w":"tripod","zh":"三脚架","ex":"Place the beaker on the tripod.","exzh":"把烧杯放在三脚架上。","ipa":"/ˈtraɪpɒd/","syl":[[{"t":"tri","p":"ˈtraɪ"},{"t":"pod","p":"pɒd"}]],"tip":"tri（三）+ pod（脚，同 podium）→ 三脚架。"},{"w":"gauze","zh":"石棉网；金属网","ex":"The gauze supports the beaker and spreads the heat.","exzh":"金属网支撑烧杯并使热量分布更均匀。","ipa":"/ɡɔːz/","syl":[[{"t":"gauze","p":"ɡɔːz"}]],"tip":"石棉网／铁丝网，架在三脚架上让受热均匀。au 读 /ɔː/。"},{"w":"evaporating basin","zh":"蒸发皿","ex":"Heat the solution gently in an evaporating basin.","exzh":"在蒸发皿中缓慢加热溶液。","ipa":"/ɪˈvæpəreɪtɪŋ ˈbeɪsn/","syl":[[{"t":"e","p":"ɪ"},{"t":"va","p":"ˈvæ"},{"t":"po","p":"pə"},{"t":"ra","p":"reɪ"},{"t":"ting","p":"tɪŋ"}],[{"t":"ba","p":"ˈbeɪ"},{"t":"sin","p":"sn"}]],"tip":"蒸发皿：把溶液蒸掉一部分水，冷却后结晶。"},{"w":"condenser","zh":"冷凝器","ex":"The condenser cools the vapour into a liquid.","exzh":"冷凝器把蒸气冷却成液体。","ipa":"/kənˈdensə/","syl":[[{"t":"con","p":"kən"},{"t":"den","p":"ˈden"},{"t":"ser","p":"sə"}]],"tip":"condense（液化）+ -er → 让蒸气变回液体的器材 = 冷凝管。"},{"w":"heat","zh":"加热","ex":"Heat the mixture gently.","exzh":"缓慢加热混合物。","ipa":"/hiːt/","syl":[[{"t":"heat","p":"hiːt"}]],"tip":"加热（动词）；gently = 缓慢地加热。"},{"w":"stir","zh":"搅拌","ex":"Stir the solution with a glass rod.","exzh":"用玻璃棒搅拌溶液。","ipa":"/stɜː/","syl":[[{"t":"stir","p":"stɜː"}]],"tip":"搅拌，用 glass rod 玻璃棒；ir 读 /ɜː/。"},{"w":"add","zh":"加入","ex":"Add the acid slowly.","exzh":"缓慢加入酸。","ipa":"/æd/","syl":[[{"t":"add","p":"æd"}]],"tip":"加入；add slowly 缓慢加入（放热反应尤其要慢）。"},{"w":"pour","zh":"倾倒","ex":"Pour the liquid carefully to avoid spilling it.","exzh":"小心倾倒液体，避免洒出。","ipa":"/pɔː/","syl":[[{"t":"pour","p":"pɔː"}]],"tip":"倾倒；our 在这里读 /ɔː/，不读 /aʊə/。"},{"w":"collect","zh":"收集","ex":"Collect the gas over water.","exzh":"用排水法收集气体。","ipa":"/kəˈlekt/","syl":[[{"t":"col","p":"kə"},{"t":"lect","p":"ˈlekt"}]],"tip":"col-（一起）+ lect（选取，同 select）→ 收集；collect over water 排水法。"},{"w":"filter","zh":"过滤","ex":"Filter the mixture to remove the sand.","exzh":"过滤混合物以除去沙子。","ipa":"/ˈfɪltə/","syl":[[{"t":"fil","p":"ˈfɪl"},{"t":"ter","p":"tə"}]],"tip":"过滤，把不溶的固体分离出来。"},{"w":"evaporate","zh":"蒸发","ex":"Evaporate some of the water from the solution.","exzh":"蒸发掉溶液中的一部分水。","ipa":"/ɪˈvæpəreɪt/","syl":[[{"t":"e","p":"ɪ"},{"t":"va","p":"ˈvæ"},{"t":"po","p":"pə"},{"t":"rate","p":"reɪt"}]],"tip":"蒸发（动词），名词是 evaporation。"},{"w":"crystallise","zh":"使结晶","ex":"Allow the concentrated solution to cool and crystallise.","exzh":"让浓溶液冷却并结晶。","ipa":"/ˈkrɪstəlaɪz/","syl":[[{"t":"crys","p":"ˈkrɪs"},{"t":"tal","p":"tə"},{"t":"lise","p":"laɪz"}]],"tip":"crystal（晶体）+ -ise（使…）→ 结晶；先蒸浓再冷却。"},{"w":"distil","zh":"蒸馏","ex":"Distil the solution to collect pure water.","exzh":"蒸馏该溶液以收集纯水。","ipa":"/dɪˈstɪl/","syl":[[{"t":"di","p":"dɪ"},{"t":"stil","p":"ˈstɪl"}]],"tip":"dis-（分开）+ stil（滴落）→ 一滴滴分出来 = 蒸馏，得到纯水。"},{"w":"dilute","zh":"稀释；稀的","ex":"Dilute the acid with water before use.","exzh":"使用前用水稀释该酸。","ipa":"/daɪˈluːt/","syl":[[{"t":"di","p":"daɪ"},{"t":"lute","p":"ˈluːt"}]],"tip":"di-（分开）+ lut（冲洗）→ 冲淡 = 稀释；反义 concentrated。"},{"w":"concentrated","zh":"浓的；高浓度的","ex":"Concentrated acid must be handled with care.","exzh":"浓酸必须小心操作。","ipa":"/ˈkɒnsntreɪtɪd/","syl":[[{"t":"con","p":"ˈkɒn"},{"t":"cen","p":"sn"},{"t":"tra","p":"treɪ"},{"t":"ted","p":"tɪd"}]],"tip":"浓的（形容词）；浓酸必须小心操作。"},{"w":"flammable","zh":"易燃的","ex":"Ethanol is flammable and must be kept away from flames.","exzh":"乙醇易燃，必须远离火焰。","ipa":"/ˈflæməbl/","syl":[[{"t":"flam","p":"ˈflæ"},{"t":"ma","p":"mə"},{"t":"ble","p":"bl"}]],"tip":"flame（火焰）+ -able → 易燃的。注意 inflammable 也是「易燃」，不是反义！"},{"w":"corrosive","zh":"腐蚀性的","ex":"Concentrated acids are corrosive.","exzh":"浓酸具有腐蚀性。","ipa":"/kəˈrəʊsɪv/","syl":[[{"t":"cor","p":"kə"},{"t":"ro","p":"ˈrəʊ"},{"t":"sive","p":"sɪv"}]],"tip":"cor- + rod（咬、啃，同 rodent 啮齿动物）→ 会「啃掉」东西 = 腐蚀性的。"},{"w":"toxic","zh":"有毒的","ex":"Do not breathe in toxic gases.","exzh":"不要吸入有毒气体。","ipa":"/ˈtɒksɪk/","syl":[[{"t":"tox","p":"ˈtɒk"},{"t":"ic","p":"sɪk"}]],"tip":"toxikon 原指「涂在箭上的毒」→ 有毒的；有毒气体不能吸。"},{"w":"safety goggles","zh":"护目镜","ex":"Wear safety goggles during the experiment.","exzh":"实验过程中佩戴护目镜。","ipa":"/ˈseɪfti ˈɡɒɡlz/","syl":[[{"t":"safe","p":"ˈseɪf"},{"t":"ty","p":"ti"}],[{"t":"gog","p":"ˈɡɒ"},{"t":"gles","p":"ɡlz"}]],"tip":"护目镜；实验安全题的万能答案之一。"}]},{"id":7,"cn":"物理学基础词汇","en":"Basic Physics Vocabulary","words":[{"w":"speed","zh":"速率；速度大小","ex":"Speed is distance travelled per unit time.","exzh":"速率是单位时间内通过的距离。","ipa":"/spiːd/","syl":[[{"t":"speed","p":"spiːd"}]],"tip":"速率 = 距离 ÷ 时间，只有大小。"},{"w":"velocity","zh":"速度；有方向的速率","ex":"Velocity includes both speed and direction.","exzh":"速度同时包含大小和方向。","ipa":"/vɪˈlɒsəti/","syl":[[{"t":"ve","p":"vɪ"},{"t":"lo","p":"ˈlɒ"},{"t":"ci","p":"sə"},{"t":"ty","p":"ti"}]],"tip":"veloc（快）→ 速度：既有大小又有方向（矢量）。"},{"w":"acceleration","zh":"加速度","ex":"Acceleration is the rate of change of velocity.","exzh":"加速度是速度变化的快慢。","ipa":"/əkˌseləˈreɪʃn/","syl":[[{"t":"ac","p":"ək"},{"t":"ce","p":"ˌse"},{"t":"le","p":"lə"},{"t":"ra","p":"ˈreɪ"},{"t":"tion","p":"ʃn"}]],"tip":"ac- + celer（快，同 accelerator 油门）→ 速度变化的快慢 = 加速度。"},{"w":"force","zh":"力","ex":"A force can change the motion of an object.","exzh":"力可以改变物体的运动状态。","ipa":"/fɔːs/","syl":[[{"t":"force","p":"fɔːs"}]],"tip":"力：能改变物体运动状态或形状，单位 N。"},{"w":"gravity","zh":"重力；引力","ex":"Gravity pulls objects towards the Earth.","exzh":"重力把物体拉向地球。","ipa":"/ˈɡrævɪti/","syl":[[{"t":"gra","p":"ˈɡræ"},{"t":"vi","p":"vɪ"},{"t":"ty","p":"ti"}]],"tip":"grav（重）→ 重力，把物体拉向地球。"},{"w":"pressure","zh":"压强","ex":"Gas pressure is caused by particle collisions with the container walls.","exzh":"气体压强由粒子与容器壁的碰撞产生。","ipa":"/ˈpreʃə/","syl":[[{"t":"pres","p":"ˈpre"},{"t":"sure","p":"ʃə"}]],"tip":"press（压）+ -ure → 压强 = 力 ÷ 面积；气体压强来自粒子碰撞容器壁。"},{"w":"density","zh":"密度","ex":"Density is mass divided by volume.","exzh":"密度等于质量除以体积。","ipa":"/ˈdensəti/","syl":[[{"t":"den","p":"ˈden"},{"t":"si","p":"sə"},{"t":"ty","p":"ti"}]],"tip":"dense（密集）+ -ity → 密度 = 质量 ÷ 体积。"},{"w":"electric current","zh":"电流","ex":"Electric current is the flow of electric charge.","exzh":"电流是电荷的定向移动。","ipa":"/ɪˈlektrɪk ˈkʌrənt/","syl":[[{"t":"e","p":"ɪ"},{"t":"lec","p":"ˈlek"},{"t":"tric","p":"trɪk"}],[{"t":"cur","p":"ˈkʌ"},{"t":"rent","p":"rənt"}]],"tip":"curr（流动，同 current 水流）→ 电荷的定向流动 = 电流，单位 A。"},{"w":"voltage","zh":"电压","ex":"A higher voltage can transfer more energy per unit charge.","exzh":"更高的电压可以使单位电荷传递更多能量。","ipa":"/ˈvəʊltɪdʒ/","syl":[[{"t":"vol","p":"ˈvəʊl"},{"t":"tage","p":"tɪdʒ"}]],"tip":"以 Volta 命名 → 电压：每单位电荷传递的能量，单位 V。"},{"w":"resistance","zh":"电阻","ex":"A longer wire usually has a greater resistance.","exzh":"更长的导线通常具有更大的电阻。","ipa":"/rɪˈzɪstəns/","syl":[[{"t":"re","p":"rɪ"},{"t":"sis","p":"ˈzɪs"},{"t":"tance","p":"təns"}]],"tip":"re-（反）+ sist（站）→ 站着挡路 = 电阻；导线越长电阻越大。"},{"w":"conductor","zh":"导体","ex":"Copper is a good electrical conductor.","exzh":"铜是良好的电导体。","ipa":"/kənˈdʌktə/","syl":[[{"t":"con","p":"kən"},{"t":"duc","p":"ˈdʌk"},{"t":"tor","p":"tə"}]],"tip":"con- + duct（引导）→ 能把电引过去 = 导体（铜、金属）。"},{"w":"insulator","zh":"绝缘体","ex":"Plastic is an electrical insulator.","exzh":"塑料是电绝缘体。","ipa":"/ˈɪnsjʊleɪtə/","syl":[[{"t":"in","p":"ˈɪn"},{"t":"su","p":"sjʊ"},{"t":"la","p":"leɪ"},{"t":"tor","p":"tə"}]],"tip":"insula（岛屿）→ 像孤岛一样不通电 = 绝缘体（塑料）。"},{"w":"wave","zh":"波","ex":"Sound travels as a wave.","exzh":"声音以波的形式传播。","ipa":"/weɪv/","syl":[[{"t":"wave","p":"weɪv"}]],"tip":"波：声音以波的形式传播，能量随波传递。"},{"w":"frequency","zh":"频率","ex":"A higher frequency produces a higher-pitched sound.","exzh":"更高的频率产生更高的音调。","ipa":"/ˈfriːkwənsi/","syl":[[{"t":"fre","p":"ˈfriː"},{"t":"quen","p":"kwən"},{"t":"cy","p":"si"}]],"tip":"frequent（频繁）→ 频率，单位 Hz；频率越高音调越高。"},{"w":"energy transfer","zh":"能量转移","ex":"Heating is a method of energy transfer.","exzh":"加热是一种能量转移方式。","ipa":"/ˈenədʒi ˈtrænsfɜː/","syl":[[{"t":"e","p":"ˈe"},{"t":"ner","p":"nə"},{"t":"gy","p":"dʒi"}],[{"t":"trans","p":"ˈtræns"},{"t":"fer","p":"fɜː"}]],"tip":"trans-（横过）+ fer（带，同 ferry 渡船）→ 能量从一处带到另一处。"}]},{"id":8,"cn":"生物与环境基础词汇","en":"Basic Biology and Environmental Vocabulary","words":[{"w":"cell","zh":"细胞","ex":"The cell is the basic unit of life.","exzh":"细胞是生命的基本单位。","ipa":"/sel/","syl":[[{"t":"cell","p":"sel"}]],"tip":"cella（小房间）→ 细胞，生命的基本单位。"},{"w":"tissue","zh":"组织","ex":"A tissue is a group of similar cells working together.","exzh":"组织是共同工作的相似细胞群。","ipa":"/ˈtɪʃuː/","syl":[[{"t":"tis","p":"ˈtɪ"},{"t":"sue","p":"ʃuː"}]],"tip":"相似细胞组成的「一层织物」= 组织。"},{"w":"organ","zh":"器官","ex":"The heart is an organ.","exzh":"心脏是一个器官。","ipa":"/ˈɔːɡən/","syl":[[{"t":"or","p":"ˈɔː"},{"t":"gan","p":"ɡən"}]],"tip":"器官（心脏、肺）；由不同组织构成。"},{"w":"organism","zh":"生物体","ex":"A bacterium is a single-celled organism.","exzh":"细菌是一种单细胞生物。","ipa":"/ˈɔːɡənɪzəm/","syl":[[{"t":"or","p":"ˈɔː"},{"t":"ga","p":"ɡə"},{"t":"nism","p":"nɪzəm"}]],"tip":"organ + -ism → 完整的生物体（细菌也算，单细胞生物）。"},{"w":"diffusion","zh":"扩散","ex":"Diffusion is the net movement of particles from high to low concentration.","exzh":"扩散是粒子由高浓度区域向低浓度区域的净移动。","ipa":"/dɪˈfjuːʒn/","syl":[[{"t":"dif","p":"dɪ"},{"t":"fu","p":"ˈfjuː"},{"t":"sion","p":"ʒn"}]],"tip":"dif-（分散）+ fus（流，同 fuse 熔）→ 粒子由高浓度向低浓度净移动。"},{"w":"osmosis","zh":"渗透作用","ex":"Osmosis is the movement of water through a partially permeable membrane.","exzh":"渗透是水通过半透膜的移动。","ipa":"/ɒzˈməʊsɪs/","syl":[[{"t":"os","p":"ɒz"},{"t":"mo","p":"ˈməʊ"},{"t":"sis","p":"sɪs"}]],"tip":"osmos（推动）→ 渗透：只有「水」通过半透膜的移动。"},{"w":"enzyme","zh":"酶","ex":"An enzyme is a biological catalyst.","exzh":"酶是一种生物催化剂。","ipa":"/ˈenzaɪm/","syl":[[{"t":"en","p":"ˈen"},{"t":"zyme","p":"zaɪm"}]],"tip":"en-（在内）+ zyme（酵母）→ 酶，生物催化剂，怕高温。"},{"w":"respiration","zh":"呼吸作用","ex":"Respiration releases energy from glucose.","exzh":"呼吸作用从葡萄糖中释放能量。","ipa":"/ˌrespəˈreɪʃn/","syl":[[{"t":"res","p":"ˌres"},{"t":"pi","p":"pə"},{"t":"ra","p":"ˈreɪ"},{"t":"tion","p":"ʃn"}]],"tip":"re-（反复）+ spir（呼吸，同 spirit 气息）→ 呼吸作用，从葡萄糖释放能量。"},{"w":"photosynthesis","zh":"光合作用","ex":"Plants use light energy for photosynthesis.","exzh":"植物利用光能进行光合作用。","ipa":"/ˌfəʊtəʊˈsɪnθəsɪs/","syl":[[{"t":"pho","p":"ˌfəʊ"},{"t":"to","p":"təʊ"},{"t":"syn","p":"ˈsɪn"},{"t":"the","p":"θə"},{"t":"sis","p":"sɪs"}]],"tip":"photo（光）+ syn（一起）+ thesis（放置）→ 用光把物质合起来 = 光合作用。"},{"w":"nutrient","zh":"营养物质","ex":"Plants need mineral nutrients for healthy growth.","exzh":"植物健康生长需要矿物质营养。","ipa":"/ˈnjuːtriənt/","syl":[[{"t":"nu","p":"ˈnjuː"},{"t":"tri","p":"tri"},{"t":"ent","p":"ənt"}]],"tip":"nutri（滋养，同 nurse 护理）→ 营养物质，植物需要矿物营养。"},{"w":"habitat","zh":"栖息地","ex":"A habitat provides the conditions an organism needs.","exzh":"栖息地为生物提供生存所需的条件。","ipa":"/ˈhæbɪtæt/","syl":[[{"t":"ha","p":"ˈhæ"},{"t":"bi","p":"bɪ"},{"t":"tat","p":"tæt"}]],"tip":"habit（居住，同 inhabit）→ 生物居住的地方 = 栖息地。"},{"w":"population","zh":"种群","ex":"A population contains organisms of the same species in one area.","exzh":"一个种群由同一区域内同一物种的生物组成。","ipa":"/ˌpɒpjʊˈleɪʃn/","syl":[[{"t":"po","p":"ˌpɒ"},{"t":"pu","p":"pjʊ"},{"t":"la","p":"ˈleɪ"},{"t":"tion","p":"ʃn"}]],"tip":"people（人）→ 同一区域内同一物种的全部个体 = 种群。"},{"w":"adaptation","zh":"适应性特征","ex":"Thick fur is an adaptation to a cold environment.","exzh":"厚毛皮是对寒冷环境的一种适应。","ipa":"/ˌædæpˈteɪʃn/","syl":[[{"t":"a","p":"ˌæ"},{"t":"dap","p":"dæp"},{"t":"ta","p":"ˈteɪ"},{"t":"tion","p":"ʃn"}]],"tip":"adapt（适应）+ -ation → 适应性特征，如厚毛皮适应寒冷。"},{"w":"ecosystem","zh":"生态系统","ex":"An ecosystem includes organisms and their physical environment.","exzh":"生态系统包括生物及其物理环境。","ipa":"/ˈiːkəʊsɪstəm/","syl":[[{"t":"e","p":"ˈiː"},{"t":"co","p":"kəʊ"},{"t":"sys","p":"sɪs"},{"t":"tem","p":"təm"}]],"tip":"eco（家、环境）+ system → 生物 + 其物理环境 = 生态系统。"},{"w":"food chain","zh":"食物链","ex":"A food chain shows how energy passes between organisms.","exzh":"食物链表示能量如何在生物之间传递。","ipa":"/fuːd tʃeɪn/","syl":[[{"t":"food","p":"fuːd"}],[{"t":"chain","p":"tʃeɪn"}]],"tip":"食物链：箭头方向 = 能量传递方向。"},{"w":"renewable resource","zh":"可再生资源","ex":"Solar energy is a renewable resource.","exzh":"太阳能是一种可再生资源。","ipa":"/rɪˈnjuːəbl rɪˈzɔːs/","syl":[[{"t":"re","p":"rɪ"},{"t":"new","p":"ˈnjuː"},{"t":"a","p":"ə"},{"t":"ble","p":"bl"}],[{"t":"re","p":"rɪ"},{"t":"source","p":"ˈzɔːs"}]],"tip":"re-（再）+ new（新）→ 能重新变新的资源（太阳能、风能）。"},{"w":"non-renewable resource","zh":"不可再生资源","ex":"Coal is a non-renewable resource.","exzh":"煤是一种不可再生资源。","ipa":"/nɒn rɪˈnjuːəbl rɪˈzɔːs/","syl":[[{"t":"non","p":"nɒn"}],[{"t":"re","p":"rɪ"},{"t":"new","p":"ˈnjuː"},{"t":"a","p":"ə"},{"t":"ble","p":"bl"}],[{"t":"re","p":"rɪ"},{"t":"source","p":"ˈzɔːs"}]],"tip":"non-（不）+ renewable → 用完就没有了（煤、石油）。"},{"w":"pollution","zh":"污染","ex":"Air pollution can harm human health.","exzh":"空气污染会危害人体健康。","ipa":"/pəˈluːʃn/","syl":[[{"t":"pol","p":"pə"},{"t":"lu","p":"ˈluː"},{"t":"tion","p":"ʃn"}]],"tip":"pollut（弄脏）→ 污染；空气污染危害健康。"},{"w":"greenhouse gas","zh":"温室气体","ex":"Carbon dioxide is a greenhouse gas.","exzh":"二氧化碳是一种温室气体。","ipa":"/ˈɡriːnhaʊs ɡæs/","syl":[[{"t":"green","p":"ˈɡriːn"},{"t":"house","p":"haʊs"}],[{"t":"gas","p":"ɡæs"}]],"tip":"温室气体（CO₂、CH₄）：像玻璃房一样把热留住。"},{"w":"conservation","zh":"保护；资源保护","ex":"Conservation helps protect species and habitats.","exzh":"保护工作有助于保护物种和栖息地。","ipa":"/ˌkɒnsəˈveɪʃn/","syl":[[{"t":"con","p":"ˌkɒn"},{"t":"ser","p":"sə"},{"t":"va","p":"ˈveɪ"},{"t":"tion","p":"ʃn"}]],"tip":"con- + serve（保存）→ 保护物种与栖息地（也指「守恒」，如能量守恒）。"}]}],"frames":[{"use":"描述性质","frame":"A/An ___ has ...","ex":"A liquid has a fixed volume but no fixed shape.","exzh":"液体有固定体积，但没有固定形状。"},{"use":"解释原因","frame":"This is because ...","ex":"The gas can be compressed. This is because its particles are far apart.","exzh":"气体可以被压缩，因为它的粒子相距较远。"},{"use":"表达结果","frame":"Therefore, ...","ex":"The surface area is larger. Therefore, the reaction is faster.","exzh":"表面积更大，因此反应更快。"},{"use":"描述增加","frame":"As ___ increases, ___ increases.","ex":"As temperature increases, particle speed increases.","exzh":"随着温度升高，粒子运动速度增加。"},{"use":"描述相反变化","frame":"As ___ increases, ___ decreases.","ex":"As the volume decreases, the pressure increases.","exzh":"随着体积减小，压强增大。"},{"use":"比较","frame":"___ is greater than ___ .","ex":"The mass of sample A is greater than the mass of sample B.","exzh":"样品A的质量大于样品B。"},{"use":"保持不变","frame":"___ remains constant.","ex":"The temperature remains constant during melting.","exzh":"熔化过程中温度保持不变。"},{"use":"实验步骤","frame":"First ..., then ..., finally ...","ex":"First filter the mixture, then evaporate the filtrate, and finally dry the crystals.","exzh":"先过滤混合物，再蒸发滤液，最后干燥晶体。"},{"use":"控制变量","frame":"Keep ___ constant.","ex":"Keep the mass of the solid constant.","exzh":"保持固体质量不变。"},{"use":"提出结论","frame":"The results show that ...","ex":"The results show that a higher temperature increases the reaction rate.","exzh":"结果表明，较高温度会提高反应速率。"}]};

/* ===================== 数据索引 ===================== */
const ALL = [];
DATA.sections.forEach(s => s.words.forEach(w => {
  w.sec = s.id; w.secName = s.cn; ALL.push(w);
}));
const BY_W = Object.fromEntries(ALL.map(w => [w.w, w]));

/* ===================== 存储 ===================== */
const KEY = 'igcse-flashcard-v1';
const DEF = {
  prog: {},                       // word -> {box, due, seen, wrong, star}
  set: { rate: .95, voice: '', autoSpeak: true, sylMode: 'respell', maskZh: false, theme: 'light' }
};
let S = load();
function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || '{}');
    return { prog: raw.prog || {}, set: Object.assign({}, DEF.set, raw.set || {}) };
  } catch (e) { return JSON.parse(JSON.stringify(DEF)); }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function rec(w) { return S.prog[w] || (S.prog[w] = { box: 0, due: 0, seen: 0, wrong: 0, star: 0 }); }
function applyTheme() {
  const dark = S.set.theme === 'dark';
  document.documentElement.classList.toggle('dark', dark);   // :root.dark → color-scheme:dark → light-dark() 全量切换
  document.querySelector('meta[name=theme-color]').content = dark ? '#111112' : '#F8F4ED';
}
/* 线性图标（与 Astryx 的线条风格一致） */
const IC = {
  spk: '<svg viewBox="0 0 24 24"><path d="M11 5L6.5 9H3v6h3.5L11 19z"/><path d="M14.8 9.6a3.4 3.4 0 0 1 0 4.8"/><path d="M17.4 7a7 7 0 0 1 0 10"/></svg>',
  slow: '<svg viewBox="0 0 24 24"><path d="M11 5L6.5 9H3v6h3.5L11 19z"/><path d="M14.8 9.6a3.4 3.4 0 0 1 0 4.8"/></svg>',
  play: '<svg viewBox="0 0 24 24"><path d="M7.5 4.8l11 7.2-11 7.2z"/></svg>'
};
applyTheme();

/* 间隔重复：盒子 0..5 对应的下次复习间隔 */
const STEP = [0, 10 * 60e3, 24 * 3600e3, 3 * 24 * 3600e3, 7 * 24 * 3600e3, 21 * 24 * 3600e3];
function grade(word, g) {
  const r = rec(word); r.seen++;
  if (g === 0) { r.box = 0; r.wrong++; }
  else if (g === 1) { r.box = Math.min(Math.max(r.box, 1), 3); }   // 模糊：至少 10 分钟后再来
  else { r.box = Math.min(5, r.box + 1); }
  r.due = Date.now() + STEP[r.box];
  save();
}
const isDue = w => { const r = S.prog[w.w]; return r && r.seen > 0 && r.due <= Date.now(); };
const isNew = w => !S.prog[w.w] || !S.prog[w.w].seen;
const isMastered = w => (S.prog[w.w]?.box || 0) >= 4;

/* ===================== 朗读 ===================== */
let VOICES = [], booted = false;
/* 英音优先、系统默认音优先，玩具音色排最后 */
const FUN = /bad news|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|albert|bahh|junior|ralph|kathy|fred|grandma|grandpa|rocko|shelley|sandy|eddy|flo|reed|rishi/i;
const rank = v => (FUN.test(v.name) ? 4 : 0) + (/en[-_]GB/i.test(v.lang) ? 0 : 1) + (v.default ? -1 : 0);
function loadVoices() {
  VOICES = (speechSynthesis.getVoices() || []).filter(v => /^en/i.test(v.lang))
    .sort((a, b) => (rank(a) - rank(b)) || a.name.localeCompare(b.name));
  if (booted && curView === 'me') render();   // 语音列表异步到达时刷新设置页
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function pickVoice() {
  if (!VOICES.length) return null;
  if (S.set.voice) { const v = VOICES.find(v => v.voiceURI === S.set.voice); if (v) return v; }
  return VOICES.find(v => /en[-_]GB/i.test(v.lang)) || VOICES[0];
}
/* 慢速用绝对值而不是「正常速 − 偏移」：部分系统语音对 rate 不敏感，差距必须拉够大 */
const SLOW = .4;

/* iOS / Safari 要求首次朗读发生在用户手势内，先用一个静音串把引擎唤醒 */
let ttsPrimed = false, ttsWarned = false;
function primeTTS() {
  if (ttsPrimed || !window.speechSynthesis) return;
  ttsPrimed = true;
  try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
}
document.addEventListener('pointerdown', primeTTS, { once: true, capture: true });
document.addEventListener('touchstart', primeTTS, { once: true, capture: true, passive: true });

function stopSpeak() {
  try { if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel(); } catch (e) {}
}
/* 真正发声。Chrome/Safari 偶尔会卡在 speaking=true 却不出声，这里做超时自检并重试一次 */
function speakNow(text, rate, onend, attempt) {
  if (!window.speechSynthesis) { onend && onend(); return; }
  attempt = attempt || 0;
  let started = false, done = false, abandoned = false;
  // abandoned：这一条已被自检放弃，随后 cancel() 触发的 onend/onerror 一律忽略
  const finish = () => { if (!done && !abandoned) { done = true; onend && onend(); } };
  try {
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice();
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-GB';
    u.rate = rate ?? S.set.rate; u.pitch = 1;
    u.onstart = () => started = true;
    u.onend = finish; u.onerror = finish;
    try { speechSynthesis.resume(); } catch (e) {}   // 解掉 Chrome 的暂停态
    speechSynthesis.speak(u);
  } catch (e) { finish(); return; }
  setTimeout(() => {
    if (started || done) return;
    abandoned = true;
    stopSpeak();
    if (attempt < 1) { speakNow(text, rate, onend, attempt + 1); return; }   // 重试一次
    if (!ttsWarned) { ttsWarned = true; toast('这个浏览器没能发声，换 Safari / Chrome 打开试试'); }
    onend && onend();                                                        // 放弃，把控制权交回
  }, 450);
}
function say(text, rate, cb) { stopSpeak(); speakNow(text, rate, cb); }

/* 依次朗读一串内容，可带高亮回调 */
function sayList(items, i) {
  i = i || 0;
  if (i >= items.length) return;
  const it = items[i];
  if (i === 0) stopSpeak();
  it.on && it.on();
  speakNow(it.text, it.rate, () => {
    it.off && it.off();
    setTimeout(() => sayList(items, i + 1), it.gap ?? 180);
  });
}

/* IPA → 便于 TTS 读出的拟音串（让单个音节也能读准） */
const MAP = [
  ['aɪə','ire'],['aʊə','ower'],['tʃ','ch'],['dʒ','j'],['iː','ee'],['ɑː','ah'],['ɔː','aw'],['uː','oo'],
  ['ɜː','ur'],['ɪə','eer'],['eə','air'],['ʊə','oor'],['eɪ','ay'],['aɪ','igh'],['ɔɪ','oy'],['aʊ','ow'],
  ['əʊ','oh'],['ɛ','eh'],['æ','a'],['ɒ','o'],['ʌ','uh'],['ə','uh'],['ɪ','ih'],['ʊ','oo'],
  ['θ','th'],['ð','th'],['ʃ','sh'],['ʒ','zh'],['ŋ','ng'],['j','y'],['ɡ','g'],['ː',''],
  ['e','eh'],['i','ee'],['u','oo']
];
function respell(ipa) {
  let s = ipa.replace(/[ˈˌ\/·]/g, ''), out = '';
  outer: while (s.length) {
    for (const [a, b] of MAP) { if (s.startsWith(a)) { out += b; s = s.slice(a.length); continue outer; } }
    out += s[0]; s = s.slice(1);
  }
  if (out === 'igh') out = 'eye';
  if (!/[aeiouy]/.test(out) && out.length) {                 // 无元音的音节（如 ʃn）补一个模糊元音
    out = out.length > 1 ? out.slice(0, -1) + 'u' + out.slice(-1) : out + 'uh';
  }
  return out;
}
const sylText = sy => S.set.sylMode === 'respell' ? respell(sy.p) : sy.t;

/* ===================== 音节渲染（一元一辅） ===================== */
const VOW = 'aeiouyAEIOUY';
const IPA_VOW = /[iɪeɛæaɑɒɔʊuʌɜəɐ]/;                 // 以元音音素收尾 = 开音节
function sylHTML(sy, ix) {
  const letters = [...sy.t].map(ch => /[a-z]/i.test(ch)
    ? `<span class="${VOW.includes(ch) ? 'v' : 'c'}">${ch}</span>` : ch).join('');
  const p = sy.p.replace(/[ˈˌː]/g, '');
  const open = IPA_VOW.test(p.slice(-1));
  return `<span class="ix">${ix + 1}</span><span class="oc">${open ? '开' : '闭'}</span>`
    + `<div class="sp">${letters}</div><div class="pp">${sy.p}</div>`;
}
/* ---------- 倒切法：从词尾向前，一元一辅切字母 ----------
   规则：两个元音之间——0 个辅音直接切；1 个辅音归后（开音节）；
   2 个以上留一个给前面、其余归后（闭音节）；二合字母与 塞音+l/r 连缀不拆；
   词尾不发音的 e 并回前一块。 */
const DIGRAPH = ['ch', 'sh', 'th', 'ph', 'wh', 'ck', 'ng', 'gh', 'qu'];
const BLEND = ['bl', 'br', 'cl', 'cr', 'dr', 'fl', 'fr', 'gl', 'gr', 'pl', 'pr', 'tr', 'thr', 'str', 'spr', 'scr', 'shr'];
const ONSET2 = ['st', 'sp', 'sk', 'sc', 'sl', 'sm', 'sn', 'sw', 'tw'];   // 只在三辅音时整体归后：sub|stance
function letterSplit(word) {
  const w = word, isV = i => {
    const c = (w[i] || '').toLowerCase();
    if (!c) return false;
    if (c === 'y') return i > 0;                 // 词首 y 当辅音
    return 'aeiou'.indexOf(c) >= 0;
  };
  const units = [];                              // 元音单位（相邻元音字母合并）
  for (let i = 0; i < w.length; i++) {
    if (isV(i)) { let j = i; while (isV(j + 1)) j++; units.push([i, j]); i = j; }
  }
  // 词尾不发音的 e 不算一个元音（state / change / evaporate），但 -le 结尾要保留
  const lastU = units[units.length - 1];
  if (units.length > 1 && lastU[0] === lastU[1] && lastU[0] === w.length - 1
    && /e/i.test(w[lastU[0]]) && !/[aeioul]/i.test(w[lastU[0] - 1] || '')) units.pop();
  if (units.length < 2) return [w];
  const cuts = [];
  for (let k = units.length - 1; k >= 1; k--) {  // 从后往前一刀刀切
    const L = units[k - 1][1], R = units[k][0], cons = w.slice(L + 1, R);
    let cut;
    if (!cons.length) cut = R;
    else if (cons.length === 1) cut = /x/i.test(cons) ? R : R - 1;   // x 读 /ks/，整体归前：tox|ic
    else {
      const t3 = cons.slice(-3).toLowerCase(), t2 = cons.slice(-2).toLowerCase();
      cut = (cons.length >= 3 && BLEND.includes(t3)) ? R - 3
        : (DIGRAPH.includes(t2) || BLEND.includes(t2) || (cons.length >= 3 && ONSET2.includes(t2))) ? R - 2
          : R - 1;
      if (cut <= L) cut = L + 1;
    }
    cuts.push(cut);
  }
  cuts.sort((a, b) => a - b);
  const parts = []; let p = 0;
  cuts.forEach(c => { if (c > p) { parts.push(w.slice(p, c)); p = c; } });
  parts.push(w.slice(p));
  if (parts.length > 1 && /^[^aeiou]?e$/i.test(parts[parts.length - 1]))   // 结尾哑音 e 并回去
    parts.splice(-2, 2, parts[parts.length - 2] + parts[parts.length - 1]);
  return parts.filter(Boolean);
}
const colorLetters = t => [...t].map(ch => /[a-z]/i.test(ch)
  ? `<span class="${VOW.includes(ch) ? 'v' : 'c'}">${ch}</span>` : ch).join('');

/* 倒切法一行：块之间标出切刀顺序（从右往左 ①②③） */
function cutHTML(w) {
  let h = '';
  w.w.split(/[\s-]+/).forEach((word, wi) => {
    const parts = letterSplit(word);
    if (wi) h += '<span class="cutsep">·</span>';
    parts.forEach((p, i) => {
      if (i) h += `<span class="knife">${parts.length - i}</span>`;
      h += `<button class="cut" data-t="${esc(p)}">${colorLetters(p)}</button>`;
    });
  });
  return h;
}
/* ---------- 翻译思路 ----------
   上排按英语原序显示意群，下排按 order 重排成中文语序，同一成分同色，
   让「后置定语要前移」这件事用颜色直接看出来 */
function transHTML(w) {
  const t = w.tr;
  const flow = t.flow.map(([en, zh, r]) =>
    `<div class="fl"><span class="fe">${esc(en)}</span><span class="fz ${r || 'x'}">${esc(zh)}</span></div>`).join('');
  const tree = t.tree.map(([lv, en, zh]) =>
    `<div class="tv l${lv}">${lv ? '<span class="br">└</span>' : ''}
      <span class="te ${lv ? 'd' : 'h'}">${esc(en)}</span><span class="tz">${esc(zh)}</span></div>`).join('');
  const asm = t.asm.map((z, i) =>
    (i ? '<span class="ar">→</span>' : '') +
    `<span class="zk ${i === t.asm.length - 1 ? 'h' : 'd'}">${esc(z)}</span>`).join('');
  const shift = t.shift
    ? `<div class="tr-step">词性转换</div>
       <div class="nom"><b>${esc(t.shift[0])}</b><span class="ar">→</span><b>${esc(t.shift[1])}</b>
       <em>${esc(t.shift[2])}</em></div>` : '';
  return `<div class="tr" id="trBox">
    <span class="pat">${esc(t.pat)}</span>

    <div class="tr-step">① 顺着读，不回头</div>
    <div class="flow">${flow}</div>
    <div class="tr-note">读到句尾自然就懂了 —— 这是读英语该有的姿势，别倒回去找中心词。</div>

    <div class="tr-step">② 主干</div>
    <div class="core"><div class="ce">${esc(t.core[0])}</div><div class="cz">${esc(t.core[1])}</div></div>

    <div class="tr-step">③ 修饰挂在哪（缩进 = 嵌套层级）</div>
    <div class="tree">${tree}</div>
    ${shift}

    <div class="tr-step">④ 中文从最里层往外装</div>
    <div class="zhline">${asm}</div>
    <div class="tr-final">${t.final
      ? t.final.map(([z, r]) => `<span class="fw ${r || 'x'}">${esc(z)}</span>`).join('')
      : esc(w.exzh)}</div>
    <div class="tr-tip">${esc(t.tip)}</div>
  </div>`;
}

}

    <div class="mid">
      <div class="word${w.w.length > 14 ? ' long' : ''}">${esc(w.w)}</div>
      <div class="ipa">${esc(w.ipa)}</div>
      <div class="spk">
        <button class="btn line" data-a="say">${IC.spk} 朗读</button>
        <button class="btn line" data-a="slow">${IC.slow} 慢速</button>
        <button class="btn line" data-a="seq">${IC.play} 逐音节跟读</button>
      </div>
      <div class="syl-h">发音音节 · 一元一辅（点音节单独听）</div>
      <div class="syls" id="syls">${syllablesHTML(w)}</div>
      <div class="syl-h">倒切法 · 从词尾往前切字母</div>
      <div class="cuts">${cutHTML(w)}</div>
      <div class="cutnote">
        圆圈数字 = 下刀顺序（从后往前）：每次带走「一个元音 + 它后面的辅音」，两辅音之间前后各分一个。
        ${sameSplit(w) ? '　<b>✓ 与发音音节一致</b>' : '　<i>⚠︎ 与发音音节不同，读音以上面一行为准</i>'}
      </div>
    </div>
    <div class="hint">
      <span class="legend"><s style="background:var(--color-icon-red)"></s>元音字母</span>
      <span class="legend"><s style="background:var(--color-brand)"></s>辅音字母</span>　·　轻点卡片看释义
    </div>`;

  $('faceB').innerHTML = `
    <div class="tag">${esc(w.w)}　${esc(w.ipa)}</div>
    <div class="mid">
      <div class="zh">${esc(w.zh)}</div>
      <div class="blk2"><div class="lb">记忆法</div><p>${esc(w.tip)}</p></div>
      <div class="ex">
        <div class="en">${esc(w.ex)}</div>
        <div class="cn">${esc(w.exzh)}</div>
        <div class="rowbtn">
          <button class="btn tiny" data-a="ex">${IC.spk} 读例句</button>
          <button class="btn tiny" data-a="exslow">${IC.slow} 慢速</button>
        </div>
        ${w.tr ? transHTML(w) : ''}
      </div>
    </div>
    <div class="hint">轻点卡片返回正面　·　左右滑动切换单词</div>`;

  if (speak !== false && S.set.autoSpeak) setTimeout(() => say(w.w), 260);
}

/* 卡片交互：按钮 / 音节 / 翻面 */
$('card3d').addEventListener('click', e => {
  const w = Q[qi];
  const b = e.target.closest('[data-a]');
  if (b) {
    e.stopPropagation();
    const a = b.dataset.a;
    if (a === 'say') say(w.w);
    else if (a === 'slow') say(w.w, SLOW);
    else if (a === 'ex') say(w.ex);
    else if (a === 'exslow') say(w.ex, SLOW + .05);
    else if (a === 'seq') playSeq(w);
    return;
  }
  const cut = e.target.closest('.cut');
  if (cut) {
    e.stopPropagation();
    say(cut.dataset.t, SLOW);
    return;
  }
  const sy = e.target.closest('.syl');
  if (sy) {
    e.stopPropagation();
    const s = flatSyl(w)[+sy.dataset.k];
    say(sylText(s), SLOW);
    return;
  }
  flipped = !flipped;
  $('card3d').classList.toggle('flip', flipped);
});

/* 逐音节跟读：一个个音节 → 整词慢速 → 整词正常 */
function playSeq(w) {
  const chips = [...document.querySelectorAll('#syls .syl')];
  const items = flatSyl(w).map((sy, i) => ({
    text: sylText(sy), rate: SLOW, gap: 240,
    on: () => chips[i]?.classList.add('hi'), off: () => chips[i]?.classList.remove('hi')
  }));
  items.push({ text: w.w, rate: SLOW, gap: 300 }, { text: w.w, rate: S.set.rate });
  sayList(items);
}

/* 评分 */
document.querySelector('.acts').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  const g = +b.dataset.g, w = Q[qi];
  grade(w.w, g);
  if (g === 0 && !requeued.has(w.w)) { requeued.add(w.w); Q.push(w); }   // 忘记的词本轮末尾再出现一次
  next();
};
function next() {
  stopSpeak();
  if (qi >= Q.length - 1) {
    $('stProg').style.width = '100%';
    toast('这一组完成了 🎉');
    setTimeout(() => { $('study').classList.remove('on'); render(); }, 700);
    return;
  }
  qi++; drawCard();
}

/* 左右滑动切换 */
let tx = 0, ty = 0;
const cw = document.querySelector('.cardwrap');
cw.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
cw.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
  stopSpeak();
  if (dx < 0 && qi < Q.length - 1) { qi++; drawCard(); }
  else if (dx > 0 && qi > 0) { qi--; drawCard(); }
}, { passive: true });

/* ===================== 杂项 ===================== */
let tt;
function toast(m) {
  const el = $('toast'); el.textContent = m; el.classList.add('on');
  clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 1600);
}
document.addEventListener('keydown', e => {
  if (!$('study').classList.contains('on')) return;
  if (e.key === ' ') { e.preventDefault(); $('card3d').click(); }
  if (e.key === 'ArrowRight' && qi < Q.length - 1) { qi++; drawCard(); }
  if (e.key === 'ArrowLeft' && qi > 0) { qi--; drawCard(); }
  if (e.key === 'Escape') $('stClose').click();
});
booted = true;
render();
</script>
</body>
</html>
