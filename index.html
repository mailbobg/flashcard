tion","ipa":"/kənˈdʌkʃn/","syl":[[{"t":"con","p":"kən"},{"t":"duc","p":"ˈdʌk"},{"t":"tion","p":"ʃn"}]],"tip":"con-（一起）+ duct（引导，同 conduct）+ -ion → 靠粒子碰撞把热传下去 = 传导，金属最擅长。","tr":{"pat":"判断句：主语 + be + 表语","flow":[["Metals","金属","s"],["are","是","v"],["good thermal conductors","良好的热导体","h"]],"core":["Metals are good thermal conductors","金属是良好的热导体"],"final":[["金属","s"],["是","v"],["良好的热导体","h"],["。",""]],"tip":"热传导靠粒子碰撞传递；金属是良导体。"}},{"w":"convection","zh":"对流","ex":"Convection occurs in fluids.","exzh":"对流发生在流体中。","id":"phy:convection","ipa":"/kənˈvekʃn/","syl":[[{"t":"con","p":"kən"},{"t":"vec","p":"ˈvek"},{"t":"tion","p":"ʃn"}]],"tip":"con-（一起）+ vect（搬运）→ 流体受热上升、变冷下沉形成环流 = 对流。","tr":{"pat":"判断句：主语 + 谓语 + in 介词短语","flow":[["Convection","对流","s"],["occurs","发生","v"],["in fluids","在流体中","a"]],"core":["Convection occurs in fluids","对流发生在流体中"],"final":[["对流","s"],["发生","v"],["在流体中","a"],["。",""]],"tip":"对流只发生在流体（液体和气体）里：受热上升、变冷下沉形成环流。"}},{"w":"radiation","zh":"热辐射","ex":"Infrared radiation transfers energy through a vacuum.","exzh":"红外辐射可在真空中传递能量。","id":"phy:radiation","ipa":"/ˌreɪdiˈeɪʃn/","syl":[[{"t":"ra","p":"ˌreɪ"},{"t":"di","p":"di"},{"t":"a","p":"ˈeɪ"},{"t":"tion","p":"ʃn"}]],"tip":"射线向外发散传热 = 热辐射；不需要介质，能穿过真空（太阳的热就是这样来的）。","tr":{"pat":"判断句：主语 + 谓语 + 宾语 + through 介词短语","flow":[["Infrared radiation","红外辐射","s"],["transfers","传递","v"],["energy","能量","h"],["through a vacuum","通过真空","a"]],"core":["Infrared radiation transfers energy through a vacuum","红外辐射通过真空传递能量"],"final":[["红外辐射","s"],["可在真空中","a"],["传递","v"],["能量","h"],["。",""]],"tip":"热辐射不需要介质，能穿过真空——太阳的热就是这样来的。"}},{"w":"specific heat capacity","zh":"比热容","ex":"Water has a high specific heat capacity.","exzh":"水的比热容较大。","id":"phy:specific heat capacity","ipa":"/spəˈsɪfɪk hiːt kəˈpæsɪti/","syl":[[{"t":"spe","p":"spəˈ"},{"t":"ci","p":"sɪ"},{"t":"fic","p":"fɪk"}],[{"t":"heat","p":"hiːt"}],[{"t":"ca","p":"kəˈ"},{"t":"pa","p":"pæ"},{"t":"ci","p":"sɪ"},{"t":"ty","p":"ti"}]],"tip":"specific「每单位的」+ heat capacity「储热本领」→ 每千克升高 1℃ 所需的热量。","tr":{"pat":"判断句：主语 + 谓语 + 宾语","flow":[["Water","水","s"],["has","有","v"],["a high specific heat capacity","较大的比热容","h"]],"core":["Water has a high specific heat capacity","水的比热容较大"],"final":[["水的","d"],["比热容","s"],["较大","v"],["。",""]],"tip":"水的比热容大 → 升温慢、降温也慢，海边温差小就靠它。"}},{"w":"melting","zh":"熔化","ex":"Melting changes a solid into a liquid.","exzh":"熔化把固体变成液体。","id":"phy:melting","ipa":"/ˈmeltɪŋ/","syl":[[{"t":"mel","p":"ˈmel"},{"t":"ting","p":"tɪŋ"}]],"tip":"熔化：固 → 液，吸热；熔化过程中温度保持不变。","tr":{"pat":"判断句：主语 + 谓语 + 宾语 + into 介词短语","flow":[["Melting","熔化","s"],["changes","使改变","v"],["a solid","固体","h"],["into a liquid","变成液体","a"]],"core":["Melting changes a solid into a liquid","熔化使固体变成液体"],"final":[["熔化","s"],["把固体","h"],["变成","v"],["液体","h"],["。",""]],"tip":"change…into… = 把…变成…；熔化过程温度不变（吸收潜热）。"}},{"w":"boiling","zh":"沸腾","ex":"Boiling occurs throughout a liquid.","exzh":"沸腾发生在液体内部和表面。","id":"phy:boiling","ipa":"/ˈbɔɪlɪŋ/","syl":[[{"t":"boi","p":"ˈbɔɪ"},{"t":"ling","p":"lɪŋ"}]],"tip":"沸腾：整个液体内部都汽化，只发生在沸点。","tr":{"pat":"判断句：主语 + 谓语 + throughout 介词短语","flow":[["Boiling","沸腾","s"],["occurs","发生","v"],["throughout a liquid","在整个液体中","a"]],"core":["Boiling occurs throughout a liquid","沸腾发生在整个液体中"],"final":[["沸腾","s"],["发生","v"],["在液体内部和表面","a"],["。",""]],"tip":"沸腾在整个液体内部和表面同时进行；蒸发只在表面。"}},{"w":"evaporation","zh":"蒸发","ex":"Evaporation occurs at the surface.","exzh":"蒸发发生在液体表面。","id":"phy:evaporation","ipa":"/ɪˌvæpəˈreɪʃn/","syl":[[{"t":"e","p":"ɪ"},{"t":"va","p":"ˌvæ"},{"t":"po","p":"pə"},{"t":"ra","p":"ˈreɪ"},{"t":"tion","p":"ʃn"}]],"tip":"e-（出）+ vapor（蒸气）→ 蒸气跑出去；只在表面、任何温度都能发生。","tr":{"pat":"判断句：主语 + 谓语 + at 介词短语","flow":[["Evaporation","蒸发","s"],["occurs","发生","v"],["at the surface","在表面","a"]],"core":["Evaporation occurs at the surface","蒸发发生在表面"],"final":[["蒸发","s"],["发生","v"],["在液体表面","a"],["。",""]],"tip":"蒸发只在液体表面，任何温度都能发生；沸腾需要达到沸点。"}},{"w":"condensation","zh":"凝结","ex":"Condensation changes gas into liquid.","exzh":"凝结把气体变成液体。","id":"phy:condensation","ipa ":"interval","zh":"间隔","ex":"Use equal intervals.","exzh":"使用相等间隔。","id":"phy:interval","ipa":"/ˈɪntəvl/","syl":[[{"t":"in","p":"ˈɪn"},{"t":"ter","p":"tə"},{"t":"val","p":"vl"}]],"tip":"inter-（之间）→ 相邻两个读数之间的间隔；用相等间隔，作图更方便。","tr":{"pat":"祈使句：动词 + 宾语","flow":[["Use","使用","v"],["equal intervals","相等间隔","h"]],"core":["Use equal intervals","使用相等间隔"],"final":[["使用","v"],["相等间隔","h"],["。",""]],"tip":"读数间隔取相等（如每 10℃ 记一次），作图更方便。"}}]}],"frames":[{"use":"描述两个量的变化关系","frame":"As ___ increases, ___ increases/decreases.","ex":"As the force increases, the acceleration increases.","exzh":"随着力增大，加速度增大。"},{"use":"判断物体静止并给理由","frame":"The object is stationary because ___.","ex":"The object is stationary because the resultant force is zero.","exzh":"物体静止，因为合力为零。"},{"use":"比较两次结果并给理由","frame":"The result is greater because ___.","ex":"The result is greater because the temperature is higher.","exzh":"结果更大，因为温度更高。"},{"use":"论证实验是公平实验","frame":"This is a fair test because only the independent variable is changed.","ex":"This is a fair test because only the independent variable is changed.","exzh":"这是公平实验，因为只有自变量被改变。"},{"use":"写提高可靠性的做法","frame":"Repeat the measurements, identify anomalies and calculate a mean.","ex":"Repeat the measurements, identify anomalies and calculate a mean.","exzh":"重复测量、识别异常值并计算平均值。"},{"use":"解释压强变化","frame":"The same force acts over a smaller area, so the pressure is greater.","ex":"The same force acts over a smaller area, so the pressure is greater.","exzh":"相同的力作用在更小面积上，因此压强更大。"},{"use":"由受力平衡推合力","frame":"The forces are balanced, so the resultant force is zero.","ex":"The forces are balanced, so the resultant force is zero.","exzh":"力平衡，因此合力为零。"},{"use":"描述能量转移","frame":"Energy is transferred from ___ to ___.","ex":"Energy is transferred from the chemical store to the thermal store.","exzh":"能量从化学能储存转移到内能储存。"},{"use":"指出答案缺单位","frame":"The answer is incomplete because the unit is missing.","ex":"The answer is incomplete because the unit is missing.","exzh":"答案不完整，因为缺少单位。"},{"use":"读图线斜率","frame":"The graph is steeper, so the speed is greater.","ex":"The graph is steeper, so the speed is greater.","exzh":"图线更陡，因此速度更大。"}]}],"lessons":[{"id":3,"book":"phy","title":"扩散、布朗运动与气体规律","course":"Cambridge IGCSE Physics 0625 衔接课程","mins":20,"intro":["先阅读、朗读词汇，再回到阅读材料。","不会的地方留空或圈出来，不要用翻译软件直接生成整段答案。"],"goals":["知道扩散与布朗运动不是同一个概念。","理解粒子会持续进行无规则运动。","尝试解释温度和分子质量为什么会影响扩散速度。"],"vocab":[["sci:diffusion","粒子总体由高浓度区域向低浓度区域移动"],["sci:Brownian motion","悬浮微粒受到分子不规则碰撞产生的随机运动"],["sci:random","方向不断变化、没有固定路线"],["sci:concentration","一定空间中粒子的多少"],["sci:high concentration","单位空间内粒子较多"],["sci:low concentration","单位空间内粒子较少"],["sci:net movement","综合所有随机运动后呈现的总体方向"],["sci:collision","粒子相互撞击"],["kinetic energy","物体或粒子由于运动具有的能量"],["sci:relative molecular mass","一个分子中各原子相对质量的总和"],["pressure","粒子碰撞容器壁产生的作用"],["volume","物质或气体占据的空间"]],"reading":[["粒子一直在运动",[{"zh":"液体和气体中的粒子会持续进行快速、无规则的运动。","en":"Particles in liquids and gases are constantly moving quickly and randomly.","parts":[["液体和气体中的粒子","Particles in liquids and gases","s"],["会持续进行……运动","are constantly moving","v"],["快速、无规则的","quickly and randomly","a"]],"note":"中文说「进行……运动」是动宾结构，英文直接用动词 move 就够了。而中文的形容词「快速、无规则的」到英文里要变成副词 quickly and randomly。"},{"zh":"温度越高，粒子的平均动能（kinetic energy）通常越大，运动也越快。","en":"The higher the temperature, the greater the average kinetic energy of the particles, and the faster they move.","parts":[["温度越高","The higher the temperature","c"],["粒子的平均动能通常越大","the greater the average kinetic energy of the particles","c"],["运动也越快","the faster they move","c"]],"note":"「越……越……」对应英文的 the + 比较级, the + 比较级 句型，每个分句前面都要有 the，漏掉就不成句。"}]],["什么是扩散？",[{"zh":"扩散（diffusion）是粒子由于随机运动而产生的总体净移动：从高浓度区域移向低浓度区域，直到分布变得更加均匀。","en":"Diffusion is the net movement of particles from a region of higher concentration to a region of lower concentration, due to their random movement.","parts":[["扩散是","Diffusion is","v"],["总体净移动","the net movement of particles","h"],["从高浓度区域移向低浓度区域","from a region of higher concentration to a region of lower concentration","a"],["由于随机运动而产生的","due to their random movement","d"]],"note":"关键差异：中文把「由于随机运动而产生的」放在中心词「净移动」前面，英文必须挪到后面去（due to…）。中文修饰前置、英文后置，这是写英文答案时最容易出错的地方。"},{"zh":"扩散不需要搅拌，也不是所有粒子都只朝一个方向移动。","en":"Diffusion does not need stirring, and not all particles move in only one direction.","parts":[["扩散不需要搅拌","Diffusion does not need stirring","v"],["也不是所有粒子","not all particles","s"],["都只朝一个方向移动","move in only one direction","v"]],"note":"「不是所有……都」是部分否定，英文写 not all…；写成 all… not 意思就变成「全都不」了。"}]],["什么是布朗运动？",[{"zh":"布朗运动（Brownian motion）是悬浮在液体或气体中的微小可见颗粒，由于受到周围分子的不断、不均匀碰撞而产生的随机运动。","en":"Brownian motion is the random movement of small visible particles suspended in a liquid or gas, caused by constant, uneven collisions with the surrounding molecules.","parts":[["布朗运动是","Brownian motion is","v"],["随机运动","the random movement","h"],["悬浮在液体或气体中的微小可见颗粒","of small visible particles suspended in a liquid or gas","d"],["由于受到周围分子不断、不均匀碰撞而产生的","caused by constant, uneven collisions with the surrounding molecules","d"]],"note":"中文一口气把两串修饰全堆在「随机运动」前面，英文得拆成两段挂到后面：先 of… 再 caused by…。suspended 也是后置定语，修饰 particles。"},{"zh":"它是粒子存在并不断运动的一项证据。","en":"It is evidence that particles exist and are moving all the time.","parts":[["它是一项证据","It is evidence","v"],["粒子存在并不断运动的","that particles exist and are moving all the time","c"]],"note":"「……的证据」英文用 evidence that + 从句（同位语从句），不能写成 evidence of that。"}]],["哪些因素会影响扩散速度？",[{"zh":"温度较高：粒子运动更快，扩散通常更快。","en":"Higher temperature: the particles move faster, so diffusion is usually faster.","parts":[["温度较高","Higher temperature","s"],["粒子运动更快","the particles move faster","c"],["扩散通常更快","so diffusion is usually faster","c"]],"note":"中文靠语序就能表达因果，英文最好补一个 so 把逻辑显式说出来——中文重意合、英文重形合，写英文答案时连词不能省。"},{"zh":"浓度差较大：开始时净移动更明显。","en":"A greater difference in concentration: the net movement is more obvious at the start.","parts":[["浓度差较大","A greater difference in concentration","s"],["净移动更明显","the net movement is more obvious","c"],["开始时","at the start","a"]],"note":"「浓度差」是 difference in concentration，介词用 in 不用 of。中文时间词「开始时」在前，英文习惯放句末。"},{"zh":"粒子质量较小：在相同条件下通常运动更快，扩散更快。","en":"Smaller particle mass: under the same conditions the particles usually move faster and diffuse faster.","parts":[["粒子质量较小","Smaller particle mass","s"],["在相同条件下","under the same conditions","a"],["通常运动更快，扩散更快","usually move faster and diffuse faster","c"]],"note":"「在……条件下」固定搭配是 under conditions，不是 in。diffuse 是动词、diffusion 是名词，这里要用动词。"}]],["气体的压力与体积",[{"zh":"气体压力来自粒子不断碰撞容器壁。","en":"Gas pressure comes from the constant collisions of particles with the container walls.","parts":[["气体压力","Gas pressure","s"],["来自","comes from","v"],["粒子不断碰撞容器壁","the constant collisions of particles with the container walls","h"]],"note":"中文「粒子不断碰撞容器壁」是个主谓宾小句，英文更常写成名词化的「the collisions of A with B」。科学英语偏爱名词化——正好是词卡里那条规律反过来用。"},{"zh":"提高温度会使粒子运动更快；压缩气体会让粒子在更小空间中更频繁地碰撞容器壁。","en":"Raising the temperature makes the particles move faster; compressing the gas makes them hit the walls more often in a smaller space.","parts":[["提高温度","Raising the temperature","s"],["会使粒子运动更快","makes the particles move faster","v"],["压缩气体","compressing the gas","s"],["会让粒子更频繁地碰撞容器壁","makes them hit the walls more often","v"],["在更小空间中","in a smaller space","a"]],"note":"中文的「提高温度」「压缩气体」作主语时，英文要用动名词 Raising / compressing。另外 make 后面跟动词原形，不带 to：makes them hit，不是 makes them to hit。"}]]],"check":["已朗读全部词汇","已读完阅读材料","已圈出不懂的地方"]}]};

/* ===================== 数据索引 ===================== */
const BOOKS = {};
DATA.books.forEach(bk => {
  bk.words = [];
  bk.sections.forEach(s => s.words.forEach(w => {
    w.book = bk.id; w.sec = s.id; w.secName = s.cn; bk.words.push(w);
  }));
  BOOKS[bk.id] = bk;
});
const BOOK_IDS = DATA.books.map(b => b.id);
const BY_ID = Object.fromEntries(
  DATA.books.flatMap(bk => bk.words.map(w => [w.id, w])));
const curBook = () => BOOKS[S.set.book] || BOOKS[BOOK_IDS[0]];
const curWords = () => curBook().words;

/* ===================== 存储 ===================== */
const KEY = 'igcse-flashcard-v1';
const DEF = {
  prog: {},                       // id(<book>:<word>) -> {box, due, seen, wrong, star}
  les: {},                        // 课时 id -> {goals:[], check:[]} 勾选状态
  set: { rate: .95, voice: '', autoSpeak: true, sylMode: 'respell', maskZh: false, theme: 'light', book: 'sci' }
};
let S = load();
function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || '{}');
    const S = { prog: raw.prog || {}, les: raw.les || {},
                set: Object.assign({}, DEF.set, raw.set || {}) };
    // 旧版进度按裸词存，两本词书上线后改按 <book>:<word>。裸 key 一律归到科学书。
    let moved = 0;
    for (const k of Object.keys(S.prog)) {
      if (k.includes(':')) continue;
      S.prog['sci:' + k] = S.prog[k]; delete S.prog[k]; moved++;
    }
    if (moved) { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
    if (!BOOKS[S.set.book]) S.set.book = BOOK_IDS[0];
    return S;
  } catch (e) { return JSON.parse(JSON.stringify(DEF)); }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function lrec(id) { return S.les[id] || (S.les[id] = { goals: [], check: [] }); }
function rec(id) { return S.prog[id] || (S.prog[id] = { box: 0, due: 0, seen: 0, wrong: 0, star: 0 }); }
function applyTheme() {
  const dark = S.set.theme === 'dark';
  document.documentElement.classList.toggle('dark', dark);   // :root.dark → color-scheme:dark → light-dark() 全量切换
  document.querySelector('meta[name=theme-color]').content = dark ? '#111112' : '#F8F4ED';
}
/* 线性图标（与 Astryx 的线条风格一致） */
const IC = {
  spk: '<svg viewBox="0 0 24 24"><path d="M11 5L6.5 9H3v6h3.5L11 19z"/><path d="M14.8 9.6a3.4 3.4 0 0 1 0 4.8"/><path d="M17.4 7a7 7 0 0 1 0 10"/></svg>',
  slow: '<svg viewBox="0 0 24 24"><path d="M11 5L6.5 9H3v6h3.5L11 19z"/><path d="M14.8 9.6a3.4 3.4 0 0 1 0 4.8"/></svg>',
  play: '<svg viewBox="0 0 24 24"><path d="M7.5 4.8l11 7.2-11 7.2z"/></svg>',
  tick: '<svg viewBox="0 0 24 24"><path d="M5 12.6l4.6 4.6L19 7.6"/></svg>'
};
applyTheme();

/* 间隔重复：盒子 0..5 对应的下次复习间隔 */
const STEP = [0, 10 * 60e3, 24 * 3600e3, 3 * 24 * 3600e3, 7 * 24 * 3600e3, 21 * 24 * 3600e3];
function grade(id, g) {
  const r = rec(id); r.seen++;
  if (g === 0) { r.box = 0; r.wrong++; }
  else if (g === 1) { r.box = Math.min(Math.max(r.box, 1), 3); }   // 模糊：至少 10 分钟后再来
  else { r.box = Math.min(5, r.box + 1); }
  r.due = Date.now() + STEP[r.box];
  save();
}
const isDue = w => { const r = S.prog[w.id]; return r && r.seen > 0 && r.due <= Date.now(); };
const isNew = w => !S.prog[w.id] || !S.prog[w.id].seen;
const isMastered = w => (S.prog[w.id]?.box || 0) >= 4;
const dueCount = b => BOOKS[b].words.filter(isDue).length;

/* ===================== 朗读 ===================== */
let VOICES = [], booted = false;
/* 英音优先、系统默认音优先，玩具音色排最后 */
const FUN = /bad news|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|albert|bahh|junior|ralph|kathy|fred|grandma|grandpa|rocko|shelley|sandy|eddy|flo|reed|rishi/i;
const rank = v => (FUN.test(v.name) ? 4 : 0) + (/en[-_]GB/i.test(v.lang) ? 0 : 1) + (v.default ? -1 : 0);
function loadVoices() {
  VOICES = (speechSynthesis.getVoices() || []).filter(v => /^en/i.test(v.lang))
    .sort((a, b) => (rank(a) - rank(b)) || a.name.localeCompare(b.name));
  if (booted && curView === 'me') render();   // 语音列表异步到达时刷新设置页
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function pickVoice() {
  if (!VOICES.length) return null;
  if (S.set.voice) { const v = VOICES.find(v => v.voiceURI === S.set.voice); if (v) return v; }
  return VOICES.find(v => /en[-_]GB/i.test(v.lang)) || VOICES[0];
}
/* 慢速用绝对值而不是「正常速 − 偏移」：部分系统语音对 rate 不敏感，差距必须拉够大 */
const SLOW = .4;

/* iOS / Safari 要求首次朗读发生在用户手势内，先用一个静音串把引擎唤醒 */
let ttsPrimed = false, ttsWarned = false;
function primeTTS() {
  if (ttsPrimed || !window.speechSynthesis) return;
  ttsPrimed = true;
  try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
}
document.addEventListener('pointerdown', primeTTS, { once: true, capture: true });
document.addEventListener('touchstart', primeTTS, { once: true, capture: true, passive: true });

function stopSpeak() {
  try { if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel(); } catch (e) {}
}
/* 真正发声。Chrome/Safari 偶尔会卡在 speaking=true 却不出声，这里做超时自检并重试一次 */
function speakNow(text, rate, onend, attempt) {
  if (!window.speechSynthesis) { onend && onend(); return; }
  attempt = attempt || 0;
  let started = false, done = false, abandoned = false;
  // abandoned：这一条已被自检放弃，随后 cancel() 触发的 onend/onerror 一律忽略
  const finish = () => { if (!done && !abandoned) { done = true; onend && onend(); } };
  try {
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice();
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-GB';
    u.rate = rate ?? S.set.rate; u.pitch = 1;
    u.onstart = () => started = true;
    u.onend = finish; u.onerror = finish;
    try { speechSynthesis.resume(); } catch (e) {}   // 解掉 Chrome 的暂停态
    speechSynthesis.speak(u);
  } catch (e) { finish(); return; }
  setTimeout(() => {
    if (started || done) return;
    abandoned = true;
    stopSpeak();
    if (attempt < 1) { speakNow(text, rate, onend, attempt + 1); return; }   // 重试一次
    if (!ttsWarned) { ttsWarned = true; toast('这个浏览器没能发声，换 Safari / Chrome 打开试试'); }
    onend && onend();                                                        // 放弃，把控制权交回
  }, 450);
}
function say(text, rate, cb) { stopSpeak(); speakNow(text, rate, cb); }

/* 依次朗读一串内容，可带高亮回调 */
function sayList(items, i) {
  i = i || 0;
  if (i >= items.length) return;
  const it = items[i];
  if (i === 0) stopSpeak();
  it.on && it.on();
  speakNow(it.text, it.rate, () => {
    it.off && it.off();
    setTimeout(() => sayList(items, i + 1), it.gap ?? 180);
  });
}

/* IPA → 便于 TTS 读出的拟音串（让单个音节也能读准） */
const MAP = [
  ['aɪə','ire'],['aʊə','ower'],['tʃ','ch'],['dʒ','j'],['iː','ee'],['ɑː','ah'],['ɔː','aw'],['uː','oo'],
  ['ɜː','ur'],['ɪə','eer'],['eə','air'],['ʊə','oor'],['eɪ','ay'],['aɪ','igh'],['ɔɪ','oy'],['aʊ','ow'],
  ['əʊ','oh'],['ɛ','eh'],['æ','a'],['ɒ','o'],['ʌ','uh'],['ə','uh'],['ɪ','ih'],['ʊ','oo'],
  ['θ','th'],['ð','th'],['ʃ','sh'],['ʒ','zh'],['ŋ','ng'],['j','y'],['ɡ','g'],['ː',''],
  ['e','eh'],['i','ee'],['u','oo']
];
function respell(ipa) {
  let s = ipa.replace(/[ˈˌ\/·]/g, ''), out = '';
  outer: while (s.length) {
    for (const [a, b] of MAP) { if (s.startsWith(a)) { out += b; s = s.slice(a.length); continue outer; } }
    out += s[0]; s = s.slice(1);
  }
  if (out === 'igh') out = 'eye';
  if (!/[aeiouy]/.test(out) && out.length) {                 // 无元音的音节（如 ʃn）补一个模糊元音
    out = out.length > 1 ? out.slice(0, -1) + 'u' + out.slice(-1) : out + 'uh';
  }
  return out;
}
const sylText = sy => S.set.sylMode === 'respell' ? respell(sy.p) : sy.t;

/* ===================== 音节渲染（一元一辅） ===================== */
const VOW = 'aeiouyAEIOUY';
const IPA_VOW = /[iɪeɛæaɑɒɔʊuʌɜəɐ]/;                 // 以元音音素收尾 = 开音节
function sylHTML(sy, ix) {
  const letters = [...sy.t].map(ch => /[a-z]/i.test(ch)
    ? `<span class="${VOW.includes(ch) ? 'v' : 'c'}">${ch}</span>` : ch).join('');
  const p = sy.p.replace(/[ˈˌː]/g, '');
  const open = IPA_VOW.test(p.slice(-1));
  return `<span class="ix">${ix + 1}</span><span class="oc">${open ? '开' : '闭'}</span>`
    + `<div class="sp">${letters}</div><div class="pp">${sy.p}</div>`;
}
/* ---------- 倒切法：从词尾向前，一元一辅切字母 ----------
   规则：两个元音之间——0 个辅音直接切；1 个辅音归后（开音节）；
   2 个以上留一个给前面、其余归后（闭音节）；二合字母与 塞音+l/r 连缀不拆；
   词尾不发音的 e 并回前一块。 */
const DIGRAPH = ['ch', 'sh', 'th', 'ph', 'wh', 'ck', 'ng', 'gh', 'qu'];
const BLEND = ['bl', 'br', 'cl', 'cr', 'dr', 'fl', 'fr', 'gl', 'gr', 'pl', 'pr', 'tr', 'thr', 'str', 'spr', 'scr', 'shr'];
const ONSET2 = ['st', 'sp', 'sk', 'sc', 'sl', 'sm', 'sn', 'sw', 'tw'];   // 只在三辅音时整体归后：sub|stance
function letterSplit(word) {
  const w = word, isV = i => {
    const c = (w[i] || '').toLowerCase();
    if (!c) return false;
    if (c === 'y') return i > 0;                 // 词首 y 当辅音
    return 'aeiou'.indexOf(c) >= 0;
  };
  const units = [];                              // 元音单位（相邻元音字母合并）
  for (let i = 0; i < w.length; i++) {
    if (isV(i)) { let j = i; while (isV(j + 1)) j++; units.push([i, j]); i = j; }
  }
  // 词尾不发音的 e 不算一个元音（state / change / evaporate），但 -le 结尾要保留
  const lastU = units[units.length - 1];
  if (units.length > 1 && lastU[0] === lastU[1] && lastU[0] === w.length - 1
    && /e/i.test(w[lastU[0]]) && !/[aeioul]/i.test(w[lastU[0] - 1] || '')) units.pop();
  if (units.length < 2) return [w];
  const cuts = [];
  for (let k = units.length - 1; k >= 1; k--) {  // 从后往前一刀刀切
    const L = units[k - 1][1], R = units[k][0], cons = w.slice(L + 1, R);
    let cut;
    if (!cons.length) cut = R;
    else if (cons.length === 1) cut = /x/i.test(cons) ? R : R - 1;   // x 读 /ks/，整体归前：tox|ic
    else {
      const t3 = cons.slice(-3).toLowerCase(), t2 = cons.slice(-2).toLowerCase();
      cut = (cons.length >= 3 && BLEND.includes(t3)) ? R - 3
        : (DIGRAPH.includes(t2) || BLEND.includes(t2) || (cons.length >= 3 && ONSET2.includes(t2))) ? R - 2
          : R - 1;
      if (cut <= L) cut = L + 1;
    }
    cuts.push(cut);
  }
  cuts.sort((a, b) => a - b);
  const parts = []; let p = 0;
  cuts.forEach(c => { if (c > p) { parts.push(w.slice(p, c)); p = c; } });
  parts.push(w.slice(p));
  if (parts.length > 1 && /^[^aeiou]?e$/i.test(parts[parts.length - 1]))   // 结尾哑音 e 并回去
    parts.splice(-2, 2, parts[parts.length - 2] + parts[parts.length - 1]);
  return parts.filter(Boolean);
}
const colorLetters = t => [...t].map(ch => /[a-z]/i.test(ch)
  ? `<span class="${VOW.includes(ch) ? 'v' : 'c'}">${ch}</span>` : ch).join('');

/* 倒切法一行：块之间标出切刀顺序（从右往左 ①②③） */
function cutHTML(w) {
  let h = '';
  w.w.split(/[\s-]+/).forEach((word, wi) => {
    const parts = letterSplit(word);
    if (wi) h += '<span class="cutsep">·</span>';
    parts.forEach((p, i) => {
      if (i) h += `<span class="knife">${parts.length - i}</span>`;
      h += `<button class="cut" data-t="${esc(p)}">${colorLetters(p)}</button>`;
    });
  });
  return h;
}
/* ---------- 翻译思路 ----------
   上排按英语原序显示意群，下排按 order 重排成中文语序，同一成分同色，
   让「后置定语要前移」这件事用颜色直接看出来 */
function transHTML(w) {
  const t = w.tr;
  const flow = t.flow.map(([en, zh, r]) =>
    `<div class="fl"><span class="fe">${esc(en)}</span><span class="fz ${r || 'x'}">${esc(zh)}</span></div>`).join('');
  const tree = (t.tree || []).map(([lv, en, zh]) =>
    `<div class="tv l${lv}">${lv ? '<span class="br">└</span>' : ''}
      <span class="te ${lv ? 'd' : 'h'}">${esc(en)}</span><span class="tz">${esc(zh)}</span></div>`).join('');
  const asm = (t.asm || []).map(([z, r], i) =>
    (i ? '<span class="ar">→</span>' : '') + `<span class="zk ${r || 'x'}">${esc(z)}</span>`).join('');
  const shift = t.shift
    ? `<div class="tr-step">词性转换</div>
       <div class="nom"><b>${esc(t.shift[0])}</b><span class="ar">→</span><b>${esc(t.shift[1])}</b>
       <em>${esc(t.shift[2])}</em></div>` : '';
  return `<div class="tr" id="trBox">
    <div class="tr-hd">翻译思路<span class="pat">${esc(t.pat)}</span></div>

    <div class="tr-step">① 顺着读，不回头</div>
    <div class="flow">${flow}</div>
    <div class="tr-note">读到句尾自然就懂了 —— 这是读英语该有的姿势，别倒回去找中心词。</div>

    <div class="tr-step">② 主干</div>
    <div class="core"><div class="ce">${esc(t.core[0])}</div><div class="cz">${esc(t.core[1])}</div></div>

    ${tree ? `<div class="tr-step">③ 修饰挂在哪（缩进 = 嵌套层级）</div>
    <div class="tree">${tree}</div>` : ''}
    ${shift}

    ${asm ? `<div class="tr-step">${tree ? '④' : '③'} 中文从最里层往外装</div>
    <div class="zhline">${asm}</div>` : ''}
    <div class="tr-step">${tree && asm ? '⑤' : (tree || asm) ? '④' : '③'} 完整译文</div>
    <div class="tr-final">${t.final
      ? t.final.map(([z, r]) => `<span class="fw ${r || 'x'}">${esc(z)}</span>`).join('')
      : esc(w.exzh)}</div>
    <div class="tr-tip">${esc(t.tip)}</div>
  </div>`;
}

    }).join('')}
  </div>

  <div class="sec-t">阅读材料</div>
  ${les.reading.map(([t, ss], i) => `<div class="card read" data-r="${i}">
    <div class="rt"><span class="rn">${i + 1}</span>${esc(t)}<span class="rmore">英文表达 ▾</span></div>
    <p>${ss.map(x => inlineTerms(x.zh)).join('')}</p>
    <div class="ranly">
      <button class="btn line blk rslow" data-seq="${i}">${IC.slow} 整段慢读（${ss.length} 句连读）</button>
      ${ss.map(x => `<div class="rs">
        <div class="rs-en">${esc(x.en)}</div>
        <div class="rs-btns">
          <button class="btn tiny" data-say="${esc(x.en)}">${IC.spk} 朗读</button>
          <button class="btn tiny" data-say="${esc(x.en)}" data-slow="1">${IC.slow} 慢读</button>
        </div>
        <div class="rs-parts">${x.parts.map(([zh, en, r]) =>
          `<div class="pr"><span class="pz">${esc(zh)}</span><span class="pe ${r || 'x'}">${esc(en)}</span></div>`).join('')}</div>
        <div class="rs-note">${esc(x.note)}</div>
      </div>`).join('')}
    </div>
  </div>`).join('')}
  <div class="tiny muted" style="margin:-2px 2px 0">点整块看英文表达与拆解 · 每句可朗读或慢读 · 括号里的英文也能点</div>

  <div class="sec-t">上课前自查</div>
  <div class="card setgrp">
    ${les.check.map((c, i) => `<div class="chkrow" data-k="check" data-i="${i}">
      <span class="tick${r.check[i] ? ' on' : ''}">${IC.tick}</span><span>${esc(c)}</span></div>`).join('')}
  </div>
  <div class="credit">思考题请在纸上完成</div>`;

  $('lesBack').onclick = () => { lesId = null; view.scrollTop = 0; render(); };
  $('lesGo').onclick = () => startStudy(words.slice(), `第 ${les.id} 节`);
  view.onclick = e => {
    const seq = e.target.closest('[data-seq]');
    if (seq) {                                   // 整段慢读：逐句连读，读到哪句高亮哪句
      e.stopPropagation();
      const blk = seq.closest('.read');
      blk.classList.add('on');
      const ss = les.reading[+seq.dataset.seq][1];
      const els = [...blk.querySelectorAll('.rs')];
      sayList(ss.map((x, k) => ({
        text: x.en, rate: SLOW + .05, gap: 420,
        on: () => els[k]?.classList.add('hi'), off: () => els[k]?.classList.remove('hi')
      })));
      return;
    }
    const sp = e.target.closest('[data-say]');
    if (sp) { e.stopPropagation(); say(sp.dataset.say, sp.dataset.slow ? SLOW + .05 : undefined); return; }
    const ck = e.target.closest('.chkrow');
    if (ck) {
      const a = lrec(les.id)[ck.dataset.k], i = +ck.dataset.i;
      a[i] = !a[i]; save();
      ck.querySelector('.tick').classList.toggle('on', !!a[i]);
      return;
    }
    const row = e.target.closest('.row');
    if (row) { startStudy([BY_ID[row.dataset.w]], `第 ${les.id} 节`); return; }
    const rd = e.target.closest('.read');
    if (rd) rd.classList.toggle('on');
  };
}

/* 首页里的「课前预习」一段，只显示属于当前书的课时 */
function lessonSectionHTML() {
  const L = (DATA.lessons || []).filter(l => l.book === S.set.book);
  if (!L.length) return '';
  return `<div class="sec-t">课前预习 · ${L.length} 节</div>` +
    L.map(les => {
      const ws = lessonWords(les);
      const d = ws.filter(isMastered).length;
      return `<button class="card chap lcard" data-les="${les.id}">
        <div class="no">${les.id}</div>
        <div class="bd">
          <div class="t">${esc(les.title)}</div>
          <div class="e">${ws.length} 词 · ${les.reading.length} 段阅读 · 约 ${les.mins} 分钟</div>
          <div class="bar"><i style="width:${d / ws.length * 100}%"></i></div>
        </div>
        <div class="n">${d}/${ws.length}</div>
      </button>`;
    }).join('');
}

/* ---------- 句型 ---------- */
function renderFrames() {
  const bk = curBook();
  view.innerHTML = bookBarHTML() +
    `<div class="sec-t">常用科学英语句型 · ${bk.frames.length} 组</div>` +
    bk.frames.map((f, i) => `<div class="card fr">
      <div class="use">${esc(f.use)}</div>
      <div class="fm">${esc(f.frame)}</div>
      <div class="en">${esc(f.ex)}</div>
      <div class="cn">${esc(f.exzh)}</div>
      <div style="margin-top:12px"><button class="btn line tiny" data-f="${i}">${IC.spk} 朗读例句</button></div>
    </div>`).join('') +
    `<div class="credit">先模仿句型，再替换关键词造句</div>`;
  bindBookBar();
  view.onclick = e => { const b = e.target.closest('[data-f]'); if (b) say(bk.frames[b.dataset.f].ex); };
}

/* ---------- 设置 ---------- */
function renderMe() {
  const W = curWords();
  const boxes = [0, 1, 2, 3, 4, 5].map(b => W.filter(w => (S.prog[w.id]?.box || 0) === b && !isNew(w)).length);
  view.innerHTML = `
  <div class="sec-t">外观</div>
  <div class="card setgrp">
    <div class="set"><div class="lb">主题<small>夜里背单词可切深色</small></div>
      <select id="theme">
        <option value="light"${S.set.theme === 'light' ? ' selected' : ''}>浅色</option>
        <option value="dark"${S.set.theme === 'dark' ? ' selected' : ''}>深色</option>
      </select></div>
  </div>

  <div class="sec-t">朗读</div>
  <div class="card setgrp">
    <div class="set"><div class="lb">正常语速<small>「慢速」固定为 0.4 倍，不受这里影响</small></div>
      <input type="range" id="rate" min="0.5" max="1.3" step="0.05" value="${S.set.rate}"></div>
    <div class="set"><div class="lb">发音<small>建议选 en-GB 英式；若慢速听不出差别，换一个语音试试</small></div>
      <select id="voice">${VOICES.length ? VOICES.map(v =>
      `<option value="${esc(v.voiceURI)}"${v.voiceURI === pickVoice()?.voiceURI ? ' selected' : ''}>${esc(v.name)} (${v.lang})</option>`).join('')
      : '<option>系统未提供英文语音</option>'}</select></div>
    <div class="set"><div class="lb">音节朗读方式<small>拟音更接近音标，拼写更接近字母</small></div>
      <select id="sylMode">
        <option value="respell"${S.set.sylMode === 'respell' ? ' selected' : ''}>按音标拟音</option>
        <option value="spell"${S.set.sylMode === 'spell' ? ' selected' : ''}>按拼写</option>
      </select></div>
    <div class="set"><div class="lb">翻卡自动朗读<small>显示新卡片时自动读一遍</small></div>
      <button class="sw${S.set.autoSpeak ? ' on' : ''}" id="auto"><i></i></button></div>
  </div>
  <button class="btn line blk" id="test">${IC.spk} 试听：photosynthesis</button>

  <div class="sec-t">学习记录</div>
  <div class="card panel">
    <div class="tiny muted" style="margin-bottom:12px">记忆盒子（等级越高，复习间隔越长）</div>
    ${boxes.map((n, i) => `<div class="lvrow">
      <em>Lv.${i}</em>
      <span class="bar" style="flex:1;margin:0"><i style="width:${n / W.length * 100}%"></i></span>
      <u>${n}</u></div>`).join('')}
    <div class="tiny muted" style="margin-top:10px">间隔：即时 · 10 分钟 · 1 天 · 3 天 · 7 天 · 21 天</div>
  </div>
  <button class="btn line blk" id="reset" style="margin-top:10px;color:var(--color-error)">清空全部学习进度（两科）</button>
  <div class="credit">数据保存在本机浏览器，离线可用</div>`;

  $('theme').onchange = e => { S.set.theme = e.target.value; save(); applyTheme(); };
  $('rate').oninput = e => { S.set.rate = +e.target.value; save(); };
  $('voice').onchange = e => { S.set.voice = e.target.value; save(); };
  $('sylMode').onchange = e => { S.set.sylMode = e.target.value; save(); };
  $('auto').onclick = e => { S.set.autoSpeak = !S.set.autoSpeak; e.currentTarget.classList.toggle('on', S.set.autoSpeak); save(); };
  $('test').onclick = () => {
    const w = BY_ID['sci:photosynthesis'];
    sayList([...flatSyl(w).map(sy => ({ text: sylText(sy), rate: SLOW, gap: 220 })), { text: w.w, rate: S.set.rate }]);
  };
  $('reset').onclick = () => { if (confirm('确定清空两本词书的全部学习进度？')) { S.prog = {}; save(); render(); toast('已清空'); } };
}

/* ===================== 卡片学习 ===================== */
let Q = [], qi = 0, flipped = false, qName = '', requeued = new Set();
function startStudy(list, name) {
  if (!list || !list.length) { toast('没有可学习的词'); return; }
  Q = list; qi = 0; qName = name || ''; flipped = false; requeued = new Set();
  $('study').classList.add('on');
  drawCard(true);
}
$('stClose').onclick = () => { stopSpeak(); $('study').classList.remove('on'); render(); };
$('stStar').onclick = () => {
  const r = rec(Q[qi].id); r.star = r.star ? 0 : 1; save();
  $('stStar').classList.toggle('star-on', !!r.star);
  toast(r.star ? '已加入难词本' : '已移出难词本');
};

function drawCard(speak) {
  const w = Q[qi];
  flipped = false;
  $('card3d').classList.remove('flip');
  $('stPg').textContent = `${qi + 1}/${Q.length}`;
  $('stProg').style.width = (qi / Q.length * 100) + '%';
  $('stStar').classList.toggle('star-on', !!S.prog[w.id]?.star);

  const tag = `<span class="sn">${w.sec}</span>${esc(w.secName)}`
    + (qName && qName !== w.secName ? ` · ${esc(qName)}` : '');
  $('faceF').innerHTML = `
    <div class="tag">${tag}</div>
    <div class="mid">
      <div class="word${w.w.length > 14 ? ' long' : ''}">${esc(w.w)}</div>
      <div class="ipa">${esc(w.ipa)}</div>
      <div class="spk">
        <button class="btn line" data-a="say">${IC.spk} 朗读</button>
        <button class="btn line" data-a="slow">${IC.slow} 慢速</button>
        <button class="btn line" data-a="seq">${IC.play} 逐音节跟读</button>
      </div>
      <div class="syl-h">发音音节 · 一元一辅（点音节单独听）</div>
      <div class="syls" id="syls">${syllablesHTML(w)}</div>
      <div class="syl-h">倒切法 · 从词尾往前切字母</div>
      <div class="cuts">${cutHTML(w)}</div>
      <div class="cutnote">
        圆圈数字 = 下刀顺序（从后往前）：每次带走「一个元音 + 它后面的辅音」，两辅音之间前后各分一个。
        ${sameSplit(w) ? '　<b>✓ 与发音音节一致</b>' : '　<i>⚠︎ 与发音音节不同，读音以上面一行为准</i>'}
      </div>
    </div>
    <div class="hint">
      <span class="legend"><s style="background:var(--color-icon-red)"></s>元音字母</span>
      <span class="legend"><s style="background:var(--color-brand)"></s>辅音字母</span>　·　轻点卡片看释义
    </div>`;

  $('faceB').innerHTML = `
    <div class="tag">${esc(w.w)}　${esc(w.ipa)}</div>
    <div class="mid">
      <div class="zh">${esc(w.zh)}</div>
      <div class="blk2"><div class="lb">记忆法</div><p>${esc(w.tip)}</p></div>
      <div class="ex">
        <div class="en">${esc(w.ex)}</div>
        <div class="cn">${esc(w.exzh)}</div>
        <div class="rowbtn">
          <button class="btn tiny" data-a="ex">${IC.spk} 读例句</button>
          <button class="btn tiny" data-a="exslow">${IC.slow} 慢速</button>
        </div>
      </div>
      ${w.tr ? transHTML(w) : ''}
    </div>
    <div class="hint">轻点卡片返回正面　·　左右滑动切换单词</div>`;

  if (speak !== false && S.set.autoSpeak) setTimeout(() => say(w.w), 260);
}

/* 卡片交互：按钮 / 音节 / 翻面 */
$('card3d').addEventListener('click', e => {
  const w = Q[qi];
  const b = e.target.closest('[data-a]');
  if (b) {
    e.stopPropagation();
    const a = b.dataset.a;
    if (a === 'say') say(w.w);
    else if (a === 'slow') say(w.w, SLOW);
    else if (a === 'ex') say(w.ex);
    else if (a === 'exslow') say(w.ex, SLOW + .05);
    else if (a === 'seq') playSeq(w);
    return;
  }
  const cut = e.target.closest('.cut');
  if (cut) {
    e.stopPropagation();
    say(cut.dataset.t, SLOW);
    return;
  }
  const sy = e.target.closest('.syl');
  if (sy) {
    e.stopPropagation();
    const s = flatSyl(w)[+sy.dataset.k];
    say(sylText(s), SLOW);
    return;
  }
  flipped = !flipped;
  $('card3d').classList.toggle('flip', flipped);
});

/* 逐音节跟读：一个个音节 → 整词慢速 → 整词正常 */
function playSeq(w) {
  const chips = [...document.querySelectorAll('#syls .syl')];
  const items = flatSyl(w).map((sy, i) => ({
    text: sylText(sy), rate: SLOW, gap: 240,
    on: () => chips[i]?.classList.add('hi'), off: () => chips[i]?.classList.remove('hi')
  }));
  items.push({ text: w.w, rate: SLOW, gap: 300 }, { text: w.w, rate: S.set.rate });
  sayList(items);
}

/* 评分 */
document.querySelector('.acts').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  const g = +b.dataset.g, w = Q[qi];
  grade(w.id, g);
  if (g === 0 && !requeued.has(w.id)) { requeued.add(w.id); Q.push(w); }   // 忘记的词本轮末尾再出现一次
  next();
};
function next() {
  stopSpeak();
  if (qi >= Q.length - 1) {
    $('stProg').style.width = '100%';
    toast('这一组完成了 🎉');
    setTimeout(() => { $('study').classList.remove('on'); render(); }, 700);
    return;
  }
  qi++; drawCard();
}

/* 左右滑动切换 */
let tx = 0, ty = 0;
const cw = document.querySelector('.cardwrap');
cw.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
cw.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
  stopSpeak();
  if (dx < 0 && qi < Q.length - 1) { qi++; drawCard(); }
  else if (dx > 0 && qi > 0) { qi--; drawCard(); }
}, { passive: true });

/* 学习 / 词表 / 句型 三页左右滑动切换科目。判定与卡片页保持一致 */
let vx = 0, vy = 0;
view.addEventListener('touchstart', e => {
  vx = e.touches[0].clientX; vy = e.touches[0].clientY;
}, { passive: true });
view.addEventListener('touchend', e => {
  if (curView === 'me' || lesId != null) return;      // 设置页与预习详情页不参与
  const dx = e.changedTouches[0].clientX - vx, dy = e.changedTouches[0].clientY - vy;
  if (Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
  const i = BOOK_IDS.indexOf(S.set.book) + (dx < 0 ? 1 : -1);
  if (i >= 0 && i < BOOK_IDS.length) switchBook(BOOK_IDS[i]);   // 到头不循环
}, { passive: true });

/* ===================== 杂项 ===================== */
let tt;
function toast(m) {
  const el = $('toast'); el.textContent = m; el.classList.add('on');
  clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 1600);
}
document.addEventListener('keydown', e => {
  if (!$('study').classList.contains('on')) return;
  if (e.key === ' ') { e.preventDefault(); $('card3d').click(); }
  if (e.key === 'ArrowRight' && qi < Q.length - 1) { qi++; drawCard(); }
  if (e.key === 'ArrowLeft' && qi > 0) { qi--; drawCard(); }
  if (e.key === 'Escape') $('stClose').click();
});
$('hdS').textContent = `${Object.values(BOOKS).reduce((n, b) => n + b.words.length, 0)} 词 · 音标 · 拆音节 · 朗读`;
booted = true;
render();
</script>

</html>
