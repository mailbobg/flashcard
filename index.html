:root{
  color-scheme:light;
  --color-background-body:light-dark(#F8F4ED,#111112);
  --color-background-card:light-dark(#FFFFFF,#1F1F22);
  --color-background-muted:light-dark(#0536590C,#1111127F);
  --color-background-inverted:light-dark(#0A1317,#FFFFFF);
  --color-background-blue:light-dark(#0171E333,#0171E333);
  --color-text-primary:light-dark(#15110C,#DFE2E5);
  --color-text-secondary:light-dark(#4E606F,#AAAFB5);
  --color-text-disabled:light-dark(#A4B0BC,#6F747C);
  --color-text-red:light-dark(#7B0210,#FFB2B8);
  --color-text-yellow:light-dark(#753F07,#FBCE03);
  --color-text-green:light-dark(#09441F,#A5F690);
  --color-text-blue:light-dark(#042F97,#AFD7FF);
  --color-text-purple:light-dark(#3E0697,#B3B0FE);
  --color-text-cyan:light-dark(#014975,#A1EEF9);
  --color-background-red:light-dark(#E3193B26,#E3193B33);
  --color-background-yellow:light-dark(#E2A40033,#E2A40033);
  --color-background-green:light-dark(#24BB5E26,#24BB5E33);
  --color-background-purple:light-dark(#7952FF26,#7952FF33);
  --color-background-cyan:light-dark(#03A7D726,#03A7D733);
  --color-neutral:light-dark(rgba(5,54,89,.1),rgba(223,226,229,.2));
  --color-background-orange:light-dark(#F2790233,#F2790233);
  --color-text-orange:light-dark(#6B2203,#FDB876);
  --color-accent:light-dark(#15110C,#DFE2E5);
  --color-on-accent:light-dark(#FFFFFF,#15110C);
  --color-accent-muted:light-dark(rgba(21,17,12,.08),rgba(223,226,229,.14));
  --color-brand:light-dark(#225BFF,#3D87FF);
  --color-icon-red:light-dark(#D31130,#E3193B);
  --color-border:light-dark(#05365919,#F2F4F619);
  --color-border-emphasized:light-dark(#CCD3DB,#494D53);
  --color-track:light-dark(#CCD3DB,#5A5E66);
  --color-success:light-dark(#0D8626,#26A756);
  --color-success-muted:light-dark(#0B991F33,#0B991F3F);
  --color-warning:light-dark(#E9AF08,#F2C00B);
  --color-warning-muted:light-dark(#E2A40033,#E2A4003F);
  --color-error:light-dark(#E3193B,#F5394F);
  --color-error-muted:light-dark(#E3193B33,#F5394F3F);
  --shadow-low:0px 1px 1px light-dark(rgba(0,0,0,.1),rgba(0,0,0,.2)),0px 2px 8px light-dark(rgba(0,0,0,.1),rgba(0,0,0,.2));
  --shadow-med:0px 1px 2px light-dark(rgba(0,0,0,.1),rgba(0,0,0,.2)),0px 2px 12px light-dark(rgba(0,0,0,.1),rgba(0,0,0,.2));
  --shadow-high:0px 2px 2px light-dark(rgba(0,0,0,.1),rgba(0,0,0,.2)),0px 8px 24px light-dark(rgba(0,0,0,.1),rgba(0,0,0,.3));
  --radius-inner:8px; --radius-element:12px; --radius-container:16px; --radius-page:32px; --radius-full:9999px;
  --spacing-1:4px; --spacing-2:8px; --spacing-3:12px; --spacing-4:16px; --spacing-5:20px; --spacing-6:24px; --spacing-8:32px;
  --font-family-body:Figtree,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-size-xs:.625rem; --font-size-sm:.75rem; --font-size-base:.875rem; --font-size-lg:1.0625rem;
  --font-size-xl:1.25rem; --font-size-2xl:1.5rem; --font-size-3xl:1.8125rem; --font-size-5xl:2.625rem;
  --font-weight-medium:500; --font-weight-semibold:600; --font-weight-bold:700;
  --ease-standard:cubic-bezier(.24,1,.4,1);
  --duration-fast:175ms; --duration-medium:410ms;
  --border-width:1px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
:root.dark{color-scheme:dark}
/* light-dark() 不支持时的浅色兜底 */
@supports not (color:light-dark(#000,#fff)){
  :root{
    --color-background-body:#F8F4ED; --color-background-card:#FFFFFF; --color-background-muted:#0536590C;
    --color-background-inverted:#0A1317; --color-background-blue:#0171E333;
    --color-text-primary:#15110C; --color-text-secondary:#4E606F; --color-text-disabled:#A4B0BC;
    --color-text-red:#7B0210; --color-text-yellow:#753F07; --color-text-green:#09441F; --color-text-blue:#042F97;
    --color-accent:#15110C; --color-on-accent:#FFFFFF; --color-accent-muted:rgba(21,17,12,.08);
    --color-brand:#225BFF; --color-icon-red:#D31130; --color-border:#05365919; --color-border-emphasized:#CCD3DB;
    --color-track:#CCD3DB; --color-success:#0D8626; --color-success-muted:#0B991F33; --color-warning:#E9AF08;
    --color-warning-muted:#E2A40033; --color-error:#E3193B; --color-error-muted:#E3193B33;
    --shadow-low:0 1px 1px rgba(0,0,0,.1),0 2px 8px rgba(0,0,0,.1);
    --shadow-med:0 1px 2px rgba(0,0,0,.1),0 2px 12px rgba(0,0,0,.1);
    --shadow-high:0 2px 2px rgba(0,0,0,.1),0 8px 24px rgba(0,0,0,.1);
  }
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.ogimg{position:absolute;left:-9999px;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
html,body{height:100%}
body{
  background:var(--color-background-body); color:var(--color-text-primary); overflow:hidden;
  font-family:var(--font-family-body); font-size:var(--font-size-base); line-height:1.4286;
  -webkit-font-smoothing:antialiased;
}
/* Astryx hero 的极光底：暖桃 + 玫瑰，压在象牙纸下方 */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(70% 42% at 8% 100%, light-dark(rgba(242,121,2,.16),rgba(61,135,255,.10)), transparent 70%),
    radial-gradient(64% 40% at 92% 100%, light-dark(rgba(230,56,179,.14),rgba(121,82,255,.12)), transparent 72%),
    radial-gradient(90% 30% at 50% 100%, light-dark(rgba(226,164,0,.10),transparent), transparent 70%);
}

#app{height:100dvh;height:100vh;display:flex;flex-direction:column}
.hd{
  padding:calc(var(--safe-t) + 16px) var(--spacing-5) var(--spacing-3);
  display:flex;align-items:center;gap:10px;flex:0 0 auto;
}
.mark{flex:0 0 auto;width:32px;height:32px;display:block}
.mark svg{width:100%;height:100%;display:block}
.hd h1{font-size:var(--font-size-lg);font-weight:var(--font-weight-semibold);letter-spacing:-.01em}
.hd .sub{font-size:var(--font-size-xs);color:var(--color-text-secondary);font-weight:400;margin-top:1px}
main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 var(--spacing-5) var(--spacing-6)}

.tabbar{
  flex:0 0 auto;display:flex;gap:2px;padding:6px var(--spacing-3) calc(var(--safe-b) + 6px);
  background:var(--color-background-card);border-top:var(--border-width) solid var(--color-border);
}
.tabbar button{
  flex:1;background:none;border:0;color:var(--color-text-secondary);padding:7px 0 5px;font-size:var(--font-size-xs);
  display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;font-weight:var(--font-weight-medium);
  border-radius:var(--radius-element);transition:color var(--duration-fast) var(--ease-standard);
}
.tabbar button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--color-text-primary);background:var(--color-accent-muted)}

/* ---------- 基础控件 ---------- */
.btn{
  background:var(--color-background-muted);border:var(--border-width) solid transparent;color:var(--color-text-primary);
  border-radius:var(--radius-full);padding:9px 15px;font-size:var(--font-size-base);font-family:inherit;
  font-weight:var(--font-weight-medium);display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:transform var(--duration-fast) var(--ease-standard);
}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--color-accent);color:var(--color-on-accent);font-weight:var(--font-weight-semibold)}
.btn.line{background:transparent;border-color:var(--color-border-emphasized)}
.btn.blk{width:100%;padding:14px}
.chipbar{display:flex;gap:var(--spacing-2)}
.muted{color:var(--color-text-secondary)}
.tiny{font-size:var(--font-size-sm)}
.sec-t{
  font-size:var(--font-size-xs);color:var(--color-text-secondary);letter-spacing:.09em;
  margin:var(--spacing-6) 0 var(--spacing-3);text-transform:uppercase;font-weight:var(--font-weight-semibold);
}
.card{
  background:var(--color-background-card);border:var(--border-width) solid var(--color-border);
  border-radius:var(--radius-container);box-shadow:var(--shadow-low);
}

/* ---------- 首页 ---------- */
.panel{padding:var(--spacing-5)}
.dash{display:flex;align-items:center;gap:var(--spacing-5)}
.ring{flex:0 0 auto;position:relative;width:86px;height:86px}
.ring svg{transform:rotate(-90deg)}
.ring .track{stroke:var(--color-track)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:var(--font-size-xl);line-height:1;font-weight:var(--font-weight-semibold);letter-spacing:-.02em}
.ring .num span{font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-top:3px}
.stat{display:flex;flex-direction:column;gap:9px;flex:1}
.stat div{display:flex;align-items:baseline;gap:8px}
.stat div b{font-size:var(--font-size-xl);font-weight:var(--font-weight-semibold);width:34px;letter-spacing:-.02em}
.stat div span{font-size:var(--font-size-sm);color:var(--color-text-secondary)}
.stat div i{width:6px;height:6px;border-radius:var(--radius-full);flex:0 0 auto}

.chap{
  display:flex;align-items:center;gap:var(--spacing-3);padding:var(--spacing-3) var(--spacing-4);
  margin-bottom:var(--spacing-2);width:100%;text-align:left;color:inherit;font-family:inherit;
  font-size:var(--font-size-base);transition:transform var(--duration-fast) var(--ease-standard);
}
.chap:active{transform:scale(.985)}
/* 章节序号 = 元素砖 */
.chap .no{
  flex:0 0 auto;width:34px;height:34px;border-radius:var(--radius-inner);background:var(--color-accent);
  color:var(--color-on-accent);display:flex;align-items:center;justify-content:center;
  font-size:var(--font-size-base);font-weight:var(--font-weight-semibold)
}
.chap .bd{flex:1;min-width:0}
.chap .bd .t{font-weight:var(--font-weight-semibold);font-size:var(--font-size-base)}
.chap .bd .e{font-size:var(--font-size-xs);color:var(--color-text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.bar{height:4px;border-radius:var(--radius-full);background:var(--color-track);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--color-accent);border-radius:var(--radius-full)}
.chap .n{flex:0 0 auto;font-size:var(--font-size-sm);color:var(--color-text-secondary);font-variant-numeric:tabular-nums}

/* ---------- 科目切换 ---------- */
.bookbar{
  display:flex;gap:4px;padding:4px;margin-top:4px;
  background:var(--color-background-muted);border-radius:var(--radius-full);
}
.bookbar button{
  flex:1;border:0;background:none;font-family:inherit;color:var(--color-text-secondary);
  font-size:var(--font-size-base);font-weight:var(--font-weight-medium);
  padding:8px 0;border-radius:var(--radius-full);
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:background var(--duration-fast) var(--ease-standard);
}
.bookbar button.on{
  background:var(--color-background-card);color:var(--color-text-primary);
  font-weight:var(--font-weight-semibold);box-shadow:var(--shadow-low);
}
.bookbar .due{
  display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;
  padding:0 5px;border-radius:var(--radius-full);background:var(--color-error);
  color:#fff;font-size:var(--font-size-xs);font-weight:var(--font-weight-semibold);
  font-variant-numeric:tabular-nums;
}

/* ---------- 章节网格 ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--spacing-2)}
.gcard{
  padding:var(--spacing-3);text-align:left;color:inherit;font-family:inherit;
  display:flex;flex-direction:column;min-height:104px;overflow:hidden;
  transition:transform var(--duration-fast) var(--ease-standard);
}
.gcard:active{transform:scale(.97)}
.gcard .no{
  flex:0 0 auto;width:22px;height:22px;border-radius:var(--radius-inner);
  background:var(--color-accent);color:var(--color-on-accent);
  display:flex;align-items:center;justify-content:center;
  font-size:var(--font-size-sm);font-weight:var(--font-weight-semibold);
}
.gcard .t{
  font-weight:var(--font-weight-semibold);font-size:var(--font-size-base);
  line-height:1.25;margin-top:9px;
}
.gcard .e{
  font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.gcard .n{
  margin-top:auto;padding-top:6px;font-size:var(--font-size-sm);
  color:var(--color-text-secondary);font-variant-numeric:tabular-nums;
}
/* 细条不做满宽——满宽会在卡片圆角处切出方角 */
.gcard .bar{height:3px;margin-top:7px}

/* ---------- 学习卡 ---------- */
#study{position:fixed;inset:0;background:var(--color-background-body);z-index:50;display:none;flex-direction:column}
#study.on{display:flex}
.stbar{display:flex;align-items:center;gap:var(--spacing-3);padding:calc(var(--safe-t) + 14px) var(--spacing-5) var(--spacing-2)}
.stbar .pg{font-size:var(--font-size-sm);color:var(--color-text-secondary);font-variant-numeric:tabular-nums}
.stbar .prog{flex:1;height:4px;background:var(--color-track);border-radius:var(--radius-full);overflow:hidden}
.stbar .prog i{display:block;height:100%;background:var(--color-accent);border-radius:var(--radius-full);transition:width var(--duration-medium) var(--ease-standard)}
.iconbtn{background:none;border:0;color:var(--color-text-secondary);font-size:18px;padding:4px 6px;font-family:inherit;line-height:1}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.star-on svg{fill:var(--color-warning);stroke:var(--color-warning)}
.cardwrap{flex:1 1 auto;margin:var(--spacing-2) var(--spacing-4) 0;perspective:1600px;min-height:0}
.card3d{position:relative;width:100%;height:100%;transition:transform var(--duration-medium) var(--ease-standard);transform-style:preserve-3d}
.card3d.flip{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--color-background-card);border:var(--border-width) solid var(--color-border);
  border-radius:var(--radius-page);box-shadow:var(--shadow-high);
  padding:var(--spacing-6) var(--spacing-5);overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;
}
.face.back{transform:rotateY(180deg)}
.tag{
  font-size:var(--font-size-xs);color:var(--color-text-secondary);letter-spacing:.04em;flex:0 0 auto;
  display:flex;align-items:center;gap:7px;
}
.tag .sn{
  display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;
  border-radius:var(--radius-inner);background:var(--color-accent-muted);color:var(--color-text-primary);
  font-weight:var(--font-weight-semibold);font-size:var(--font-size-xs);
}
.mid{margin:auto 0;flex:0 0 auto}
.word{
  font-size:var(--font-size-5xl);font-weight:var(--font-weight-semibold);letter-spacing:-.03em;
  margin-top:var(--spacing-5);word-break:break-word;line-height:1.08;
}
.word.long{font-size:var(--font-size-2xl);letter-spacing:-.02em}
.ipa{font-size:var(--font-size-lg);color:var(--color-text-secondary);margin-top:9px;letter-spacing:.01em}
.spk{display:flex;gap:var(--spacing-2);margin-top:var(--spacing-5);flex-wrap:wrap}
.spk .btn{padding:8px 13px;font-size:var(--font-size-sm)}
.syl-h{
  font-size:var(--font-size-xs);color:var(--color-text-secondary);margin:var(--spacing-6) 0 var(--spacing-3);
  display:flex;align-items:center;gap:var(--spacing-2);letter-spacing:.06em;font-weight:var(--font-weight-medium);
}
.syl-h::after{content:"";flex:1;height:var(--border-width);background:var(--color-border-emphasized);opacity:.6}

/* 音节 = 标本砖（元素周期表式） */
.syls{display:flex;flex-wrap:wrap;gap:var(--spacing-2);align-items:stretch}
.syl{
  position:relative;background:var(--color-background-card);border:var(--border-width) solid var(--color-border-emphasized);
  border-radius:var(--radius-element);padding:16px 11px 9px;min-width:58px;text-align:center;
  font-family:inherit;color:inherit;box-shadow:var(--shadow-low);
  transition:transform var(--duration-fast) var(--ease-standard),background var(--duration-fast) var(--ease-standard);
  animation:brick var(--duration-medium) var(--ease-standard) backwards;
}
@keyframes brick{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.syl .ix{position:absolute;top:5px;left:7px;font-size:9px;color:var(--color-text-disabled);font-variant-numeric:tabular-nums}
.syl .oc{position:absolute;top:5px;right:7px;font-size:9px;color:var(--color-text-disabled)}
.syl:active,.syl.hi{background:var(--color-accent-muted);border-color:var(--color-accent);transform:translateY(-2px)}
.syl .sp{font-size:var(--font-size-xl);font-weight:var(--font-weight-semibold);letter-spacing:.01em;line-height:1.15}
.syl .sp .v{color:var(--color-icon-red)}
.syl .sp .c{color:var(--color-brand)}
.syl .pp{font-size:var(--font-size-sm);color:var(--color-text-secondary);margin-top:3px}
.wsep{width:var(--border-width);background:var(--color-border-emphasized);margin:6px 3px;opacity:.5}

/* 倒切法 */
.cuts{display:flex;flex-wrap:wrap;align-items:center;gap:3px}
.cut{
  background:var(--color-background-muted);border:0;border-radius:var(--radius-inner);padding:6px 9px;
  font-size:var(--font-size-lg);font-weight:var(--font-weight-semibold);letter-spacing:.01em;font-family:inherit;color:inherit;
}
.cut:active{background:var(--color-accent-muted)}
.cut .v{color:var(--color-icon-red)}
.cut .c{color:var(--color-brand)}
.knife{
  display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:var(--radius-full);
  background:var(--color-accent);color:var(--color-on-accent);font-size:9px;font-weight:var(--font-weight-bold);
  font-variant-numeric:tabular-nums;
}
.cutsep{color:var(--color-text-disabled);padding:0 4px}
.cutnote{font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-top:10px;line-height:1.7}
.cutnote b{color:var(--color-success);font-weight:var(--font-weight-semibold)}
.cutnote i{color:var(--color-warning);font-style:normal;font-weight:var(--font-weight-semibold)}
.hint{margin-top:auto;padding-top:var(--spacing-5);font-size:var(--font-size-xs);color:var(--color-text-disabled);text-align:center}
.legend{display:inline-flex;align-items:center;gap:4px}
.legend s{width:7px;height:7px;border-radius:var(--radius-full);display:inline-block}

/* 卡背 */
.zh{font-size:var(--font-size-3xl);font-weight:var(--font-weight-semibold);margin-top:var(--spacing-3);line-height:1.3;letter-spacing:-.01em}
.blk2{
  background:var(--color-warning-muted);border-radius:var(--radius-container);
  padding:var(--spacing-4);margin-top:var(--spacing-5);
}
.blk2 .lb{
  font-size:var(--font-size-xs);color:var(--color-text-yellow);letter-spacing:.09em;margin-bottom:6px;
  text-transform:uppercase;font-weight:var(--font-weight-semibold);
}
.blk2 p{font-size:var(--font-size-base);line-height:1.75;color:var(--color-text-primary)}
.ex{background:var(--color-background-muted);border-radius:var(--radius-container);padding:var(--spacing-4);margin-top:var(--spacing-3)}
.ex .en{font-size:var(--font-size-lg);line-height:1.5;font-weight:var(--font-weight-medium)}
.ex .cn{font-size:var(--font-size-base);color:var(--color-text-secondary);margin-top:7px}
.ex .rowbtn{margin-top:var(--spacing-3);display:flex;gap:var(--spacing-2);flex-wrap:wrap}

/* ---------- 翻译思路：按句子成分上色 ---------- */
/* 与 .blk2（记忆法）、.ex（例句）同一套：色块填充、无描边、无阴影。
   用淡紫：与记忆法的琥珀是冷暖对置，色相拉得开；三块形成
   暖（记忆法）→ 中性（例句）→ 冷（翻译思路）的温度分段 */
.tr{
  background:var(--color-background-purple);border-radius:var(--radius-container);
  padding:var(--spacing-4);margin-top:var(--spacing-3);
}
.tr-hd{color:var(--color-text-purple)}
.tr-hd{
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:2px;
  font-size:var(--font-size-base);font-weight:var(--font-weight-semibold);
}
.tr .pat{
  display:inline-block;font-size:var(--font-size-xs);font-weight:var(--font-weight-semibold);
  background:var(--color-accent-muted);border-radius:var(--radius-full);padding:4px 11px;letter-spacing:.03em;
}
/* ① 顺句理解：左英右中，一行一块，靠竖线表示「一直往下滚」 */
.flow{margin-top:10px;border-left:2px solid var(--color-brand);padding-left:12px}
.fl{display:flex;align-items:baseline;gap:10px;padding:5px 0;flex-wrap:wrap}
.fl + .fl{border-top:var(--border-width) dashed var(--color-border-emphasized)}
.fl .fe{font-size:var(--font-size-lg);font-weight:var(--font-weight-semibold);flex:1;min-width:0}
.fl .fz{font-size:var(--font-size-base);flex:0 0 auto;margin-left:auto;text-align:right;font-weight:var(--font-weight-medium)}
/* 成分配色，限定在 .tr 内：.v/.c 等单字母类名在音节砖那边已占用 */
.tr .v{color:var(--color-text-blue)}
.tr .s{color:var(--color-text-green)}
.tr .h{color:var(--color-text-red)}
.tr .d{color:var(--color-text-yellow)}
.tr .a{color:var(--color-text-purple)}
.tr .c{color:var(--color-text-cyan)}
.tr .x{color:var(--color-text-primary)}
.tr-note{font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-top:8px;line-height:1.7}

/* ② 主干 */
.core{
  margin-top:10px;background:var(--color-background-green);
  border-radius:var(--radius-element);padding:11px 13px;
}
.core .ce,.core .cz{
  font-size:var(--font-size-lg);font-weight:var(--font-weight-semibold);color:var(--color-text-green);line-height:1.4;
}
.core .cz::before{content:"= ";opacity:.55}

/* ③ 修饰层级：缩进表示嵌套 */
.tree{margin-top:10px}
.tv{display:flex;align-items:baseline;gap:8px;padding:5px 0}
.tv.l1{padding-left:18px}
.tv.l2{padding-left:36px}
.tv.l3{padding-left:54px}
.tv .br{color:var(--color-text-disabled);font-size:var(--font-size-sm);margin-left:-13px}
.tv .te{font-size:var(--font-size-base);font-weight:var(--font-weight-semibold);border-radius:var(--radius-inner);padding:3px 8px}
.tv .te.h{background:var(--color-background-red);color:var(--color-text-red)}
.tv .te.d{background:var(--color-background-yellow);color:var(--color-text-yellow)}
.tv .tz{font-size:var(--font-size-sm);color:var(--color-text-secondary)}

/* 名词化 → 动词化 */
/* 容器已是紫底，名词化块改白底 + 紫左边条，才不会被吃掉 */
.nom{
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:10px;
  background:var(--color-background-card);border-left:3px solid var(--color-text-purple);
  border-radius:var(--radius-element);padding:10px 13px;
}
.nom b{font-size:var(--font-size-base);font-weight:var(--font-weight-semibold);color:var(--color-text-purple)}
.nom em{font-style:normal;font-size:var(--font-size-xs);color:var(--color-text-purple);opacity:.75;margin-left:auto}
.nom .ar{color:var(--color-text-purple);opacity:.6}
.tr-step{
  display:flex;align-items:center;gap:8px;margin:15px 0 9px;
  font-size:var(--font-size-xs);color:var(--color-text-secondary);font-weight:var(--font-weight-medium);
}
.tr-step::after{content:"";flex:1;height:var(--border-width);background:var(--color-border-emphasized);opacity:.55}
.zhline{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.zhline .zk{
  font-size:var(--font-size-lg);font-weight:var(--font-weight-semibold);
  border-radius:var(--radius-inner);padding:4px 9px;
}
.zhline .zk.v{background:var(--color-background-blue);color:var(--color-text-blue)}
.zhline .zk.s{background:var(--color-background-green);color:var(--color-text-green)}
.zhline .zk.h{background:var(--color-background-red);color:var(--color-text-red)}
.zhline .zk.d{background:var(--color-background-yellow);color:var(--color-text-yellow)}
/* 同理：状语药丸在紫底上改白底 */
.zhline .zk.a{background:var(--color-background-card);color:var(--color-text-purple)}
.zhline .zk.c{background:var(--color-background-cyan);color:var(--color-text-cyan)}
.zhline .zk.x{background:var(--color-accent-muted);color:var(--color-text-primary)}
.zhline .ar{color:var(--color-text-disabled);font-size:var(--font-size-sm)}
.tr-final{
  margin-top:11px;padding:11px 13px;background:var(--color-background-card);
  border:var(--border-width) solid var(--color-border-emphasized);border-radius:var(--radius-element);
  font-size:var(--font-size-lg);font-weight:var(--font-weight-semibold);
}
.tr-final .fw{
  font-weight:var(--font-weight-semibold);
  text-decoration:underline 2px;text-underline-offset:5px;text-decoration-skip-ink:none;
}
.tr-final .fw.x{text-decoration:none}
.tr-tip{font-size:var(--font-size-xs);color:var(--color-text-secondary);line-height:1.75;margin-top:10px}

/* 评分 */
.actwrap{flex:0 0 auto;padding:var(--spacing-3) var(--spacing-4) calc(var(--safe-b) + var(--spacing-3))}
.acts{display:flex;gap:var(--spacing-2)}
.acts button{
  flex:1;border:0;border-radius:var(--radius-full);padding:14px 0;font-size:var(--font-size-lg);
  font-family:inherit;font-weight:var(--font-weight-semibold);
  transition:transform var(--duration-fast) var(--ease-standard);
}
.acts button:active{transform:scale(.96)}
.acts .b0{background:var(--color-error-muted);color:var(--color-text-red)}
.acts .b1{background:var(--color-warning-muted);color:var(--color-text-yellow)}
.acts .b2{background:var(--color-success-muted);color:var(--color-text-green)}
.actcap{display:flex;gap:var(--spacing-2);margin-top:7px}
.actcap span{flex:1;text-align:center;font-size:var(--font-size-xs);color:var(--color-text-disabled)}

/* ---------- 词表 ---------- */
.search{
  width:100%;background:var(--color-background-card);border:var(--border-width) solid var(--color-border-emphasized);
  border-radius:var(--radius-full);padding:11px var(--spacing-4);color:var(--color-text-primary);
  font-size:var(--font-size-base);font-family:inherit;
}
.search::placeholder{color:var(--color-text-disabled)}
.search:focus{outline:none;border-color:var(--color-accent)}
.rowgrp{overflow:hidden;margin-bottom:var(--spacing-2)}
.row{
  display:flex;align-items:center;gap:var(--spacing-3);padding:12px var(--spacing-4);width:100%;
  text-align:left;color:inherit;font-family:inherit;
  border-bottom:var(--border-width) solid var(--color-border);
}
.row:last-child{border-bottom:0}
.row:active{background:var(--color-background-muted)}
.dot{flex:0 0 auto;width:7px;height:7px;border-radius:var(--radius-full);background:var(--color-track)}
.row .bd{flex:1;min-width:0}
.row .w{font-size:var(--font-size-lg);font-weight:var(--font-weight-semibold);letter-spacing:-.01em}
.row .p{font-size:var(--font-size-sm);color:var(--color-text-secondary);margin-left:5px}
.row .z{font-size:var(--font-size-sm);color:var(--color-text-secondary);margin-top:2px}
.row .z.hide{filter:blur(5px);opacity:.7}
.grp{
  font-size:var(--font-size-xs);color:var(--color-text-secondary);margin:var(--spacing-5) 0 var(--spacing-2);
  font-weight:var(--font-weight-semibold);letter-spacing:.06em;
}

/* ---------- 句型 ---------- */
.fr{padding:var(--spacing-4) var(--spacing-5);margin-bottom:var(--spacing-2)}
.fr .use{
  font-size:var(--font-size-xs);color:var(--color-text-blue);letter-spacing:.06em;font-weight:var(--font-weight-semibold);
  background:var(--color-background-blue);border-radius:var(--radius-full);padding:3px 9px;display:inline-block;
}
.fr .fm{font-size:var(--font-size-xl);font-weight:var(--font-weight-semibold);margin-top:10px;line-height:1.35;letter-spacing:-.01em}
.fr .en{font-size:var(--font-size-base);color:var(--color-text-secondary);margin-top:9px;line-height:1.6}
.fr .cn{font-size:var(--font-size-sm);color:var(--color-text-disabled);margin-top:4px}

/* ---------- 课前预习 ---------- */
.lhero{padding:var(--spacing-5);margin-top:var(--spacing-3)}
.ltag{
  display:inline-block;font-size:var(--font-size-xs);font-weight:var(--font-weight-semibold);
  background:var(--color-accent);color:var(--color-on-accent);
  border-radius:var(--radius-full);padding:4px 11px;letter-spacing:.03em;
}
.ltitle{font-size:var(--font-size-2xl);font-weight:var(--font-weight-semibold);letter-spacing:-.02em;margin-top:11px;line-height:1.3}
.lsub{font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-top:6px}
.lintro{
  margin-top:var(--spacing-4);padding-top:var(--spacing-3);
  border-top:var(--border-width) solid var(--color-border);
  font-size:var(--font-size-sm);color:var(--color-text-secondary);line-height:1.8;
}
.lcard .no{background:var(--color-brand)}
/* 勾选行 */
.chkrow{
  display:flex;align-items:flex-start;gap:11px;padding:13px var(--spacing-4);
  border-bottom:var(--border-width) solid var(--color-border);
  font-size:var(--font-size-base);line-height:1.55;
}
.chkrow:last-child{border-bottom:0}
.chkrow:active{background:var(--color-background-muted)}
.tick{
  flex:0 0 auto;width:21px;height:21px;border-radius:var(--radius-inner);margin-top:1px;
  border:1.8px solid var(--color-border-emphasized);
  display:flex;align-items:center;justify-content:center;
  transition:background var(--duration-fast) var(--ease-standard),border-color var(--duration-fast) var(--ease-standard);
}
.tick svg{width:14px;height:14px;stroke:var(--color-on-accent);fill:none;stroke-width:2.6;
  stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity var(--duration-fast) var(--ease-standard)}
.tick.on{background:var(--color-accent);border-color:var(--color-accent)}
.tick.on svg{opacity:1}
/* 阅读材料 */
.read{padding:var(--spacing-4) var(--spacing-5);margin-bottom:var(--spacing-2)}
.rt{display:flex;align-items:center;gap:9px;font-size:var(--font-size-lg);font-weight:var(--font-weight-semibold);letter-spacing:-.01em}
.rn{
  flex:0 0 auto;width:22px;height:22px;border-radius:var(--radius-full);
  background:var(--color-accent-muted);color:var(--color-text-primary);
  display:flex;align-items:center;justify-content:center;font-size:var(--font-size-xs);font-weight:var(--font-weight-bold);
}
.read p{font-size:var(--font-size-base);line-height:1.9;color:var(--color-text-primary);margin-top:10px}
.read p + p{margin-top:7px}
/* 阅读块展开后的中英对照 */
.read{transition:background var(--duration-fast) var(--ease-standard)}
.rmore{
  margin-left:auto;font-size:var(--font-size-xs);font-weight:var(--font-weight-medium);
  color:var(--color-text-secondary);background:var(--color-accent-muted);
  border-radius:var(--radius-full);padding:3px 9px;flex:0 0 auto;
}
.read.on .rmore{background:var(--color-accent);color:var(--color-on-accent)}
.ranly{display:none;margin-top:var(--spacing-3);padding-top:var(--spacing-3);
  border-top:var(--border-width) solid var(--color-border-emphasized)}
.read.on .ranly{display:block}
.rs + .rs{margin-top:var(--spacing-4);padding-top:var(--spacing-4);
  border-top:var(--border-width) dashed var(--color-border-emphasized)}
.rs-en{
  font-size:var(--font-size-lg);font-weight:var(--font-weight-semibold);line-height:1.5;
  color:var(--color-text-primary);
}
.rs-btns{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.rs-btns .btn{padding:6px 11px;background:var(--color-background-muted)}
.rslow{margin-bottom:var(--spacing-4)}
/* 整段慢读时高亮当前句 */
.rs{border-radius:var(--radius-element);transition:background var(--duration-fast) var(--ease-standard)}
.rs.hi{background:var(--color-background-blue);box-shadow:0 0 0 8px var(--color-background-blue)}
.rs-parts{margin-top:10px}
/* 中英上下排：中文块可能很长，横排会把英文挤成一字一行 */
.pr{padding:6px 0}
.pr + .pr{border-top:var(--border-width) solid var(--color-border)}
.pz{display:block;font-size:var(--font-size-sm);color:var(--color-text-secondary);line-height:1.6}
.pe{
  display:block;position:relative;padding-left:17px;margin-top:3px;
  font-size:var(--font-size-base);font-weight:var(--font-weight-semibold);line-height:1.5;
}
.pe::before{content:"→";position:absolute;left:0;top:0;color:var(--color-text-disabled);font-weight:400}
.pe.v{color:var(--color-text-blue)}
.pe.s{color:var(--color-text-green)}
.pe.h{color:var(--color-text-red)}
.pe.d{color:var(--color-text-yellow)}
.pe.a{color:var(--color-text-purple)}
.pe.c{color:var(--color-text-cyan)}
.pe.x{color:var(--color-text-primary)}
.rs-note{
  font-size:var(--font-size-xs);color:var(--color-text-secondary);line-height:1.75;
  margin-top:9px;background:var(--color-background-muted);
  border-radius:var(--radius-inner);padding:9px 11px;
}
.term{
  background:var(--color-background-blue);color:var(--color-text-blue);border:0;
  border-radius:var(--radius-inner);padding:1px 6px;font-family:inherit;
  font-size:var(--font-size-base);font-weight:var(--font-weight-semibold);
}
.term:active{background:var(--color-accent-muted)}

/* ---------- 设置 ---------- */
.setgrp{overflow:hidden;margin-bottom:var(--spacing-2)}
.set{
  display:flex;align-items:center;gap:var(--spacing-3);padding:14px var(--spacing-4);
  border-bottom:var(--border-width) solid var(--color-border);
}
.set:last-child{border-bottom:0}
.set .lb{flex:1;font-size:var(--font-size-base);font-weight:var(--font-weight-medium)}
.set .lb small{display:block;color:var(--color-text-secondary);font-size:var(--font-size-xs);margin-top:2px;font-weight:400}
select{
  background:var(--color-background-muted);color:var(--color-text-primary);border:0;border-radius:var(--radius-full);
  padding:8px 11px;font-size:var(--font-size-sm);max-width:54%;font-family:inherit;font-weight:var(--font-weight-medium);
}
input[type=range]{width:118px;accent-color:var(--color-accent);font-family:inherit}
.sw{width:46px;height:27px;border-radius:var(--radius-full);background:var(--color-track);position:relative;flex:0 0 auto;border:0;transition:background var(--duration-fast) var(--ease-standard)}
.sw i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:var(--radius-full);background:#fff;transition:left var(--duration-fast) var(--ease-standard);box-shadow:var(--shadow-low)}
.sw.on{background:var(--color-accent)}
.sw.on i{left:22px}
.lvrow{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.lvrow em{font-style:normal;font-size:var(--font-size-xs);color:var(--color-text-secondary);width:34px}
.lvrow u{text-decoration:none;font-size:var(--font-size-xs);color:var(--color-text-secondary);width:24px;text-align:right;font-variant-numeric:tabular-nums}

.toast{
  position:fixed;left:50%;bottom:calc(var(--safe-b) + 86px);transform:translateX(-50%) translateY(6px);
  background:var(--color-background-inverted);color:var(--color-background-body);padding:10px 18px;
  border-radius:var(--radius-full);font-size:var(--font-size-base);font-weight:var(--font-weight-medium);z-index:99;
  opacity:0;pointer-events:none;transition:opacity var(--duration-fast) var(--ease-standard),transform var(--duration-fast) var(--ease-standard);
  box-shadow:var(--shadow-high);
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--color-text-disabled);font-size:var(--font-size-base);padding:48px 0}
.credit{text-align:center;margin:var(--spacing-5) 0 var(--spacing-2);font-size:var(--font-size-xs);color:var(--color-text-disabled)}
</style>
</head>

<script>

define","tr":{"pat":"祈使句 + 同位语","flow":[["Define","给……下定义","v"],["the term","这个术语","h"],["diffusion","就是「扩散」","h"]],"core":["Define the term","给术语下定义"],"final":[["给","v"],["“扩散”","h"],["下定义","v"],["。",""]],"tip":"the term 和 diffusion 是同位语，指同一个东西，别译成「术语的扩散」，要译成「『扩散』这个术语」。"}},{"w":"describe","zh":"描述现象、变化或趋势","ex":"Describe how the temperature changes.","exzh":"描述温度如何变化。","ipa":"/dɪˈskraɪb/","syl":[[{"t":"de","p":"dɪ"},{"t":"scribe","p":"ˈskraɪb"}]],"tip":"de-（往下）+ scribe（写，同 script 剧本）→ 写下所见 = 描述。","id":"sci:describe","tr":{"pat":"祈使句 + how 宾语从句","flow":[["Describe","描述","v"],["how the temperature changes","温度是怎么变的","c"]],"core":["Describe how…","描述……如何"],"final":[["描述","v"],["温度如何变化","c"],["。",""]],"tip":"how 引导的整个从句作 Describe 的宾语。从句内部是「主语 + 谓语」的正常语序，顺译即可。"}},{"w":"explain","zh":"解释原因","ex":"Explain why the gas can be compressed.","exzh":"解释气体为什么可以被压缩。","ipa":"/ɪksˈpleɪn/","syl":[[{"t":"ex","p":"ɪks"},{"t":"plain","p":"ˈpleɪn"}]],"tip":"ex-（向外）+ plain（平坦）→ 把道理「摊平」讲出来 = 解释。","id":"sci:explain","tr":{"pat":"祈使句 + why 宾语从句（含被动）","flow":[["Explain","解释","v"],["why the gas can be compressed","气体为什么能被压缩","c"]],"core":["Explain why…","解释为什么……"],"final":[["解释","v"],["气体为什么可以被压缩","c"],["。",""]],"tip":"explain 要答原因。从句里 can be compressed 是被动，这里中文保留「被」读着自然。"}},{"w":"compare","zh":"比较异同","ex":"Compare the arrangement of particles in solids and liquids.","exzh":"比较固体和液体中粒子的排列。","ipa":"/kəmˈpeə/","syl":[[{"t":"com","p":"kəm"},{"t":"pare","p":"ˈpeə"}]],"tip":"com-（共同）+ par（相等，同 pair 一对）→ 放在一起看异同。","id":"sci:compare","tr":{"pat":"祈使句 + 两层后置定语","flow":[["Compare","比较","v"],["the arrangement","排列方式","h"],["of particles","粒子的","d"],["in solids and liquids","在固体和液体里","d"]],"core":["Compare the arrangement","比较排列"],"tree":[[0,"the arrangement","排列"],[1,"of particles","粒子的"],[2,"in solids and liquids","固体和液体中"]],"asm":[["固体和液体中","d"],["粒子的","d"],["排列","h"]],"final":[["比较","v"],["固体和液体中","d"],["粒子的","d"],["排列","h"],["。",""]],"tip":"两层定语套在一起：in… 修饰 particles，of particles 又修饰 arrangement。中文从 近的越靠后说。"}},{"w":"molecule","zh":"分子","ex":"A water molecule contains two hydrogen atoms and one oxygen atom.","exzh":"一个水分子含两个氢原子和一个氧原子。","ipa":"/ˈmɒlɪkjuːl/","syl":[[{"t":"mo","p":"ˈmɒ"},{"t":"le","p":"lɪ"},{"t":"cule","p":"kjuːl"}]],"tip":"moles（一团）+ -cule（小）→ 一小团原子 = 分子。","id":"sci:molecule","tr":{"pat":"主谓宾 + 并列宾语","flow":[["A water molecule","一个水分子","s"],["contains","含有","v"],["two hydrogen atoms","两个氢原子","h"],["and one oxygen atom","和一个氧原子","h"]],"core":["A molecule contains atoms","分子含有原子"],"final":[["一个水分子","s"],["含","v"],["两个氢原子和一个氧原子","h"],["。",""]],"tip":"and 连接两个并列宾语。英语可数名词要加 s（atoms），中文没有这个变化，别漏读。"}},{"w":"ion","zh":"离子；带电粒子","ex":"A sodium ion has a positive charge.","exzh":"钠离子带正电。","ipa":"/ˈaɪən/","syl":[[{"t":"i","p":"ˈaɪ"},{"t":"on","p":"ən"}]],"tip":"希腊语「走的东西」→ 带电、会向电极跑的粒子 = 离子。","id":"sci:ion","tr":{"pat":"主谓宾（have 结构）","flow":[["A sodium ion","钠离子","s"],["has","带有","v"],["a positive charge","一个正电荷","h"]],"core":["An ion has a charge","离子带电荷"],"final":[["钠离子","s"],["带","v"],["正电","h"],["。",""]],"tip":"have a charge = 带电。中文常省略量词直接说「带正电」，不必逐字译成「带有一个正电荷」。"}},{"w":"element","zh":"元素","ex":"Oxygen is an element because it contains only oxygen atoms.","exzh":"氧气是元素，因为它只含氧原子。","ipa":"/ˈelɪmənt/","syl":[[{"t":"e","p":"ˈe"},{"t":"le","p":"lɪ"},{"t":"ment","p":"mənt"}]],"tip":"只含一种原子的纯净物 = 元素／单质；周期表上的每一格。","id":"sci:element","tr":{"pat":"判断句 + because 原因从句","flow":[["Oxygen","氧气","s"],["is an element","是元素","v"],["because it contains only oxygen atoms","因为它只含氧原子","c"]],"core":["Oxygen is an element","氧气是元素"],"final":[["氧气","s"],["是元素","v"],["，",""],["因为它只含氧原子","c"],["。",""]],"tip":"only 的位置很关键：only oxygen atoms = 只含氧原子（没有别的）。语序与中文一致。"}},{"w":"compound","zh":"化合物","ex":"Water is a compound of hydrogen and oxygen.","exzh":"水是由氢和氧组成的化合物。","ipa":"/ˈkɒmpaʊnd/","syl":[[{"t":"com","p":"ˈkɒm"},{"t":"pound","p":"paʊnd"}]],"tip":"com-（一起）+ pound（放）→ 不同元素化学结合 = 化合物（能写化学式）。","id":"sci:compound","tr":{"pat":"判断句 + of 后置定语","flow":[["Water","水","s"],["is a compound","是一种化合物","v"],["of hydrogen and oxygen","由氢和氧组成的","d"]],"core":["Water is a compound","水是化合物"],"tree":[[0,"a compound","化合物"],[1,"of hydrogen and oxygen","由氢和氧组成的"]],"asm":[["由氢和氧组成的","d"],["化合物","h"]],"final":[["水","s"],["是","v"],["由氢和氧组成的","d"],["化合物","h"],["。",""]],"tip":"a compound of A and B 里的 of 表「由……构成」，译成「由 A 和 B 组成的」，整块前移。"}},{"w":"mixture","zh":"混合物","ex":"Air is a mixture of several gases.","exzh":"空气是多种气体的混合物。","ipa":"/ˈmɪkstʃə/","syl":[[{"t":"mix","p":"ˈmɪks"},{"t":"ture","p":"tʃə"}]],"tip":"mix + -ture → 混合物：只是混在一起，可用物理方法分开。","id":"sci:mixture","tr":{"pat":"判断句 + of 后置定语","flow":[["Air","空气","s"],["is a mixture","是一种混合物","v"],["of several gases","由好几种气体混成的","d"]],"core":["Air is a mixture","空气是混合物"],"tree":[[0,"a mixture","混合物"],[1,"of several gases","多种气体的"]],"asm":[["多种气体的","d"],["混合物","h"]],"final":[["空气","s"],["是","v"],["多种气体的","d"],["混合物","h"],["。",""]],"tip":"和 compound 那句结构相同，但含义相反：mixture 是物理混合，compound 是化学结合。成对记。"}},{"w":"pure substance","zh":"纯净物","ex":"A pure substance has a fixed composition.","exzh":"纯净物具有固定的组成。","ipa":"/pjʊə ˈsʌbstəns/","syl":[[{"t":"pure","p":"pjʊə"}],[{"t":"sub","p":"ˈsʌb"},{"t":"stance","p":"stəns"}]],"tip":"纯净物：只有一种物质，熔沸点是一个固定值（不是范围）。","id":"sci:pure substance","tr":{"pat":"主谓宾（have 结构）","flow":[["A pure substance","纯净物","s"],["has","具有","v"],["a fixed composition","固定的组成","h"]],"core":["A substance has a composition","物质有组成"],"final":[["纯净物","s"],["具有","v"],["固定的组成","h"],["。",""]],"tip":"fixed 是过去分词作前置定语，在名词前面就不用移位了——只有放在名词后面才需要前移。"}},{"w":"solid","zh":"固体","ex":"A solid has a fixed shape and a fixed volume.","exzh":"固体具有固定形状和固定体积。","ipa":"/ˈsɒlɪd/","syl":[[{"t":"so","p":"ˈsɒ"},{"t":"lid","p":"lɪd"}]],"tip":"固体：粒子排列紧密规则、只在固定位置振动。","id":"sci:solid","tr":{"pat":"主谓宾 + 并列宾语","flow":[["A solid","固体","s"],["has","具有","v"],["a fixed shape","固定的形状","h"],["and a fixed volume","和固定的体积","h"]],"core":["A solid has a shape and a volume","固体有形状和体积"],"final":[["固体","s"],["具有","v"],["固定形状和固定体积","h"],["。",""]],"tip":"注意 fixed 重复出现了两次，英语不省，中文也照译两遍，强调两个性质都固定。"}},{"w":"liquid","zh":"液体","ex":"A liquid has a fixed volume but no fixed shape.","exzh":"液体有固定体积，但没有固定形状。","ipa":"/ˈlɪkwɪd/","syl":[[{"t":"li","p":"ˈlɪ"},{"t":"quid","p":"kwɪd"}]],"tip":"液体：粒子仍紧挨但可滑动 → 有固定体积、无固定形状。","id":"sci:liquid","tr":{"pat":"主谓宾 + but 转折","flow":[["A liquid","液体","s"],["has a fixed volume","有固定体积","v"],["but no fixed shape","但没有固定形状","v"]],"core":["A liquid has volume but no shape","液体有体积但无形状"],"final":[["液体","s"],["有固定体积","v"],["，但",""],["没有固定形状","v"],["。",""]],"tip":"but no… 是省略说法，完整是 but it has no fixed shape。这种「有 A 但没有 B」是三态对比的固定句式。"}},{"w":"gas","zh":"气体","ex":"A gas fills the whole container.","exzh":"气体会充满整个容器。","ipa":"/ɡæs/","syl":[[{"t":"gas","p":"ɡæs"}]],"tip":"气体：粒子相距很远、随机快速运动 → 可被压缩。","id":"sci:gas","tr":{"pat":"主谓宾（最简）","flow":[["A gas","气体","s"],["fills","充满","v"],["the whole container","整个容器","h"]],"core":["A gas fills the container","气体充满容器"],"final":[["气体","s"],["会充满","v"],["整个容器","h"],["。",""]],"tip":"一般现在时表示普遍规律，中文可以补一个「会」字来体现这种必然性。"}},{"w":"state of matter","zh":"物质状态","ex":"Solid, liquid and gas are states of matter.","exzh":"固体、液体和气体是物质的三种状态。","ipa":"/steɪt əv ˈmætə/","syl":[[{"t":"state","p":"steɪt"}],[{"t":"of","p":"əv"}],[{"t":"mat","p":"ˈmæ"},{"t":"ter","p":"tə"}]],"tip":"物态：固、液、气三态；变化只改排列和运动，不改粒子本身。","id":"sci:state of matter","tr":{"pat":"并列主语 + 判断句","flow":[["Solid, liquid and gas","固体、液体和气体","s"],["are","是","v"],["states of matter","物质的状态","h"]],"core":["Solid, liquid and gas are states","固液气是状态"],"asm":[["物质的","d"],["三种状态","h"]],"final":[["固体、液体和气体","s"],["是","v"],["物质的","d"],["三种状态","h"],["。",""]],"tip":"三个并列主语，谓语用复数 are。states 是复数，中文补出「三种」把这个信息说清楚。"}},{"w":"arrangement","zh":"排列方式","ex":"The particles in a solid have a regular arrangement.","exzh":"固体中的粒子排列规则。","ipa":"/əˈreɪndʒmənt/","syl":[[{"t":"ar","p":"ə"},{"t":"range","p":"ˈreɪndʒ"},{"t":"ment","p":"mənt"}]],"tip":"arrange（排列）+ -ment → 粒子的排列方式，答粒子模型题的关键词。","id":"sci:arrangement","tr":{"pat":"主语带 in 定语 + 主谓宾","flow":[["The particles","粒子","s"],["in a solid","固体里的","d"],["have","具有","v"],["a regular arrangement","规则的排列","h"]],"core":["The particles have an arrangement","粒子有排列"],"asm":[["固体中的","d"],["粒子","s"]],"final":[["固体中的","d"],["粒子","s"],["排列规则","v"],["。",""]],"tip":"in a solid 是主语的后置定语，中文前移成「固体中的粒子」。英语用「have + 名词」，中文直接说成「排列规则」这个主谓结构更顺。"}},{"w":"motion","zh":"运动","ex":"Gas particles are in rapid random motion.","exzh":"气体粒子做快速的随机运动。","ipa":"/ˈməʊʃn/","syl":[[{"t":"mo","p":"ˈməʊ"},{"t":"tion","p":"ʃn"}]],"tip":"mot（动，同 motor 马达）→ 运动；粒子永不停息地运动。","id":"sci:motion","tr":{"pat":"系表结构（be in + 名词）","flow":[["Gas particles","气体粒子","s"],["are in","处于……状态","v"],["rapid random motion","快速随机的运动","h"]],"core":["Particles are in motion","粒子处于运动状态"],"shift":["are in rapid random motion","做快速的随机运动","英语名词 motion → 中文动词「做……运动」"],"final":[["气体粒子","s"],["做","v"],["快速的随机运动","h"],["。",""]],"tip":"be in motion 字面是「处于运动中」，中文说「做运动」更自然——又一处名词化还原成动词。"}},{"w":"fixed position","zh":"固定位置","ex":"Particles in a solid vibrate about fixed positions.","exzh":"固体中的粒子在固定位置附近振动。","ipa":"/fɪkst pəˈzɪʃn/","syl":[[{"t":"fixed","p":"fɪkst"}],[{"t":"po","p":"pə"},{"t":"si","p":"ˈzɪ"},{"t":"tion","p":"ʃn"}]],"tip":"固定位置：固体粒子只能在原地振动，不能换位。","id":"sci:fixed position","tr":{"pat":"主语带 in 定语 + about 状语","flow":[["Particles","粒子","s"],["in a solid","固体里的","d"],["vibrate","振动","v"],["about fixed positions","绕着固定位置","a"]],"core":["Particles vibrate","粒子振动"],"asm":[["固体中的","d"],["粒子","s"],["在固定位置附近","a"],["振动","v"]],"final":[["固体中的","d"],["粒子","s"],["在固定位置附近","a"],["振动","v"],["。",""]],"tip":"about 在这里不是「关于」，是「围绕、在……附近」。这是固体粒子模型的标准表述。"}},{"w":"compress","zh":"压缩","ex":"A gas is easier to compress than a liquid.","exzh":"气体比液体更容易被压缩。","ipa":"/kəmˈpres/","syl":[[{"t":"com","p":"kəm"},{"t":"press","p":"ˈpres"}]],"tip":"com-（一起）+ press（压）→ 压到一起 = 压缩；只有气体易压缩。","id":"sci:compress","tr":{"pat":"形容词比较级 + 不定式","flow":[["A gas","气体","s"],["is easier to compress","更容易被压缩","v"],["than a liquid","比液体","a"]],"core":["A gas is easier to compress","气体更容易压缩"], ɪs"},{"t":"persed","p":"ˈspɜːst"}]],"tip":"dis-（散开）+ sperse（撒，同 sprinkle）→ 颗粒撒开分布 = 分散的。","tr":{"pat":"被动结构 + in 介词短语","flow":[["The ink","墨水","s"],["is dispersed","被分散","v"],["in the water","在水中","a"]],"core":["The ink is dispersed","墨水被分散"],"final":[["墨水","s"],["在水中","a"],["散开","v"],["。",""]],"tip":"dispersed = 分散的、散开的。被动语态 is dispersed 中文说成「散开」更自然。"}},{"w":"specified","zh":"指定的；规定的","ex":"Dissolve the salt in the specified volume of water.","exzh":"把盐溶解在规定体积的水中。","id":"sci:specified","ipa":"/ˈspesɪfaɪd/","syl":[[{"t":"spec","p":"ˈspe"},{"t":"i","p":"sɪ"},{"t":"fied","p":"faɪd"}]],"tip":"spec（看，同 inspect）+ -ify（使…）→ 使它被看得清清楚楚 = 明确指定的。","tr":{"pat":"祈使句 + of 后置定语","flow":[["Dissolve","溶解","v"],["the salt","盐","h"],["in the specified volume","在规定体积里","a"],["of water","水的","d"]],"core":["Dissolve the salt","溶解盐"],"tree":[[0,"the specified volume","规定体积"],[1,"of water","水的"]],"asm":[["把盐","h"],["溶解","v"],["在","v"],["规定体积","d"],["的水中","a"]],"final":[["把盐","h"],["溶解","v"],["在","v"],["规定体积","d"],["的水中","a"],["。",""]],"tip":"specified = 明确指定的。祈使句开头的动作，中文用「把」字句读起来更顺。"}},{"w":"maximum","zh":"最大的；最大值","ex":"The maximum amount of solute that can dissolve increases with temperature.","exzh":"能溶解的溶质最大量随温度升高而增大。","id":"sci:maximum","ipa":"/ˈmæksɪməm/","syl":[[{"t":"max","p":"ˈmæk"},{"t":"i","p":"sɪ"},{"t":"mum","p":"məm"}]],"tip":"max（最大，同 max）→ 最大值；和 minimum（最小）成对记。","tr":{"pat":"主谓 + 定语从句 + with 状语","flow":[["The maximum amount","最大量","s"],["of solute","溶质的","d"],["that can dissolve","能溶解的","d"],["increases","增大","v"],["with temperature","随温度","a"]],"core":["The maximum amount increases","最大量增大"],"tree":[[0,"The maximum amount","最大量"],[1,"of solute","溶质的"],[2,"that can dissolve","能溶解的"]],"asm":[["能溶解的","d"],["溶质","h"],["最大量","h"],["随温度升高","a"],["而增大","v"]],"final":[["能溶解的","d"],["溶质","h"],["最大量","h"],["随温度升高","a"],["而增大","v"],["。",""]],"tip":"that 从句修饰 amount，中文整块前移。大多数固体溶质的溶解量随温度升高而增大。"}}]},{"id":6,"cn":"实验器材、操作与安全","en":"Laboratory Equipment, Actions and Safety","words":[{"w "pɔː"}]],"tip":"倾倒；our 在这里读 /ɔː/，不读 /aʊə/。","id":"sci:pour","tr":{"pat":"祈使句 + 方式状语 + 不定式目的","flow":[["Pour","倾倒","v"],["the liquid","液体","h"],["carefully","要小心","a"],["to avoid spilling it","以免洒出来","a"]],"core":["Pour the liquid","倾倒液体"],"asm":[["小心","a"],["倾倒","v"],["液体","h"],["避免洒出","a"]],"final":[["小心","a"],["倾倒","v"],["液体","h"],["，",""],["避免洒出","a"],["。",""]],"tip":"to avoid + 动名词 表目的，中文用「以免、避免」对应，放句末即可，这一处不用前移。"}},{"w":"collect","zh":"收集","ex":"Collect the gas over water.","exzh":"用排水法收集气体。","ipa":"/kəˈlekt/","syl":[[{"t":"col","p":"kə"},{"t":"lect","p":"ˈlekt"}]],"tip":"col-（一起）+ lect（选取，同 select）→ 收集；collect over water 排水法。","id":"sci:collect","tr":{"pat":"祈使句 + over 方式状语","flow":[["Collect","收集","v"],["the gas","气体","h"],["over water","在水面上","a"]],"core":["Collect the gas","收集气体"],"asm":[["用排水法","a"],["收集","v"],["气体","h"]],"final":[["用排水法","a"],["收集","v"],["气体","h"],["。",""]],"tip":"collect over water 是行话，指「排水集气法」，不能直译成「在水上收集」。遇到固定实验术语要按中文习惯说法译。"}},{"w":"filter","zh":"过滤","ex":"Filter the mixture to remove the sand.","exzh":"过滤混合物以除去沙子。","ipa":"/ˈfɪltə/","syl":[[{"t":"fil","p":"ˈfɪl"},{"t":"ter","p":"tə"}]],"tip":"过滤，把不溶的固体分离出来。","id":"sci:filter","tr":{"pat":"祈使句 + 不定式目的状语","flow":[["Filter","过滤","v"],["the mixture","混合物","h"],["to remove the sand","为了除掉沙子","a"]],"core":["Filter the mixture","过滤混合物"],"final":[["过滤","v"],["混合物","h"],["以",""],["除去沙子","a"],["。",""]],"tip":"不定式表目的，中文用「以、来」引出，放句末，语序与英语一致，不用调。"}},{"w":"evaporate","zh":"蒸发","ex":"Evaporate some of the water from the solution.","exzh":"蒸发掉溶液中的一部分水。","ipa":"/ɪˈvæpəreɪt/","syl":[[{"t":"e","p":"ɪ"},{"t":"va","p":"ˈvæ"},{"t":"po","p":"pə"},{"t":"rate","p":"reɪt"}]],"tip":"蒸发（动词），名词是 evaporation。","id":"sci:evaporate","tr":{"pat":"祈使句 + some of 部分表达 + from 状语","flow":[["Evaporate","蒸发掉","v"],["some of the water","一部分水","h"],["from the solution","从溶液里","a"]],"core":["Evaporate some water","蒸发掉一些水"],"asm":[["蒸发掉","v"],["溶液中的","a"],["一部分水","h"]],"final":[["蒸发掉","v"],["溶液中的","a"],["一部分水","h"],["。",""]],"tip":"some of the… = ……中的一部分。注意是蒸掉「一部分」不是全部，全蒸干就得不到晶体了。"}},{"w":"crystallise","zh":"使结晶","ex":"Allow the concentrated solution to cool and crystallise.","exzh":"让浓溶液冷却并结晶。","ipa":"/ˈkrɪstəlaɪz/","syl":[[{"t":"crys","p":"ˈkrɪs"},{"t":"tal","p":"tə"},{"t":"lise","p":"laɪz"}]],"tip":"crystal（晶体）+ -ise（使…）→ 结晶；先蒸浓再冷却。","id":"sci:crystallise","tr":{"pat":"allow…to do + 并列不定式","flow":[["Allow","让","v"],["the concentrated solution","浓溶液","h"],["to cool and crystallise","冷却并结晶","a"]],"core":["Allow the solution to cool","让溶液冷却"],"final":[["让","v"],["浓溶液","h"],["冷却并结晶","a"],["。",""]],"tip":"allow A to do B = 让 A 去做 B。and 连接两个并列不定式，共用前面的 to。"}},{"w":"distil","zh":"蒸馏","ex":"Distil the solution to collect pure water.","exzh":"蒸馏该溶液以收集纯水。","ipa":"/dɪˈstɪl/","syl":[[{"t":"di","p":"dɪ"},{"t":"stil","p":"ˈstɪl"}]],"tip":"dis-（分开）+ stil（滴落）→ 一滴滴分出来 = 蒸馏，得到纯水。","id":"sci:distil","tr":{"pat":"祈使句 + 不定式目的状语","flow":[["Distil","蒸馏","v"],["the solution","该溶液","h"],["to collect pure water","来收集纯水","a"]],"core":["Distil the solution","蒸馏溶液"],"final":[["蒸馏","v"],["该溶液","h"],["以",""],["收集纯水","a"],["。",""]],"tip":"蒸馏能得到纯溶剂，过滤只能除去不溶物——两种分离方法的目的不同，别混。"}},{"w":"dilute","zh":"稀释；稀的","ex":"Dilute the acid with water before use.","exzh":"使用前用水稀释该酸。","ipa":"/daɪˈluːt/","syl":[[{"t":"di","p":"daɪ"},{"t":"lute","p":"ˈluːt"}]],"tip":"di-（分开）+ lut（冲洗）→ 冲淡 = 稀释；反义 concentrated。","id":"sci:dilute","tr":{"pat":"祈使句 + with 工具 + before 时间状语","flow":[["Dilute","稀释","v"],["the acid","这个酸","h"],["with water","用水","a"],["before use","在使用之前","a"]],"core":["Dilute the acid","稀释酸"],"asm":[["使用前","a"],["用水","a"],["稀释","v"],["该酸","h"]],"final":[["使用前","a"],["用水","a"],["稀释","v"],["该酸","h"],["。",""]],"tip":"两个状语都前移，中文顺序是「时间 → 方式 → 动词」。注意安全：永远是把酸加进水里，不能反过来。"}},{"w":"concentrated","zh":"浓的；高浓度的","ex":"Concentrated acid must be handled with care.","exzh":"浓酸必须小心操作。","ipa":"/ˈkɒnsntreɪtɪd/","syl":[[{"t":"con","p":"ˈkɒn"},{"t":"cen","p":"sn"},{"t":"tra","p":"treɪ"},{"t":"ted","p":"tɪd"}]],"tip":"浓的（形容词）；浓酸必须小心操作。","id":"sci:concentrated","tr":{"pat":"被动语态 + with 方式状语","flow":[["Concentrated acid","浓酸","s"],["must be handled","必须被操作","v"],["with care","要小心","a"]],"core":["Acid must be handled","酸必须被操作"],"asm":[["浓酸","s"],["必须",""],["小心","a"],["操作","v"]],"final":[["浓酸","s"],["必须",""],["小心操作","v"],["。",""]],"tip":"英语被动 must be handled，中文说成主动「必须小心操作」。with care = carefully，介词短语当副词用。"}},{"w":"flammable","zh":"易燃的","ex":"Ethanol is flammable and must be kept away from flames.","exzh":"乙醇易燃，必须远离火焰。","ipa":"/ˈflæməbl/","syl":[[{"t":"flam","p":"ˈflæ"},{"t":"ma","p":"mə"},{"t":"ble","p":"bl"}]],"tip":"flame（火焰）+ -able → 易燃的。注意 inflammable 也是「易燃」，不是反义！","id":"sci:flammable","tr":{"pat":"并列谓语（系表 + 被动）","flow":[["Ethanol","乙醇","s"],["is flammable","是易燃的","v"],["and must be kept away","而且必须被隔开","v"],["from flames","离火焰远点","a"]],"core":["Ethanol is flammable and must be kept away","乙醇易燃且须远离"],"final":[["乙醇","s"],["易燃","v"],["，",""],["必须",""],["远离火焰","v"],["。",""]],"tip":"keep A away from B = 让 A 远离 B。被动式中文化成主动「必须远离」。顺带一提：inflammable 也是「易燃」，不是反义词，别被 in- 骗了。"}},{"w":"corrosive","zh":"腐蚀性的","ex":"Concentrated acids are corrosive.","exzh":"浓酸具有腐蚀性。","ipa":"/kəˈrəʊsɪv/","syl":[[{"t":"cor","p":"kə"},{"t":"ro","p":"ˈrəʊ"},{"t":"sive","p":"sɪv"}]],"tip":"cor- + rod（咬、啃，同 rodent 啮齿动物）→ 会「啃掉」东西 = 腐蚀性的。","id":"sci:corrosive","tr":{"pat":"系表结构（最简）","flow":[["Concentrated acids","浓酸","s"],["are","是","v"],["corrosive","有腐蚀性的","h"]],"core":["Acids are corrosive","酸有腐蚀性"],"final":[["浓酸","s"],["具有","v"],["腐蚀性","h"],["。",""]],"tip":"英语用形容词 corrosive，中文常改说成名词「具有腐蚀性」——词性转换的又一例。"}},{"w":"toxic","zh":"有毒的","ex":"Do not breathe in toxic gases.","exzh":"不要吸入有毒气体。","ipa":"/ˈtɒksɪk/","syl":[[{"t":"tox","p":"ˈtɒk"},{"t":"ic","p":"sɪk"}]],"tip":"toxikon 原指「涂在箭上的毒」→ 有毒的；有毒气体不能吸。","id":"sci:toxic","tr":{"pat":"否定祈使句","flow":[["Do not breathe in","不要吸入","v"],["toxic gases","有毒气体","h"]],"core":["Do not breathe in gases","不要吸入气体"],"final":[["不要",""],["吸入","v"],["有毒气体","h"],["。",""]],"tip":"Do not + 动词原形 = 否定祈使句。breathe in 是「吸入」，breathe out 是「呼出」。"}},{"w":"safety goggles","zh":"护目镜","ex":"Wear safety goggles during the experiment.","exzh":"实验过程中佩戴护目镜。","ipa":"/ˈseɪfti ˈɡɒɡlz/","syl":[[{"t":"safe","p":"ˈseɪf"},{"t":"ty","p":"ti"}],[{"t":"gog","p":"ˈɡɒ"},{"t":"gles","p":"ɡlz"}]],"tip":"护目镜；实验安全题的万能答案之一。","id":"sci:safety goggles","tr":{"pat":"祈使句 + during 时间状语","flow":[["Wear","戴","v"],["safety goggles","护目镜","h"],["during the experiment","在实验期间","a"]],"core":["Wear safety goggles","戴护目镜"],"asm":[["实验过程中","a"],["佩戴","v"],["护目镜","h"]],"final":[["实验过程中","a"],["佩戴","v"],["护目镜","h"],["。",""]],"tip":"during 时间状语中文提到句首。安全题问「一条注意事项」，写这句几乎总能得分。"}}]},{"id":7,"cn":"物理学基础词汇","en":"Basic Physics Vocabulary","words":[{"w":"speed","zh":"速率；速度大小","ex":"Speed is distance travelled per unit time.","exzh":"速率是单位时间内通过的距离。","ipa":"/spiːd/","syl":[[{"t":"speed","p":"spiːd"}]],"tip":"速率 = 距离 ÷ 时间，只有大小。","id":"sci:speed","tr":{"pat":"判断句 + 分词定语 + per 状语","flow":[["Speed","速率","s"],["is distance","就是距离","v"],["travelled","走过的","d"],["per unit time","每单位时间","a"]],"core":["Speed is distance","速率是距离"],"tree":[[0,"distance","距离"],[1,"travelled","通过的"],[2,"per unit time","单位时间内"]],"asm":[["单位时间内","a"],["通过的","d"],["距离","h"]],"final":[["速率","s"],["是","v"],["单位时间内","a"],["通过的","d"],["距离","h"],["。",""]],"tip":"travelled 是过去分词后置定语，per unit time 又限定它。两层都要前移，中心词「距离」留到最后。"}},{"w":"velocity","zh":"速度；有方向的速率","ex":"Velocity includes both speed and direction.","exzh":"速度同时包含大小和方向。","ipa":"/vɪˈlɒsəti/","syl":[[{"t":"ve","p":"vɪ"},{"t":"lo","p":"ˈlɒ"},{"t":"ci","p":"sə"},{"t":"ty","p":"ti"}]],"tip":"veloc（快）→ 速度：既有大小又有方向（矢量）。","id":"sci:velocity","tr":{"pat":"主谓宾 + both…and","flow":[["Velocity","速度","s"],["includes","包含","v"],["both speed and direction","大小和方向两样","h"]],"core":["Velocity includes speed and direction","速度包含大小和方向"],"final":[["速度","s"],["同时",""],["包含","v"],["大小和方向","h"],["。",""]],"tip":"both A and B = A 和 B 两者都。中文用「同时包含」把 both 的意思带出来。有方向的是 velocity，没方向的是 speed。"}},{"w":"acceleration","zh":"加速度","ex":"Acceleration is the rate of change of velocity.","exzh":"加速度是速度变化的快慢。","ipa":"/əkˌseləˈreɪʃn/","syl":[[{"t":"ac","p":"ək"},{"t":"ce","p":"ˌse"},{"t":"le","p":"lə"},{"t":"ra","p":"ˈreɪ"},{"t":"tion","p":"ʃn"}]],"tip":"ac- + celer（快，同 accelerator 油门）→ 速度变化的快慢 = 加速度。","id":"sci:acceleration","tr":{"pat":"判断句 + 两层 of 定语","flow":[["Acceleration","加速度","s"],["is the rate","是那个快慢","v"],["of change","变化的","d"],["of velocity","速度的","d"]],"core":["Acceleration is the rate","加速度是快慢"],"tree":[[0,"the rate","快慢"],[1,"of change","变化的"],[2,"of velocity","速度的"]],"asm":[["速度","d"],["变化的","d"],["快慢","h"]],"final":[["加速度","s"],["是","v"],["速度","d"],["变化的","d"],["快慢","h"],["。",""]],"tip":"两个 of 层层套下去：rate of (change of velocity)。中文从最里层「速度」开始往外装。"}},{"w":"force","zh":"力","ex":"A force can change the motion of an object.","exzh":"力可以改变物体的运动状态。","ipa":"/fɔːs/","syl":[[{"t":"force","p":"fɔːs"}]],"tip":"力：能改变物体运动状态或形状，单位 N。","id":"sci:force","tr":{"pat":"情态动词 + 主谓宾 + of 定语","flow":[["A force","力","s"],["can change","能够改变","v"],["the motion","运动状态","h"],["of an object","物体的","d"]],"core":["A force can change the motion","力能改变运动"],"tree":[[0,"the motion","运动状态"],[1,"of an object","物体的"]],"asm":[["物体的","d"],["运动状态","h"]],"final":[["力","s"],["可以改变","v"],["物体的","d"],["运动状态","h"],["。",""]],"tip":"motion 译成「运动状态」比「运动」准确——力改变的是速度大小或方向，不是让它动起来。"}},{"w":"gravity","zh":"重力；引力","ex":"Gravity pulls objects towards the Earth.","exzh":"重力把物体拉向地球。","ipa":"/ˈɡrævɪti/","syl":[[{"t":"gra","p":"ˈɡræ"},{"t":"vi","p":"vɪ"},{"t":"ty","p":"ti"}]],"tip":"grav（重）→ 重力，把物体拉向地球。","id":"sci:gravity","tr":{"pat":"主谓宾 + towards 方向状语","flow":[["Gravity","重力","s"],["pulls","拉","v"],["objects","物体","h"],["towards the Earth","朝地球去","a"]],"core":["Gravity pulls objects","重力拉物体"],"final":[["重力","s"],["把物体","h"],["拉向","v"],["地球","a"],["。",""]],"tip":"「pull A towards B」中文合成「把 A 拉向 B」，动词和介词并成一个词。"}},{"w":"pressure","zh":"压强","ex":"Gas pressure is caused by particle collisions with the container walls.","exzh":"气体压强由粒子与容器壁的碰撞产生。","ipa":"/ˈpreʃə/","syl":[[{"t":"pres","p":"ˈpre"},{"t":"sure","p":"ʃə"}]],"tip":"press（压）+ -ure → 压强 = 力 ÷ 面积；气体压强来自粒子碰撞容器壁。","id":"sci:pressure","tr":{"pat":"被动语态 + 介词短语","flow":[["Gas pressure","气体压强","s"],["is caused by","由……产生","v"],["particle collisions","粒子碰撞","h"],["with the container walls","跟容器壁的","d"]],"core":["Pressure is caused by collisions","压强由碰撞产生"],"tree":[[0,"particle collisions","粒子碰撞"],[1,"with the container walls","与容器壁的"]],"asm":[["粒子","h"],["与容器壁的","d"],["碰撞","h"]],"final":[["气体压强","s"],["由","v"],["粒子与容器壁的","d"],["碰撞","h"],["产生","v"],["。",""]],"tip":"be + 过去分词 = 被动。中文很少说「被产生」，用「由……产生／造成」。with 短语修饰 collisions，同样要前移。"}},{"w":"density","zh":"密度","ex":"Density is mass divided by volume.","exzh":"密度等于质量除以体积。","ipa":"/ˈdensəti/","syl":[[{"t":"den","p":"ˈden"},{"t":"si","p":"sə"},{"t":"ty","p":"ti"}]],"tip":"dense（密集）+ -ity → 密度 = 质量 ÷ 体积。","id":"sci:density","tr":{"pat":"判断句 + 分词短语","flow":[["Density","密度","s"],["is mass","就是质量","v"],["divided by volume","被体积除过的","d"]],"core":["Density is mass","密度是质量"],"final":[["密度","s"],["等于","v"],["质量除以体积","h"],["。",""]],"tip":"divided by 是过去分词短语作后置定语，字面「被体积除的质量」。中文按算式说「质量除以体积」就行，不必硬套定语结构。"}},{"w":"electric current","zh":"电流","ex":"Electric current is the flow of electric charge.","exzh":"电流是电荷的定向移动。","ipa":"/ɪˈlektrɪk ˈkʌrənt/","syl":[[{"t":"e","p":"ɪ"},{"t":"lec","p":"ˈlek"},{"t":"tric","p":"trɪk"}],[{"t":"cur","p":"ˈkʌ"},{"t":"rent","p":"rənt"}]],"tip":"curr（流动，同 current 水流）→ 电荷的定向流动 = 电流，单位 A。","id":"sci:electric current","tr":{"pat":"判断句 + of 定语（名词化）","flow":[["Electric current","电流","s"],["is the flow","就是那种流动","v"],["of electric charge","电荷的","d"]],"core":["Current is the flow","电流是流动"],"tree":[[0,"the flow","移动"],[1,"of electric charge","电荷的"]],"asm":[["电荷的","d"],["定向移动","h"]],"final":[["电流","s"],["是","v"],["电荷的","d"],["定向移动","h"],["。",""]],"tip":"flow 是名词化的动作。中文译「移动」并补出「定向」——这是电流定义里的关键限定。"}},{"w":"voltage","zh":"电压","ex":"A higher voltage can transfer more energy per unit charge.","exzh":"更高的电压可以使单位电荷传递更多能量。","ipa":"/ˈvəʊltɪdʒ/","syl":[[{"t":"vol","p":"ˈvəʊl"},{"t":"tage","p":"tɪdʒ"}]],"tip":"以 Volta 命名 → 电压：每单位电荷传递的能量，单位 V。","id":"sci:voltage","tr":{"pat":"情态动词 + 主谓宾 + per 状语","flow":[["A higher voltage","更高的电压","s"],["can transfer","能够传递","v"],["more energy","更多能量","h"],["per unit charge","每单位电荷","a"]],"core":["Voltage can transfer energy","电压能传递能量"],"asm":[["使单位电荷","a"],["传递","v"],["更多能量","h"]],"final":[["更高的电压","s"],["可以使单位电荷","a"],["传递","v"],["更多能量","h"],["。",""]],"tip":"per unit charge = 每单位电荷。中文补一个「使」字，把「电压让电荷去传递」的关系说清楚。"}},{"w":"resistance","zh":"电阻","ex":"A longer wire usually has a greater resistance.","exzh":"更长的导线通常具有更大的电阻。","ipa":"/rɪˈzɪstəns/","syl":[[{"t":"re","p":"rɪ"},{"t":"sis","p":"ˈzɪs"},{"t":"tance","p":"təns"}]],"tip":"re-（反）+ sist（站）→ 站着挡路 = 电阻；导线越长电阻越大。","id":"sci:resistance","tr":{"pat":"主谓宾 + 比较级 + 频度副词","flow":[["A longer wire","更长的导线","s"],["usually has","通常具有","v"],["a greater resistance","更大的电阻","h"]],"core":["A wire has resistance","导线有电阻"],"final":[["更长的导线","s"],["通常",""],["具有","v"],["更大的电阻","h"],["。",""]],"tip":"两个比较级 longer / greater 前后呼应：越长越大。语序与中文一致，直译即可。"}},{"w":"conductor","zh":"导体","ex":"Copper is a good electrical conductor.","exzh":"铜是良好的电导体。","ipa":"/kənˈdʌktə/","syl":[[{"t":"con","p":"kən"},{"t":"duc","p":"ˈdʌk"},{"t":"tor","p":"tə"}]],"tip":"con- + duct（引导）→ 能把电引过去 = 导体（铜、金属）。","id":"sci:conductor","tr":{"pat":"判断句（最简）","flow":[["Copper","铜","s"],["is","是","v"],["a good electrical conductor","良好的电导体","h"]],"core":["Copper is a conductor","铜是导体"],"final":[["铜","s"],["是","v"],["良好的电导体","h"],["。",""]],"tip":"electrical 是前置定语，不用移位。金属都是良导体，因为有自由电子。"}},{"w":"insulator","zh":"绝缘体","ex":"Plastic is an electrical insulator.","exzh":"塑料是电绝缘体。","ipa":"/ˈɪnsjʊleɪtə/","syl":[[{"t":"in","p":"ˈɪn"},{"t":"su","p":"sjʊ"},{"t":"la","p":"leɪ"},{"t":"tor","p":"tə"}]],"tip":"insula（岛屿）→ 像孤岛一样不通电 = 绝缘体（塑料）。","id":"sci:insulator","tr":{"pat":"判断句（最简）","flow":[["Plastic","塑料","s"],["is","是","v"],["an electrical insulator","电绝缘体","h"]],"core":["Plastic is an insulator","塑料是绝缘体"],"final":[["塑料","s"],["是","v"],["电绝缘体","h"],["。",""]],"tip":"与 conductor 那句成对记。导线外面包塑料，正是这两个词的实际用途。"}},{"w":"wave","zh":"波","ex":"Sound travels as a wave.","exzh":"声音以波的形式传播。","ipa":"/weɪv/","syl":[[{"t":"wave","p":"weɪv"}]],"tip":"波：声音以波的形式传播，能量随波传递。","id":"sci:wave","tr":{"pat":"主谓 + as 方式状语","flow":[["Sound","声音","s"],["travels","传播","v"],["as a wave","以波的形式","a"]],"core":["Sound travels","声音传播"],"final":[["声音","s"],["以波的形式","a"],["传播","v"],["。",""]],"tip":"as = 作为、以……形式，这里是方式状语。中文提到动词前面。"}},{"w":"frequency","zh":"频率","ex":"A higher frequency produces a higher-pitched sound.","exzh":"更高的频率产生更高的音调。","ipa":"/ˈfriːkwənsi/","syl":[[{"t":"fre","p":"ˈfriː"},{"t":"quen","p":"kwən"},{"t":"cy","p":"si"}]],"tip":"frequent（频繁）→ 频率，单位 Hz；频率越高音调越高。","id":"sci:frequency","tr":{"pat":"主谓宾 + 比较级","flow":[["A higher frequency","更高的频率","s"],["produces","产生","v"],["a higher-pitched sound","音调更高的声音","h"]],"core":["Frequency produces sound","频率产生声音"],"final":[["更高的频率","s"],["产生","v"],["更高的音调","h"],["。",""]],"tip":"higher-pitched 是复合形容词（连字符连接），整体作前置定语。注意区分：pitch 是音调，loudness 才是响度。"}},{"w":"energy transfer","zh":"能量转移","ex":"Heating is a method of energy transfer.","exzh":"加热是一种能量转移方式。","ipa":"/ˈenədʒi ˈtrænsfɜː/","syl":[[{"t":"e","p":"ˈe"},{"t":"ner","p":"nə"},{"t":"gy","p":"dʒi"}],[{"t":"trans","p":"ˈtræns"},{"t":"fer","p":"fɜː"}]],"tip":"trans-（横过）+ fer（带，同 ferry 渡船）→ 能量从一处带到另一处。","id":"sci:energy transfer","tr":{"pat":"判断句 + of 定语","flow":[["Heating","加热","s"],["is a method","是一种方式","v"],["of energy transfer","能量转移的","d"]],"core":["Heating is a method","加热是一种方式"],"tree":[[0,"a method","方式"],[1,"of energy transfer","能量转移的"]],"asm":[["能量转移","d"],["方式","h"]],"final":[["加热","s"],["是","v"],["一种能量转移","d"],["方式","h"],["。",""]],"tip":"动名词 Heating 作主语。of 短语前移，「能量转移方式」是一个整体术语。"}}]},{"id":8,"cn":"生物与环境基础词汇","en":"Basic Biology and Environmental Vocabulary","words":[{"w":"cell","zh":"细胞","ex":"The cell is the basic unit of life.","exzh":"细胞是生命的基本单位。","ipa":"/sel/","syl":[[{"t":"cell","p":"sel"}]],"tip":"cella（小房间）→ 细胞，生命的基本单位。","id":"sci:cell","tr":{"pat":"判断句 + of 定语","flow":[["The cell","细胞","s"],["is the basic unit","是基本单位","v"],["of life","生命的","d"]],"core":["The cell is the basic unit","细胞是基本单位"],"tree":[[0,"the basic unit","基本单位"],[1,"of life","生命的"]],"asm":[["生命的","d"],["基本单位","h"]],"final":[["细胞","s"],["是","v"],["生命的","d"],["基本单位","h"],["。",""]],"tip":"of 短语前移。生命层次：细胞 → 组织 → 器官 → 生物体，这四句可以串起来记。"}},{"w":"tissue","zh":"组织","ex":"A tissue is a group of similar cells working together.","exzh":"组织是共同工作的相似细胞群。","ipa":"/ˈtɪʃuː/","syl":[[{"t":"tis","p":"ˈtɪ"},{"t":"sue","p":"ʃuː"}]],"tip":"相似细胞组成的「一层织物」= 组织。","id":"sci:tissue","tr":{"pat":"判断句 + of 定语 + 分词定语","flow":[["A tissue","组织","s"],["is a group","是一群","v"],["of similar cells","相似细胞的","d"],["working together","一起工作的","d"]],"core":["A tissue is a group","组织是一群"],"tree":[[0,"a group","群"],[1,"of similar cells","相似细胞的"],[2,"working together","共同工作的"]],"asm":[["共同工作的","d"],["相似细胞","d"],["群","h"]],"final":[["组织","s"],["是","v"],["共同工作的","d"],["相似细胞群","h"],["。",""]],"tip":"working together 是现在分词作后置定语，修饰 cells。两层定语都前移，离中心词越近的越靠后说。"}},{"w":"organ","zh":"器官","ex":"The heart is an organ.","exzh":"心脏是一个器官。","ipa":"/ˈɔːɡən/","syl":[[{"t":"or","p":"ˈɔː"},{"t":"gan","p":"ɡən"}]],"tip":"器官（心脏、肺）；由不同组织构成。","id":"sci:organ","tr":{"pat":"判断句（最简）","flow":[["The heart","心脏","s"],["is","是","v"],["an organ","一个器官","h"]],"core":["The heart is an organ","心脏是器官"],"final":[["心脏","s"],["是","v"],["一个器官","h"],["。",""]],"tip":"全书最短的句子之一。A is B 结构，英汉语序完全一致。"}},{"w":"organism","zh":"生物体","ex":"A bacterium is a single-celled organism.","exzh":"细菌是一种单细胞生物。","ipa":"/ˈɔːɡənɪzəm/","syl":[[{"t":"or","p":"ˈɔː"},{"t":"ga","p":"ɡə"},{"t":"nism","p":"nɪzəm"}]],"tip":"organ + -ism → 完整的生物体（细菌也算，单细胞生物）。","id":"sci:organism","tr":{"pat":"判断句 + 复合形容词","flow":[["A bacterium","细菌","s"],["is","是","v"],["a single-celled organism","一种单细胞生物","h"]],"core":["A bacterium is an organism","细菌是生物"],"final":[["细菌","s"],["是","v"],["一种单细胞生物","h"],["。",""]],"tip":"bacterium 是单数，复数是 bacteria，别搞反。single-celled 是复合形容词作前置定语。"}},{"w":"diffusion","zh":"扩散","ex":"Diffusion is the net movement of particles from high to low concentration.","exzh":"扩散是粒子由高浓度区域向低浓度区域的净移动。","ipa":"/dɪˈfjuːʒn/","syl":[[{"t":"dif","p":"dɪ"},{"t":"fu","p":"ˈfjuː"},{"t":"sion","p":"ʒn"}]],"tip":"dif-（分散）+ fus（流，同 fuse 熔）→ 粒子由高浓度向低浓度净移动。","id":"sci:diffusion","tr":{"pat":"判断句 + of 定语 + from…to 定语","flow":[["Diffusion","扩散","s"],["is the net movement","是那种净移动","v"],["of particles","粒子的","d"],["from high to low concentration","从高浓度到低浓度的","d"]],"core":["Diffusion is the net movement","扩散是净移动"],"tree":[[0,"the net movement","净移动"],[1,"of particles","粒子的"],[1,"from high to low concentration","由高浓度向低浓度的"]],"asm":[["粒子","d"],["由高浓度区域向低浓度区域的","d"],["净移动","h"]],"final":[["扩散","s"],["是","v"],["粒子","d"],["由高浓度区域向低浓度区域的","d"],["净移动","h"],["。",""]],"tip":"两个定语并排挂在 movement 上：of 说谁在动，from…to 说往哪动。中文全部前移，中心词「净移动」压到最后。net = 净，不能漏。"}},{"w":"osmosis","zh":"渗透作用","ex":"Osmosis is the movement of water through a partially permeable membrane.","exzh":"渗透是水通过半透膜的移动。","ipa":"/ɒzˈməʊsɪs/","syl":[[{"t":"os","p":"ɒz"},{"t":"mo","p":"ˈməʊ"},{"t":"sis","p":"sɪs"}]],"tip":"osmos（推动）→ 渗透：只有「水」通过半透膜的移动。","id":"sci:osmosis","tr":{"pat":"判断句 + of 定语 + through 定语","flow":[["Osmosis","渗透","s"],["is the movement","是那种移动","v"],["of water","水的","d"],["through a partially permeable membrane","穿过半透膜的","d"]],"core":["Osmosis is the movement","渗透是移动"],"tree":[[0,"the movement","移动"],[1,"of water","水的"],[1,"through a partially permeable membrane","通过半透膜的"]],"asm":[["水","d"],["通过半透膜的","d"],["移动","h"]],"final":[["渗透","s"],["是","v"],["水","d"],["通过半透膜的","d"],["移动","h"],["。",""]],"tip":"和 diffusion 那句结构一模一样，只是移动的主体限定为「水」，路径限定为「半透膜」。两句对照着记，考试最爱考这个区别。"}},{"w":"enzyme","zh":"酶","ex":"An enzyme is a biological catalyst.","exzh":"酶是一种生物催化剂。","ipa":"/ˈenzaɪm/","syl":[[{"t":"en","p":"ˈen"},{"t":"zyme","p":"zaɪm"}]],"tip":"en-（在内）+ zyme（酵母）→ 酶，生物催化剂，怕高温。","id":"sci:enzyme","tr":{"pat":"判断句（最简）","flow":[["An enzyme","酶","s"],["is","是","v"],["a biological catalyst","一种生物催化剂","h"]],"core":["An enzyme is a catalyst","酶是催化剂"],"final":[["酶","s"],["是","v"],["一种生物催化剂","h"],["。",""]],"tip":"把酶和 catalyst 那条串起来：催化剂自身不被消耗，酶也一样，但酶怕高温会变性失活。"}},{"w":"respiration","zh":"呼吸作用","ex":"Respiration releases energy from glucose.","exzh":"呼吸作用从葡萄糖中释放能量。","ipa":"/ˌrespəˈreɪʃn/","syl":[[{"t":"res","p":"ˌres"},{"t":"pi","p":"pə"},{"t":"ra","p":"ˈreɪ"},{"t":"tion","p":"ʃn"}]],"tip":"re-（反复）+ spir（呼吸，同 spirit 气息）→ 呼吸作用，从葡萄糖释放能量。","id":"sci:respiration","tr":{"pat":"主谓宾 + from 来源状语","flow":[["Respiration","呼吸作用","s"],["releases","释放","v"],["energy","能量","h"],["from glucose","从葡萄糖里","a"]],"core":["Respiration releases energy","呼吸作用释放能量"],"asm":[["从葡萄糖中","a"],["释放","v"],["能量","h"]],"final":[["呼吸作用","s"],["从葡萄糖中","a"],["释放","v"],["能量","h"],["。",""]],"tip":"from 表来源，中文提到动词前面。注意 respiration 是「呼吸作用」这个化学过程，不是「呼吸」这个动作（那是 breathing）。"}},{"w":"photosynthesis","zh":"光合作用","ex":"Plants use light energy for photosynthesis.","exzh":"植物利用光能进行光合作用。","ipa":"/ˌfəʊtəʊˈsɪnθəsɪs/","syl":[[{"t":"pho","p":"ˌfəʊ"},{"t":"to","p":"təʊ"},{"t":"syn","p":"ˈsɪn"},{"t":"the","p":"θə"},{"t":"sis","p":"sɪs"}]],"tip":"photo（光）+ syn（一起）+ thesis（放置）→ 用光把物质合起来 = 光合作用。","id":"sci:photosynthesis","tr":{"pat":"主谓宾 + for 目的状语","flow":[["Plants","植物","s"],["use","利用","v"],["light energy","光能","h"],["for photosynthesis","用来进行光合作用","a"]],"core":["Plants use light energy","植物利用光能"],"final":[["植物","s"],["利用","v"],["光能","h"],["进行光合作用","a"],["。",""]],"tip":"for + 名词表目的。中文把名词 photosynthesis 还原成动宾「进行光合作用」，读着更顺。"}},{"w":"nutrient","zh":"营养物质","ex":"Plants need mineral nutrients for healthy growth.","exzh":"植物健康生长需要矿物质营养。","ipa":"/ˈnjuːtriənt/","syl":[[{"t":"nu","p":"ˈnjuː"},{"t":"tri","p":"tri"},{"t":"ent","p":"ənt"}]],"tip":"nutri（滋养，同 nurse 护理）→ 营养物质，植物需要矿物营养。","id":"sci:nutrient","tr":{"pat":"主谓宾 + for 目的状语","flow":[["Plants","植物","s"],["need","需要","v"],["mineral nutrients","矿物质营养","h"],["for healthy growth","为了健康生长","a"]],"core":["Plants need nutrients","植物需要营养"],"asm":[["植物健康生长","a"],["需要","v"],["矿物质营养","h"]],"final":[["植物健康生长","a"],["需要","v"],["矿物质营养","h"],["。",""]],"tip":"for 目的状语中文提到句首，并把名词 growth 还原成动词「生长」——名词化还原的又一例。"}},{"w":"habitat","zh":"栖息地","ex":"A habitat provides the conditions an organism needs.","exzh":"栖息地为生物提供生存所需的条件。","ipa":"/ˈhæbɪtæt/","syl":[[{"t":"ha","p":"ˈhæ"},{"t":"bi","p":"bɪ"},{"t":"tat","p":"tæt"}]],"tip":"habit（居住，同 inhabit）→ 生物居住的地方 = 栖息地。","id":"sci:habitat","tr":{"pat":"主谓宾 + 省略 that 的定语从句","flow":[["A habitat","栖息地","s"],["provides","提供","v"],["the conditions","那些条件","h"],["an organism needs","生物所需要的","d"]],"core":["A habitat provides the conditions","栖息地提供条件"],"tree":[[0,"the conditions","条件"],[1,"(that) an organism needs","生物生存所需的"]],"asm":[["生物","d"],["生存所需的","d"],["条件","h"]],"final":[["栖息地","s"],["为生物","d"],["提供","v"],["生存所需的","d"],["条件","h"],["。",""]],"tip":"这里省略了关系词 that——「the conditions (that) an organism needs」。看到「名词 + 主语 + 谓语」直接相连，就要想到是省略了 that 的定语从句。"}},{"w":"population","zh":"种群","ex":"A population contains organisms of the same species in one area.","exzh":"一个种群由同一区域内同一物种的生物组成。","ipa":"/ˌpɒpjʊˈleɪʃn/","syl":[[{"t":"po","p":"ˌpɒ"},{"t":"pu","p":"pjʊ"},{"t":"la","p":"ˈleɪ"},{"t":"tion","p":"ʃn"}]],"tip":"people（人）→ 同一区域内同一物种的全部个体 = 种群。","id":"sci:population","tr":{"pat":"主谓宾 + of 定语 + in 定语","flow":[["A population","种群","s"],["contains","包含","v"],["organisms","生物","h"],["of the same species","同一物种的","d"],["in one area","在同一区域的","d"]],"core":["A population contains organisms","种群包含生物"],"tree":[[0,"organisms","生物"],[1,"of the same species","同一物种的"],[1,"in one area","同一区域内的"]],"asm":[["同一区域内","d"],["同一物种的","d"],["生物","h"]],"final":[["一个种群","s"],["由","v"],["同一区域内","d"],["同一物种的","d"],["生物","h"],["组成","v"],["。",""]],"tip":"两个定语并挂在 organisms 上。英语 contains（包含）在中文里说成「由……组成」更自然，主宾关系正好反过来。"}},{"w":"adaptation","zh":"适应性特征","ex":"Thick fur is an adaptation to a cold environment.","exzh":"厚毛皮是对寒冷环境的一种适应。","ipa":"/ˌædæpˈteɪʃn/","syl":[[{"t":"a","p":"ˌæ"},{"t":"dap","p":"dæp"},{"t":"ta","p":"ˈteɪ"},{"t":"tion","p":"ʃn"}]],"tip":"adapt（适应）+ -ation → 适应性特征，如厚毛皮适应寒冷。","id":"sci:adaptation","tr":{"pat":"判断句 + to 后置定语","flow":[["Thick fur","厚毛皮","s"],["is an adaptation","是一种适应","v"],["to a cold environment","对寒冷环境的","d"]],"core":["Thick fur is an adaptation","厚毛皮是适应"],"tree":[[0,"an adaptation","适应"],[1,"to a cold environment","对寒冷环境的"]],"asm":[["对寒冷环境的","d"],["一种适应","h"]],"final":[["厚毛皮","s"],["是","v"],["对寒冷环境的","d"],["一种适应","h"],["。",""]],"tip":"adaptation to = 对……的适应，介词是 to 不是 for。整块前移。"}},{"w":"ecosystem","zh":"生态系统","ex":"An ecosystem includes organisms and their physical environment.","exzh":"生态系统包括生物及其物理环境。","ipa":"/ˈiːkəʊsɪstəm/","syl":[[{"t":"e","p":"ˈiː"},{"t":"co","p":"kəʊ"},{"t":"sys","p":"sɪs"},{"t":"tem","p":"təm"}]],"tip":"eco（家、环境）+ system → 生物 + 其物理环境 = 生态系统。","id":"sci:ecosystem","tr":{"pat":"主谓宾 + 并列宾语","flow":[["An ecosystem","生态系统","s"],["includes","包括","v"],["organisms","生物","h"],["and their physical environment","以及它们的物理环境","h"]],"core":["An ecosystem includes organisms and environment","生态系统包括生物和环境"],"final":[["生态系统","s"],["包括","v"],["生物及其物理环境","h"],["。",""]],"tip":"and 连接并列宾语。their 指代前面的 organisms，中文用「其」字接住，「生物及其物理环境」比「生物和它们的物理环境」更凝练。"}},{"w":"food chain","zh":"食物链","ex":"A food chain shows how energy passes between organisms.","exzh":"食物链表示能量如何在生物之间传递。","ipa":"/fuːd tʃeɪn/","syl":[[{"t":"food","p":"fuːd"}],[{"t":"chain","p":"tʃeɪn"}]],"tip":"食物链：箭头方向 = 能量传递方向。","id":"sci:food chain","tr":{"pat":"主谓宾 + how 宾语从句","flow":[["A food chain","食物链","s"],["shows","表示","v"],["how energy passes between organisms","能量怎样在生物之间传递","c"]],"core":["A food chain shows how…","食物链表示……如何"],"final":[["食物链","s"],["表示","v"],["能量如何在生物之间传递","c"],["。",""]],"tip":"how 引导宾语从句，整块作 shows 的宾语，语序与中文一致。食物链的箭头方向就是能量传递方向。"}},{"w":"renewable resource","zh":"可再生资源","ex":"Solar energy is a renewable resource.","exzh":"太阳能是一种可再生资源。","ipa":"/rɪˈnjuːəbl rɪˈzɔːs/","syl":[[{"t":"re","p":"rɪ"},{"t":"new","p":"ˈnjuː"},{"t":"a","p":"ə"},{"t":"ble","p":"bl"}], :"in + 名词表方式，中文提到动词前。directions 用复数，强调方向不止一个、还在变。"}},{"w":"high concentration","zh":"高浓度","ex":"There are more particles in a region of high concentration.","exzh":"高浓度区域内的粒子更多。","id":"sci:high concentration","ipa":"/haɪ ˌkɒnsənˈtreɪʃn/","syl":[[{"t":"high","p":"haɪ"}],[{"t":"con","p":"ˌkɒn"},{"t":"cen","p":"sən"},{"t":"tra","p":"ˈtreɪ"},{"t":"tion","p":"ʃn"}]],"tip":"concentration（浓度）+ high → 单位体积内粒子多的那一侧，扩散的起点。","tr":{"pat":"There be 句型 + of 后置定语","flow":[["There are","存在","v"],["more particles","更多粒子","h"],["in a region","在一个区域里","a"],["of high concentration","高浓度的","d"]],"core":["There are more particles","有更多粒子"],"tree":[[0,"a region","区域"],[1,"of high concentration","高浓度的"]],"asm":[["高浓度","d"],["区域内的","a"],["粒子更多","h"]],"final":[["高浓度区域内的","a"],["粒子","h"],["更多","v"],["。",""]],"tip":"There be 句型直译成「有……」，但中文更常把地点提到句首说「某地有……」。of 短语修饰 region，照例前移。"}},{"w":"low concentration","zh":"低浓度","ex":"Particles spread into the region of low concentration.","exzh":"粒子扩散进入低浓度区域。","id":"sci:low concentration","ipa":"/ləʊ ˌkɒnsənˈtreɪʃn/","syl":[[{"t":"low","p":"ləʊ"}],[{"t":"con","p":"ˌkɒn"},{"t":"cen","p":"sən"},{"t":"tra","p":"ˈtreɪ"},{"t":"tion","p":"ʃn"}]],"tip":"与 high concentration 成对记：净移动的方向永远是由高指向低。","tr":{"pat":"主谓 + into 方向状语","flow":[["Particles","粒子","s"],["spread","扩散开","v"],["into the region","进入那个区域","a"],["of low concentration","低浓度的","d"]],"core":["Particles spread","粒子扩散"],"tree":[[0,"the region","区域"],[1,"of low concentration","低浓度的"]],"asm":[["低浓度","d"],["区域","a"]],"final":[["粒子","s"],["扩散进入","v"],["低浓度区域","a"],["。",""]],"tip":"与 high concentration 那句成对：一个说起点粒子多，一个说粒子往终点去。into 强调「进入内部」，比 in 更有方向感。"}},{"w":"net movement","zh":"净移动","ex":"The net movement is from high to low concentration.","exzh":"净移动的方向是由高浓度到低浓度。","id":"sci:net movement","ipa":"/net ˈmuːvmənt/","syl":[[{"t":"net","p":"net"}],[{"t":"move","p":"ˈmuːv"},{"t":"ment","p":"mənt"}]],"tip":"net 是「净、总」的意思（同 net weight 净重）→ 把所有随机运动叠加之后，剩下的那个总体方向。答扩散定义时这个词不能漏。","tr":{"pat":"判断句 + from…to 表语","flow":[[  立方厘米"],"final":[["体积","s"],["是","v"],["50立方厘米","h"],["。",""]],"tip":"cm³ 中文说「立方厘米」；数字和单位连写即可。"}},{"w":"precision","zh":"精度","ex":"The instrument has a precision of 1 mm.","exzh":"仪器精度为1 毫米。","id":"phy:precision","ipa":"/prɪˈsɪʒn/","syl":[[{"t":"pre","p":"prɪ"},{"t":"ci","p":"ˈsɪ"},{"t":"sion","p":"ʒn"}]],"tip":"pre-（预先）+ cis（切，同 scissors 剪刀）→ 切得整齐 = 多次测量彼此接近。","tr":{"pat":"判断句：主语 + have + 宾语 + of 后置定语","flow":[["The instrument","仪器","s"],["has a precision","有精度","v"],["of 1 mm","为 1 毫米","d"]],"core":["The instrument has a precision of 1 mm","仪器精度为 1 毫米"],"tree":[[0,"a precision","精度"],[1,"of 1 mm","为 1 毫米"]],"asm":[["精度","h"],["为 1 毫米","d"]],"final":[["仪器","s"],["精度","h"],["为","v"],["1毫米","h"],["。",""]],"tip":"「有精度为 1 毫米」太绕，中文说「仪器精度为 1 毫米」更顺。"}},{"w":"resolution","zh":"分辨率","ex":"Resolution is the smallest change that can be detected.","exzh":"分辨率是仪器可检测的最小变 化。","id":"phy:resolution","ipa":"/ˌrezəˈluːʃn/","syl":[[{"t":"re","p":"ˌre"},{"t":"so","p":"zə"},{"t":"lu","p":"ˈluː"},{"t":"tion","p":"ʃn"}]],"tip":"re-（再）+ solve（解开）+ -tion → 仪器能「解出」的最小变化 = 分辨率。","tr":{"pat":"判断句 + that 定语从句","flow":[["Resolution","分辨率","s"],["is","是","v"],["the smallest change","最小的变化","h"],["that can be detected","能被检测到的","d"]],"core":["Resolution is the smallest change","分辨率是最小的变化"],"tree":[[0,"the smallest change","最小的变化"],[1,"that can be detected","能被检测到的"]],"asm":[["能被检测到的","d"],["最小变化","h"]],"final":[["分辨率","s"],["是","v"],["仪器可检测的","d"],["最小变化","h"],["。",""]],"tip":"that 从句是后置定语，中文放中心词前；「仪器可检测的」比直译「能被检测到的」更贴物理语境。"}},{"w":"uncertainty","zh":"不确定度","ex":"Every measurement has uncertainty.","exzh":"每次测量都存在不确定度。","id":"phy:uncertainty","ipa":"/ˌʌnˈsɜːtənti/","syl":[[{"t":"un","p":"ˌʌn"},{"t":"cer","p":"ˈsɜː"},{"t":"tain","p":"tən"},{"t":"ty","p":"ti"}]],"tip":"un-（不）+ certain（确定）+ -ty → 读数里说不准的那段范围 = 不确定度（±0.1 mm 之类）。","tr":{"pat":"判断句：主语 + 谓语 + 宾语","flow":[["Every measurement","每次测量","s"],["has","存在","v"],["uncertainty","不确定度","h"]],"core":["Every measurement has uncertainty","每次测量都有不确定度"]
